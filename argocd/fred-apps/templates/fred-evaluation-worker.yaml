{{- if .Values.fredEvaluationWorker.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.fredEvaluationWorker.serviceAccount.name }}
  labels:
    {{- include "fredlab-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: fred-evaluation-worker
# No Workload Identity annotation: the worker calls Mistral over HTTPS (MISTRAL_API_KEY)
# and Temporal/Postgres in-cluster; it needs no GCS/Vertex access.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fredlab-infra.fredEvaluationWorkerName" . }}
  labels:
    {{- include "fredlab-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: fred-evaluation-worker
spec:
  replicas: {{ .Values.fredEvaluationWorker.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0          # no spare node on this cluster — don't create a surge pod
      maxUnavailable: 1    # free the old pod's memory first, then schedule the new one
  selector:
    matchLabels:
      {{- include "fredlab-infra.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: fred-evaluation-worker
  template:
    metadata:
      labels:
        {{- include "fredlab-infra.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: fred-evaluation-worker
    spec:
      serviceAccountName: {{ .Values.fredEvaluationWorker.serviceAccount.name }}
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fred-evaluation-worker
          image: {{ printf "%s:%s" (required "fredEvaluationWorker.image.repository is required when fredEvaluationWorker.enabled=true." .Values.fredEvaluationWorker.image.repository) (required "fredEvaluationWorker.image.tag is required when fredEvaluationWorker.enabled=true." .Values.fredEvaluationWorker.image.tag) | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          # The Temporal worker entrypoint. It drains the `evaluation` task queue defined
          # in the shared fred-evaluation-config ConfigMap; the backend submits campaign
          # workflows onto the same queue. A backend with no worker queues forever.
          command:
            - python
            - -m
            - fred_evaluation_backend.main_worker
          env:
            - name: CONFIG_FILE
              value: /etc/fred/evaluation/configuration.yaml
            - name: ENV_FILE
              value: /etc/fred/evaluation/empty.env
            - name: FRED_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "fredlab-infra.secretName" . }}
                  key: POSTGRES_EVALUATION_PASSWORD
            - name: KEYCLOAK_EVALUATION_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "fredlab-infra.secretName" . }}
                  key: KEYCLOAK_EVALUATION_CLIENT_SECRET
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "fredlab-infra.secretName" . }}
                  key: MISTRAL_API_KEY
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "fredlab-infra.secretName" . }}
                  key: LANGFUSE_PUBLIC_KEY
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "fredlab-infra.secretName" . }}
                  key: LANGFUSE_SECRET_KEY
          resources:
            {{- toYaml .Values.fredEvaluationWorker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: fred-evaluation-config
              mountPath: /etc/fred/evaluation
              readOnly: true
      volumes:
        - name: fred-evaluation-config
          configMap:
            name: {{ include "fredlab-infra.fredEvaluationConfigName" . }}
{{- end }}
