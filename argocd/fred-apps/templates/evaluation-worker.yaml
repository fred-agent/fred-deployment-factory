{{- if .Values.evaluationWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fredlab-infra.evaluationWorkerName" . }}
  labels:
    {{- include "fredlab-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: evaluation-worker
spec:
  replicas: {{ .Values.evaluationWorker.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0          # no spare node on this cluster — don't create a surge pod
      maxUnavailable: 1    # free the old pod's memory first, then schedule the new one
  selector:
    matchLabels:
      {{- include "fredlab-infra.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: evaluation-worker
  template:
    metadata:
      labels:
        {{- include "fredlab-infra.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: evaluation-worker
    spec:
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: evaluation-worker
          image: {{ printf "%s:%s" (required "evaluationWorker.image.repository is required when evaluationWorker.enabled=true." .Values.evaluationWorker.image.repository) (required "evaluationWorker.image.tag is required when evaluationWorker.enabled=true." .Values.evaluationWorker.image.tag) | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          # Same image as the evaluation API, but run the Temporal worker entrypoint
          # instead of the FastAPI server. The worker polls the `evaluation` task queue
          # and executes the campaign workflows the backend enqueues.
          command:
            - python
            - -m
            - fred_evaluation_backend.main_worker
          # Env mirrors the evaluation-backend: same config + same connections
          # (Postgres evaluation DB, Keycloak M2M, Temporal).
          env:
            - name: CONFIG_FILE
              value: /etc/fred/evaluation/configuration.yaml
            - name: ENV_FILE
              value: /etc/fred/evaluation/empty.env
            - name: FRED_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "fredlab-infra.secretName" . }}
                  key: POSTGRES_EVALUATION_PASSWORD
            - name: KEYCLOAK_EVAL_WORKER_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "fredlab-infra.secretName" . }}
                  key: KEYCLOAK_EVAL_WORKER_CLIENT_SECRET
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "fredlab-infra.secretName" . }}
                  key: MISTRAL_API_KEY
          resources:
            {{- toYaml .Values.evaluationWorker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: evaluation-config
              mountPath: /etc/fred/evaluation
              readOnly: true
      volumes:
        - name: evaluation-config
          configMap:
            name: {{ include "fredlab-infra.evaluationConfigName" . }}
{{- end }}
