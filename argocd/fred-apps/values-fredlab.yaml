# fredlab environment overlay — enables the apps and pins their images.
# The ArgoCD Application loads this AFTER values.yaml.
#
# This is the file the image-bump step (scripted commit) will edit: it sets the
# YYYYMMDD-<shortsha> tag per app, commits, and ArgoCD syncs the new tag.
#
# Region/project: GKE is europe-west9 but Artifact Registry is europe-west1
# (matches the build scripts' REGION default). Confirm the project id.

controlPlane:
  enabled: true
  image:
    repository: europe-west1-docker.pkg.dev/fredlab-playground/fredlab-repo/control-plane-backend
    # Pinned to the tag CURRENTLY LIVE (from bin/fredlab-status.sh) so the GitOps
    # cutover is image-neutral — ownership moves to ArgoCD, the running image does not
    # change. Bump to the latest swift only AFTER the handoff is proven, via the
    # image-bump step. NB: the real tag format is YYYYMMDD-swift-<shortsha>.
    tag: "20260624-swift-91b49147"
