# fredlab environment overlay — enables the apps and pins their images.
# The ArgoCD Application loads this AFTER values.yaml.
#
# This is the file the image-bump step (scripted commit) will edit: it sets the
# YYYYMMDD-<shortsha> tag per app, commits, and ArgoCD syncs the new tag.
#
# Region/project: GKE is europe-west9 but Artifact Registry is europe-west1
# (matches the build scripts' REGION default). Confirm the project id.

controlPlane:
  enabled: true
  image:
    repository: europe-west1-docker.pkg.dev/fredlab-playground/fredlab-repo/control-plane-backend
    # The release-tag marker lets bin/fredlab-release.sh rewrite this line. Format:
    # YYYYMMDD-swift-<shortsha>. Change = commit + push -> ArgoCD deploys it.
    tag: "20260707-swift-565d884f" # release-tag: control-plane-backend

controlPlaneWorker:
  enabled: true
  image:
    # Same image as the backend (worker runs the control_plane_backend.main_worker
    # entrypoint off it). Shares the control-plane-backend release-tag marker, so
    # bin/fredlab-release.sh bumps this line together with the backend.
    repository: europe-west1-docker.pkg.dev/fredlab-playground/fredlab-repo/control-plane-backend
    tag: "20260707-swift-565d884f" # release-tag: control-plane-backend

fredAgents:
  enabled: true
  serviceAccount:
    # GSA with roles/aiplatform.user, bound to KSA default/fred-agents via Workload Identity.
    gcpServiceAccount: fredlab-knowledge-flow-gcs@fredlab-playground.iam.gserviceaccount.com
  image:
    repository: europe-west1-docker.pkg.dev/fredlab-playground/fredlab-repo/fred-agents
    tag: "20260707-swift-565d884f" # release-tag: fred-agents

knowledgeFlow:
  enabled: true
  serviceAccount:
    # GSA with roles/storage.objectAdmin + roles/aiplatform.user, bound via Workload Identity.
    gcpServiceAccount: fredlab-knowledge-flow-gcs@fredlab-playground.iam.gserviceaccount.com
  image:
    repository: europe-west1-docker.pkg.dev/fredlab-playground/fredlab-repo/knowledge-flow-backend
    tag: "20260708-swift-c8e9f0fc" # release-tag: knowledge-flow-backend
  config:
    models:
      # Vertex AI project (matches the imperative deploy's VERTEX_PROJECT=PROJECT_ID).
      project: fredlab-playground

knowledgeFlowWorker:
  enabled: true
  serviceAccount:
    gcpServiceAccount: fredlab-knowledge-flow-gcs@fredlab-playground.iam.gserviceaccount.com
  image:
    # Same image as the backend (worker runs the main_worker entrypoint off it).
    repository: europe-west1-docker.pkg.dev/fredlab-playground/fredlab-repo/knowledge-flow-backend
    tag: "20260708-swift-c8e9f0fc" # release-tag: knowledge-flow-backend

fredFrontend:
  enabled: true
  image:
    repository: europe-west1-docker.pkg.dev/fredlab-playground/fredlab-repo/fred-frontend
    tag: "20260707-swift-565d884f" # release-tag: fred-frontend

# fred-agent-evaluator — STAGED (enabled once images are built + eval DB migrated → DF-4).
# Internal-only (no ingress). Two distinct images. Judge switches to Vertex Gemini in DF-3.
fredEvaluation:
  enabled: false
  image:
    repository: europe-west1-docker.pkg.dev/fredlab-playground/fredlab-repo/fred-evaluation-api
    tag: ""   # set to the built tag in DF-4 (bin/fredlab-build fred-evaluation-api <tag>)

fredEvaluationWorker:
  enabled: false
  image:
    repository: europe-west1-docker.pkg.dev/fredlab-playground/fredlab-repo/fred-evaluation-worker
    tag: ""   # set to the built tag in DF-4 (bin/fredlab-build fred-evaluation-worker <tag>)
