# =============================================================================
# The WebDAV Knowledge Base on the local k3d instance: values for the
# webdav-knowledge-base chart (the published one, or a checkout's
# deploy/charts/webdav-knowledge-base), deployed by `make k3d-app APP=webdav-kb
# [DIR=<checkout>]` through helmfile.yaml.gotmpl. They sit under `knowledge-base:`,
# the chart's dependency.
#
# Only what k3d decides lives here; the chart's defaults already name Fred's
# services (control-plane-backend:8222, knowledge-flow-backend:8000). Fred lets
# it publish from this application's registration.yaml.
#
#   address  where a service of the k3d stack (`make k3d-up`) is reached
#   secret   the client secret, by reference to fred-secrets; never a literal
#
# Image tags are not set here: the published chart's own, or, with DIR, the
# checkout's deploy/k3d/build writes the image's content tag into the image
# values the helmfile adds after this file.
# =============================================================================
knowledge-base:
  configuration:
    security:
      m2m:
        realm_url: "http://keycloak:8080/realms/app"   # address: the issuer Fred trusts
    scheduler:
      temporal:
        host: "temporal:7233"                          # address
  # secret: the kb-fred.webdav client (identities.yaml) has its secret in
  # fred-secrets, generated by the factory the first time.
  extraEnvVars:
    - name: FRED_KB_CLIENT_SECRET
      valueFrom:
        secretKeyRef: { name: fred-secrets, key: KEYCLOAK_KB_FRED_WEBDAV_CLIENT_SECRET, optional: false } # pragma: allowlist secret (Secret reference)
