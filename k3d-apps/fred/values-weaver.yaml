# =============================================================================
# Fred Weaver (FRED=weaver) on the local k3d instance of fred-deployment-factory:
# values for Fred's chart (a checkout's deploy/charts/fred, until a published release),
# deployed by helmfile.yaml.gotmpl in namespace fred-weaver, at
# http://weaver.localhost:8088.
#
# Everything this instance decides is here, in plain values. What it relies on comes
# from the infrastructure chart (k3d/values.yaml, lines.weaver): the database, the
# Temporal namespace, the Secrets `fred-secrets` and `fred-ingestion`, and the
# OpenSearch, S3 and Keycloak identities. Index and identity names must match there.
#
# Image tags are not set here: with DIR, the checkout's deploy/k3d/build writes each
# image's content tag into the image values the helmfile adds after this file.
# =============================================================================
postgresBootstrap:
  enabled: true
  image: pgvector/pgvector:pg17
  database: fred_weaver
  adminUser: admin
applications:
  control-plane-backend:
    configuration:
      platform:
        capability_preparation:
          workers:
            fred-agents:
              issuer: http://keycloak:8080/realms/app
        inference_credentials:
        - api_key_env: MISTRAL_API_KEY
          api_root: https://api.mistral.ai/v1
          credential_binding: mistral
        - api_key_env: OPENAI_API_KEY
          api_root: https://api.openai.com/v1
          credential_binding: openai
        model_sources:
        - embedding_models:
          - mistral-embed
          enabled: true
          inference:
            api_root: https://api.mistral.ai/v1
            auth:
              kind: api_key
            credential_binding: mistral
            dialect: mistral
            route: standard
            wire: openai_chat
          inventory:
            authentication:
              accept_inference_authority: true
              authority: discovery_and_inference
              mode: bearer
              provider_scopes:
              - GET /v1/models
              - POST /v1/chat/completions
              secret_env_var: MISTRAL_API_KEY
            complete_inventory_guaranteed: true
            kind: discovered
            qualification: mixed_capabilities_v1
            url: https://api.mistral.ai/v1/models
          revision: 1
          source_id: mistral
          visibility_scope: local-test-mistral-account
        # OpenAI's model list carries no capability metadata, so discovery cannot
        # establish any aptitude: the instance declares the offers it approves, chat
        # except the attested embedding models. Refreshing a declared list needs no key.
        - embedding_models:
          - text-embedding-3-small
          - text-embedding-3-large
          enabled: true
          inference:
            api_root: https://api.openai.com/v1
            auth:
              kind: api_key
            credential_binding: openai
            dialect: openai
            route: standard
            wire: openai_chat
          inventory:
            kind: declared
            models:
            - id: gpt-4.1-mini
            - id: gpt-4.1
            - id: text-embedding-3-small
            - id: text-embedding-3-large
          revision: 1
          source_id: openai
          visibility_scope: local-test-openai-account
        # Initial policies of the demo organizations, applied once after provisioning:
        # Mistral here. The operator chooses another provider explicitly with
        # VALUES=k3d-apps/fred/models-openai.yaml or models-mistral-openai.yaml.
        organization_models:
        - default:
            source_id: mistral
            upstream_model_id: mistral-small-latest
          embedding:
            source_id: mistral
            upstream_model_id: mistral-embed
          fallback: null
          organization: Acme
          permitted:
          - source_id: mistral
            upstream_model_id: mistral-small-latest
          - source_id: mistral
            upstream_model_id: mistral-medium-latest
          - source_id: mistral
            upstream_model_id: mistral-embed
          reasoning_enabled: []
          sources:
          - mistral
        - default:
            source_id: mistral
            upstream_model_id: mistral-small-latest
          embedding:
            source_id: mistral
            upstream_model_id: mistral-embed
          fallback: null
          organization: Globex
          permitted:
          - source_id: mistral
            upstream_model_id: mistral-small-latest
          - source_id: mistral
            upstream_model_id: mistral-medium-latest
          - source_id: mistral
            upstream_model_id: mistral-embed
          reasoning_enabled: []
          sources:
          - mistral
      scheduler:
        lifecycle:
          temporal:
            namespace: fred-weaver
        processing:
          worker:
            issuer: http://keycloak:8080/realms/app
          derived:
            allow_insecure: true
            endpoint: http://seaweedfs:8333
            prefix: ''
          limits:
            artifacts: 2000
            chunks: 100000
            output_bytes: 536870912
            pending: 100
          temporal:
            namespace: fred-weaver
      security:
        m2m:
          realm_url: http://keycloak:8080/realms/app
        user:
          realm_url: http://keycloak:8080/realms/app
        authorized_origins:
        - http://weaver.localhost:8088
      storage:
        # address/secret: prepare the infrastructure HTTPS migration first.
        history:
          url: https://opensearch:9200
          index: weaver-kpi
          username: fred-analytics-reader
          password_env_var: FRED_HISTORY_PASSWORD
        content:
          allow_insecure: true
          endpoint: http://seaweedfs:8333
          limits:
            downloads: 8
            file_bytes: 104857600
            s3_seconds: 120
            temp_bytes: 419430400
            transfer_seconds: 300
            uploads: 4
          prefix: ''
        postgres:
          database: fred_weaver
    extraEnvVars:
    - name: FRED_HISTORY_PASSWORD
      valueFrom:
        secretKeyRef:
          name: fred-analytics-reader
          key: password
    # posture: rustls-native-certs loads this in addition to SSL_CERT_FILE below.
    - name: SSL_CERT_DIR
      value: /etc/fred/opensearch-ca
    - name: MISTRAL_API_KEY
      valueFrom:
        secretKeyRef:
          key: MISTRAL_API_KEY
          name: fred-model-credentials
          optional: true
    - name: OPENAI_API_KEY
      valueFrom:
        secretKeyRef:
          key: OPENAI_API_KEY
          name: fred-model-credentials
          optional: true
    - name: SSL_CERT_FILE
      value: /etc/fred/node-ca/ca-certificates.crt
    - name: KEYCLOAK_CONTROL_PLANE_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          key: KEYCLOAK_CONTROL_PLANE_CLIENT_SECRET
          name: fred-secrets
    - name: FRED_BOOTSTRAP_TOKEN
      valueFrom:
        secretKeyRef:
          key: CONTROL_PLANE_BOOTSTRAP_TOKEN
          name: fred-secrets
    - name: FRED_CONTENT_ACCESS_KEY
      value: fred-document-manager
    - name: FRED_CONTENT_SECRET_KEY
      valueFrom:
        secretKeyRef:
          key: manager-s3-secret
          name: fred-ingestion
    extraVolumeMounts:
    - mountPath: /etc/fred/opensearch-ca
      name: opensearch-http-ca
      readOnly: true
    - mountPath: /etc/fred/node-ca/ca-certificates.crt
      name: node-ca
      readOnly: true
    extraVolumes:
    - name: opensearch-http-ca
      configMap:
        name: opensearch-http-ca
    - hostPath:
        path: /etc/ssl/certs/ca-certificates.crt
        type: File
      name: node-ca
    ingress:
      enabled: false
    lifecycle_policy_catalog:
      space_policies:
        purge:
          default:
            retention: PT1M
    resources:
      limits:
        cpu: '2'
        ephemeral-storage: 2Gi
        memory: 1Gi
      requests:
        cpu: 250m
        ephemeral-storage: 1Gi
        memory: 256Mi
  fred-agents:
    configuration:
      ai:
        timeout:
          connect: 20
          read: 60
      app:
        openai_compat: false
      inference_credentials:
      - api_key_env: MISTRAL_API_KEY
        api_root: https://api.mistral.ai/v1
        credential_binding: mistral
      - api_key_env: OPENAI_API_KEY
        api_root: https://api.openai.com/v1
        credential_binding: openai
      observability:
        kpi:
          opensearch:
            enabled: true
            index: weaver-kpi
      scheduler:
        temporal:
          namespace: fred-weaver
      security:
        m2m:
          realm_url: http://keycloak:8080/realms/app
        user:
          realm_url: http://keycloak:8080/realms/app
        authorized_origins:
        - http://weaver.localhost:8088
        delegation:
          accept_delegated_calls: true
          service_accounts_only: true
      storage:
        object_store:
          access_key: admin
          endpoint: http://seaweedfs:8333
          secure: false
        opensearch:
          username: fred-agents
        postgres:
          database: fred_weaver
          pool_pre_ping: true
          pool_recycle: 1800
          pool_timeout: 30
    extraEnvVars:
    - name: COLUMNS
      value: '250'
    - name: OPENSEARCH_PASSWORD
      valueFrom:
        secretKeyRef:
          key: agents-opensearch-password
          name: fred-ingestion
    - name: MINIO_SECRET_KEY
      valueFrom:
        secretKeyRef:
          key: SEAWEEDFS_ADMIN_PASSWORD
          name: fred-secrets
          optional: false
    - name: MISTRAL_API_KEY
      valueFrom:
        secretKeyRef:
          key: MISTRAL_API_KEY
          name: fred-model-credentials
          optional: true
    - name: OPENAI_API_KEY
      valueFrom:
        secretKeyRef:
          key: OPENAI_API_KEY
          name: fred-model-credentials
          optional: true
    - name: WEB_RESEARCH_PROVIDER_KEY
      valueFrom:
        secretKeyRef:
          key: WEB_RESEARCH_PROVIDER_KEY
          name: fred-web-research-credentials
          optional: true
    - name: KEYCLOAK_AGENTIC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          key: KEYCLOAK_AGENTIC_CLIENT_SECRET
          name: fred-secrets
          optional: false
    - name: SSL_CERT_FILE
      value: /etc/fred/node-ca/ca-certificates.crt
    extraVolumeMounts:
    - mountPath: /etc/fred/node-ca/ca-certificates.crt
      name: node-ca
      readOnly: true
    extraVolumes:
    - hostPath:
        path: /etc/ssl/certs/ca-certificates.crt
        type: File
      name: node-ca
  frontend:
    configuration:
      config_json:
        backend_url_api: http://weaver.localhost:8088
        backend_url_knowledge: http://weaver.localhost:8088
        websocket_url: ws://weaver.localhost:8088/fred/chatbot/query
    ingress:
      className: traefik
      hosts:
      - host: weaver.localhost
        paths:
        - path: /
          pathType: Prefix
          service:
            name: frontend
            port: 80
        - path: /control-plane
          pathType: Prefix
          service:
            name: control-plane-backend
            port: 8222
        - path: /fred/agents/v2
          pathType: Prefix
          service:
            name: fred-agents
            port: 80
      tls: []
  knowledge-flow-backend:
    configuration:
      crossencoder_model:
        settings:
          http_client_limits:
            keepalive_expiry_seconds: 10
            max_connections: 500
            max_keepalive_connections: 0
          max_retries: 0
          online: true
          timeout:
            connect: 10
            read: 120
      inference_credentials:
      - api_key_env: MISTRAL_API_KEY
        api_root: https://api.mistral.ai/v1
        credential_binding: mistral
      - api_key_env: OPENAI_API_KEY
        api_root: https://api.openai.com/v1
        credential_binding: openai
      observability:
        kpi:
          opensearch:
            enabled: true
            index: weaver-kpi
      published_artifacts:
        allow_insecure: true
        endpoint: http://seaweedfs:8333
      security:
        m2m:
          realm_url: http://keycloak:8080/realms/app
        user:
          realm_url: http://keycloak:8080/realms/app
        authorized_origins:
        - http://weaver.localhost:8088
        delegation:
          service_accounts_only: true
        profile: c3
      storage:
        opensearch:
          username: fred-kf-api
        postgres:
          database: fred_weaver
          max_overflow: 0
          pool_pre_ping: true
          pool_recycle: 1800
          pool_size: 2
          pool_timeout: 30
        tabular_store:
          query:
            duckdb_memory_limit: 256MB
            duckdb_threads: 1
            max_concurrent_queries: 2
            max_queued_queries: 4
            max_selected_datasets: 50
            query_timeout_seconds: 30
        vector_store:
          bulk_size: 1000
          index: document-vectors
          type: opensearch
    extraEnvVars:
    - name: COLUMNS
      value: '250'
    - name: OPENSEARCH_PASSWORD
      valueFrom:
        secretKeyRef:
          key: kf-api-opensearch-password
          name: fred-ingestion
    - name: MISTRAL_API_KEY
      valueFrom:
        secretKeyRef:
          key: MISTRAL_API_KEY
          name: fred-model-credentials
          optional: true
    - name: OPENAI_API_KEY
      valueFrom:
        secretKeyRef:
          key: OPENAI_API_KEY
          name: fred-model-credentials
          optional: true
    - name: KEYCLOAK_KNOWLEDGE_FLOW_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          key: KEYCLOAK_KNOWLEDGE_FLOW_CLIENT_SECRET
          name: fred-secrets
          optional: false
    - name: SSL_CERT_FILE
      value: /etc/fred/node-ca/ca-certificates.crt
    - name: KF_ARTIFACT_ACCESS_KEY
      value: fred-document-reader
    - name: KF_ARTIFACT_SECRET_KEY
      valueFrom:
        secretKeyRef:
          key: kf-api-s3-secret
          name: fred-ingestion
    extraVolumeMounts:
    - mountPath: /etc/fred/node-ca/ca-certificates.crt
      name: node-ca
      readOnly: true
    extraVolumes:
    - hostPath:
        path: /etc/ssl/certs/ca-certificates.crt
        type: File
      name: node-ca
  knowledge-flow-worker:
    configuration:
      inference_credentials:
      - api_key_env: MISTRAL_API_KEY
        api_root: https://api.mistral.ai/v1
        credential_binding: mistral
      - api_key_env: OPENAI_API_KEY
        api_root: https://api.openai.com/v1
        credential_binding: openai
      # Local k3d only: the standard chart uses TLS endpoints.
      manager_processing:
        url: http://control-plane-backend:8222/control-plane/v1
        issuer: http://keycloak:8080/realms/app
        allow_insecure: true
        endpoint: http://seaweedfs:8333
        temporary_bytes: 1073741824
        vector_store:
          bulk_size: 1000
          index: document-vectors
          type: opensearch
      observability:
        kpi:
          opensearch:
            enabled: true
            index: weaver-kpi
      scheduler:
        temporal:
          ingestion_max_concurrent_activities: 1
          namespace: fred-weaver
      storage:
        opensearch:
          username: fred-kf-ingestion
        postgres:
          database: fred_weaver
          max_overflow: 0
          pool_pre_ping: true
          pool_recycle: 1800
          pool_size: 2
          pool_timeout: 30
        tabular_store:
          query:
            duckdb_memory_limit: 256MB
            duckdb_threads: 1
            max_concurrent_queries: 2
            max_queued_queries: 4
            max_selected_datasets: 50
            query_timeout_seconds: 30
        vector_store:
          bulk_size: 1000
          index: document-vectors
          type: opensearch
    extraEnvVars:
    - name: MISTRAL_API_KEY
      valueFrom:
        secretKeyRef:
          key: MISTRAL_API_KEY
          name: fred-model-credentials
          optional: true
    - name: OPENAI_API_KEY
      valueFrom:
        secretKeyRef:
          key: OPENAI_API_KEY
          name: fred-model-credentials
          optional: true
    - name: COLUMNS
      value: '250'
    - name: SSL_CERT_FILE
      value: /etc/fred/node-ca/ca-certificates.crt
    - name: OPENSEARCH_PASSWORD
      valueFrom:
        secretKeyRef:
          key: opensearch-password
          name: fred-ingestion
    - name: MANAGER_WORKER_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          key: KEYCLOAK_MANAGER_WORKER_CLIENT_SECRET
          name: fred-secrets
    - name: MANAGER_DERIVED_ACCESS_KEY
      value: fred-document-processor
    - name: MANAGER_DERIVED_SECRET_KEY
      valueFrom:
        secretKeyRef:
          key: processor-s3-secret
          name: fred-ingestion
    extraVolumeMounts:
    - mountPath: /etc/fred/node-ca/ca-certificates.crt
      name: node-ca
      readOnly: true
    extraVolumes:
    - hostPath:
        path: /etc/ssl/certs/ca-certificates.crt
        type: File
      name: node-ca
    resources:
      limits:
        cpu: '4'
        ephemeral-storage: 8Gi
        memory: 6Gi
      requests:
        cpu: '1'
        ephemeral-storage: 5Gi
        memory: 2Gi
    volumes:
    - configMap:
        name: knowledge-flow-worker-back
      name: knowledge-flow-worker-vol
    - name: knowledge-flow-worker-env-vol
      secret:
        secretName: knowledge-flow-worker-env
