# =============================================================================
# The evaluation application on the local k3d instance: values for the
# fred-evaluator chart (fred-agent-evaluator repository,
# deploy/charts/fred-evaluator), deployed by `make k3d-evaluator`.
#
# Only what k3d decides lives here; the chart's defaults already name the
# services of a default Fred install (postgres, temporal:7233,
# control-plane-backend:8222, fred-agents), which is what k3d runs. Fred learns
# about the application from its own values (k3d-apps/fred/values.yaml:
# application_sources and FRONTEND_APPLICATIONS_JSON).
#
# Posture as on fredlab: no security profile, no delegation; the worker has its
# own `fred-evaluation-worker` identity with app/service_agent only.
#
# Image tags are not set here: `make k3d-evaluator` builds the images and
# passes each one's content tag on the command line.
# =============================================================================

x-realm-url: &realm-url "http://keycloak:8080/realms/app"

ui:
  hostOrigin: "http://localhost:8088"      # address: where users open Fred

# secret: every credential by reference to fred-secrets, the Foundation Secret
# created by `make k3d-up`.
extraEnvVars:
  - name: FRED_POSTGRES_PASSWORD
    valueFrom:
      secretKeyRef: { name: fred-secrets, key: POSTGRES_EVALUATION_PASSWORD, optional: false }
  - name: KEYCLOAK_EVAL_WORKER_CLIENT_SECRET
    valueFrom:
      secretKeyRef: { name: fred-secrets, key: KEYCLOAK_EVAL_WORKER_CLIENT_SECRET, optional: false }
  # The judge and analysis models are Mistral's: on k3d the model key Fred
  # uses (OPENAI_API_KEY, written by `make k3d-fred`) is a Mistral key.
  - name: MISTRAL_API_KEY
    valueFrom:
      secretKeyRef: { name: fred-secrets, key: OPENAI_API_KEY, optional: false }
  # observability: a wide console, so Rich does not wrap one log line into
  # several before the log collector reads it.
  - name: COLUMNS
    value: "250"

configuration:
  security:
    user:
      realm_url: *realm-url                # address
    m2m:
      realm_url: *realm-url                # address
    authorized_origins:                    # address
      - "http://localhost:8088"
