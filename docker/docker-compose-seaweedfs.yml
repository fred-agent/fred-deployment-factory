services:

  seaweedfs:
    container_name: ${DOCKER_CONTAINER_PREFIX:-}app-seaweedfs
    restart: unless-stopped
    image: chrislusf/seaweedfs:4.29
    environment:
      NO_PROXY: "*"
    command:
      - server
      - -ip=app-seaweedfs
      - -ip.bind=0.0.0.0
      - -dir=/data
      - -s3
      - -s3.config=/config/s3.json
      - -s3.port=8333
      - -master.port=9333
      - -volume.port=8080
      - -filer
      - -filer.port=8888
      - -volume.max=100
    networks:
      app-network:
        aliases:
          - app-seaweedfs
    ports:
      - 0.0.0.0:9333:9333/tcp   # Master API
      - 0.0.0.0:8081:8080/tcp   # Volume API
      - 0.0.0.0:8888:8888/tcp   # Filer API
      - 0.0.0.0:8333:8333/tcp   # S3 API (compatible MinIO SDK)
    volumes:
      - vol-seaweedfs-data:/data
      - ./seaweedfs-config:/config:ro
    healthcheck:
      test: curl --fail http://localhost:9333/cluster/status
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
      start_interval: 2s

  seaweedfs-post-install-job:
    container_name: ${DOCKER_CONTAINER_PREFIX:-}app-seaweedfs-post-install-job
    image: chrislusf/seaweedfs:4.29
    environment:
      NO_PROXY: "*"
      SEAWEEDFS_ADMIN_USER: ${SEAWEEDFS_ADMIN_USER:-admin}
      SEAWEEDFS_ADMIN_PASSWORD: ${SEAWEEDFS_ADMIN_PASSWORD:-Azerty123_}
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        echo "[seaweedfs-post-install] listing buckets..."
        shell_output="$$(echo 's3.bucket.list' | weed shell -master=app-seaweedfs:9333 -filer=app-seaweedfs:8888 2>&1)"
        if [ -n "$$shell_output" ]; then
          printf '%s\n' "$$shell_output"
        fi

        # app-content-documents: Fred Weaver's documents, without versioning or lifecycle.
        for bucket in langfuse app-content-documents; do
          if printf '%s\n' "$$shell_output" | grep -Fxq "$$bucket"; then
            echo "[seaweedfs-post-install] bucket $$bucket already exists"
          else
            echo "[seaweedfs-post-install] creating bucket $$bucket"
            echo "s3.bucket.create -name $$bucket" | weed shell -master=app-seaweedfs:9333 -filer=app-seaweedfs:8888
          fi
        done
        echo "[seaweedfs-post-install] bucket initialization finished"
    networks:
      app-network:
        aliases:
          - app-seaweedfs-post-install-job
    depends_on:
      seaweedfs:
        condition: service_healthy

volumes:
  vol-seaweedfs-data:

networks:
  app-network:
    external: true
    name: ${DOCKER_NETWORK_NAME:-fred-shared-network}
