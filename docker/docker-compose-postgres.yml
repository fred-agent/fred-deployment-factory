services:

  postgres:
    container_name: ${DOCKER_CONTAINER_PREFIX:-}app-postgres
    restart: unless-stopped
    image: pgvector/pgvector:pg15
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-250}
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-Azerty123_}
      POSTGRES_DB: ${POSTGRES_ADMIN_DB:-postgres}
    networks:
      app-network:
        aliases:
          - app-postgres
    ports:
      - 0.0.0.0:5432:5432/tcp
    volumes:
      - vol-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: "pg_isready -U ${POSTGRES_ADMIN_USER:-admin} -d postgres"
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-post-install-job:
    container_name: ${DOCKER_CONTAINER_PREFIX:-}app-postgres-post-install-job
    image: mirror.gcr.io/postgres:15.12-alpine3.20
    volumes:
      - ./postgres-post-install-job/create_env.sh:/usr/local/bin/create_env.sh
    environment:
      DOCKER_ENV: ${DOCKER_ENV:-swift}
      POSTGRES_WEAVER_DB: ${POSTGRES_WEAVER_DB:-fred_weaver}
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:-admin}
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD:-Azerty123_}
      POSTGRES_FRED_USER: ${POSTGRES_FRED_USER:-fred}
      POSTGRES_FRED_PASSWORD: ${POSTGRES_FRED_PASSWORD:-Azerty123_}
      POSTGRES_FRED_DB: ${POSTGRES_FRED_DB:-fred}
      POSTGRES_TABULAR_DATA_USER: ${POSTGRES_TABULAR_DATA_USER:-tabular}
      POSTGRES_TABULAR_DATA_PASSWORD: ${POSTGRES_TABULAR_DATA_PASSWORD:-Azerty123_}
      POSTGRES_TABULAR_DATA_DB: ${POSTGRES_TABULAR_DATA_DB:-data}
      POSTGRES_LANGFUSE_USER: ${POSTGRES_LANGFUSE_USER:-langfuse}
      POSTGRES_LANGFUSE_PASSWORD: ${POSTGRES_LANGFUSE_PASSWORD:-Azerty123_}
      POSTGRES_LANGFUSE_DB: ${POSTGRES_LANGFUSE_DB:-langfuse}
      POSTGRES_EVALUATION_USER: ${POSTGRES_EVALUATION_USER:-evaluation}
      POSTGRES_EVALUATION_PASSWORD: ${POSTGRES_EVALUATION_PASSWORD:-Azerty123_}
      POSTGRES_EVALUATION_DB: ${POSTGRES_EVALUATION_DB:-evaluation}
      POSTGRES_OPENFGA_USER: ${POSTGRES_OPENFGA_USER:-openfga}
      POSTGRES_OPENFGA_PASSWORD: ${POSTGRES_OPENFGA_PASSWORD:-Azerty123_}
      POSTGRES_OPENFGA_DBNAME: ${POSTGRES_OPENFGA_DBNAME:-openfga}
      POSTGRES_TEMPORAL_USER: ${POSTGRES_TEMPORAL_USER:-temporal}
      POSTGRES_TEMPORAL_PASSWORD: ${POSTGRES_TEMPORAL_PASSWORD:-Azerty123_}
      POSTGRES_TEMPORAL_DBNAME: ${POSTGRES_TEMPORAL_DBNAME:-temporal}
      POSTGRES_TEMPORAL_VISIBILITY_DBNAME: ${POSTGRES_TEMPORAL_VISIBILITY_DBNAME:-temporal_visibility}
    entrypoint:
      - /bin/bash
      - -ec
    command:
      - |-
        if [ "$$DOCKER_ENV" = weaver ]; then
        # Weaver's database, empty. Its SQL owners, schemas and vector extension belong
        # to Fred: its deploy/postgres/bootstrap.sql (make docker-prepare in Fred).
        psql -X -q -v ON_ERROR_STOP=1 -U "$$POSTGRES_ADMIN_USER" -h app-postgres -d postgres \
          -v database="$$POSTGRES_WEAVER_DB" <<'SQL'
        SELECT format('CREATE DATABASE %I', :'database')
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'database')\gexec
        REVOKE ALL ON DATABASE :"database" FROM PUBLIC;
        SQL
        else
        create_env.sh \
          --admin "$$POSTGRES_ADMIN_USER" \
          --host "app-postgres" \
          --user "$$POSTGRES_FRED_USER" \
          --password "$$POSTGRES_FRED_PASSWORD" \
          --database "$$POSTGRES_FRED_DB" \
          --enable-vector
        create_env.sh \
          --admin "$$POSTGRES_ADMIN_USER" \
          --host "app-postgres" \
          --user "$$POSTGRES_TABULAR_DATA_USER" \
          --password "$$POSTGRES_TABULAR_DATA_PASSWORD" \
          --database "$$POSTGRES_TABULAR_DATA_DB" \
          --enable-vector
        create_env.sh \
          --admin "$$POSTGRES_ADMIN_USER" \
          --host "app-postgres" \
          --user "$$POSTGRES_OPENFGA_USER" \
          --password "$$POSTGRES_OPENFGA_PASSWORD" \
          --database "$$POSTGRES_OPENFGA_DBNAME"
        create_env.sh \
          --admin "$$POSTGRES_ADMIN_USER" \
          --host "app-postgres" \
          --user "$$POSTGRES_EVALUATION_USER" \
          --password "$$POSTGRES_EVALUATION_PASSWORD" \
          --database "$$POSTGRES_EVALUATION_DB"
        fi
        create_env.sh \
          --admin "$$POSTGRES_ADMIN_USER" \
          --host "app-postgres" \
          --user "$$POSTGRES_LANGFUSE_USER" \
          --password "$$POSTGRES_LANGFUSE_PASSWORD" \
          --database "$$POSTGRES_LANGFUSE_DB"
        create_env.sh \
          --admin "$$POSTGRES_ADMIN_USER" \
          --host "app-postgres" \
          --user "$$POSTGRES_TEMPORAL_USER" \
          --password "$$POSTGRES_TEMPORAL_PASSWORD" \
          --database "$$POSTGRES_TEMPORAL_DBNAME"
        create_env.sh \
          --admin "$$POSTGRES_ADMIN_USER" \
          --host "app-postgres" \
          --user "$$POSTGRES_TEMPORAL_USER" \
          --password "$$POSTGRES_TEMPORAL_PASSWORD" \
          --database "$$POSTGRES_TEMPORAL_VISIBILITY_DBNAME"
    networks:
      app-network:
        aliases:
          - app-postgres-post-install-job
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  vol-postgres-data:

networks:
  app-network:
    external: true
    name: ${DOCKER_NETWORK_NAME:-fred-shared-network}
