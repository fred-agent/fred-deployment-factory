services:

  keycloak-postgres:
    container_name: app-keycloak-postgres
    restart: unless-stopped
    image: ${KEYCLOAK_POSTGRES_IMAGE:-${KEYCLOAK_DEFAULT_POSTGRES_IMAGE:-pgvector/pgvector:pg15}}
    environment:
      POSTGRES_USER: ${POSTGRES_KEYCLOAK_USER:-keycloak_db_user}
      POSTGRES_PASSWORD: ${POSTGRES_KEYCLOAK_PASSWORD:-Azerty123_}
      POSTGRES_DB: ${POSTGRES_KEYCLOAK_DB:-keycloak}
    networks:
      - app-network
    volumes:
      - vol-keycloak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    container_name: app-keycloak
    restart: unless-stopped
    image: mirror.gcr.io/keycloak/keycloak:26.3.0
    environment:
      KC_HTTP_ENABLED: true
      KC_HTTP_ENABLE: true
      KC_HTTP_PORT: 8080
      KC_METRICS_ENABLED: true
      KC_HTTP_MANAGEMENT_PORT: 9000
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_DB: ${POSTGRES_ADMIN_DB:-postgres}
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/${POSTGRES_KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_KEYCLOAK_USER:-keycloak_db_user}
      KC_DB_PASSWORD: ${POSTGRES_KEYCLOAK_PASSWORD:-Azerty123_}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-Azerty123_}
      DOCKER_COMPOSE_HOST_FQDN: ${DOCKER_COMPOSE_HOST_FQDN:-localhost}
      TEMPORAL_UI_PORT: ${TEMPORAL_UI_PORT:-8233}
    entrypoint:
      - /bin/bash
      - -c
    command:
      - |-
        [ ! -d /opt/keycloak/data/import ] && mkdir -p /opt/keycloak/data/import
        sed "s#__DOCKER_COMPOSE_HOST_FQDN__#$$DOCKER_COMPOSE_HOST_FQDN#g; s#__TEMPORAL_UI_PORT__#$$TEMPORAL_UI_PORT#g; s#docker-compose.host.fqdn#$$DOCKER_COMPOSE_HOST_FQDN#g" /tmp/app-realm.json.template > /opt/keycloak/data/import/app-realm.json
        /opt/keycloak/bin/kc.sh start-dev --import-realm
    volumes:
      - ./keycloak/app-realm.json.template:/tmp/app-realm.json.template
      - ./keycloak/realm_export:/export
    networks:
      app-network:
        aliases:
          - app-keycloak
          - ${DOCKER_COMPOSE_HOST_FQDN:-localhost}
    ports:
      - 0.0.0.0:8080:8080/tcp
    healthcheck:
      test: /opt/keycloak/bin/kcadm.sh get realms/app --fields id --server http://localhost:8080 --realm master --user $$KC_BOOTSTRAP_ADMIN_USERNAME --password $$KC_BOOTSTRAP_ADMIN_PASSWORD
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 10s
    depends_on:
      keycloak-postgres:
        condition: service_healthy

volumes:
  vol-keycloak-postgres-data:

networks:
  app-network:
    external: true
    name: fred-shared-network
