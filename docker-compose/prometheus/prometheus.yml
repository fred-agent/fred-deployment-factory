global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: keycloak-metrics
    metrics_path: /metrics
    static_configs:
      - targets:
          - app-keycloak:9000

  - job_name: openfga-metrics
    metrics_path: /metrics
    static_configs:
      - targets:
          - openfga:2112

  - job_name: clickhouse-metrics
    metrics_path: /metrics
    static_configs:
      - targets:
          - app-clickhouse:9363

  - job_name: temporal-metrics
    metrics_path: /metrics
    static_configs:
      - targets:
          - app-temporal:9090

  - job_name: minio-api-requests
    metrics_path: /minio/metrics/v3/api/requests
    static_configs:
      - targets:
          - app-minio:9000

  - job_name: minio-bucket-api
    metrics_path: /minio/metrics/v3/bucket/api
    static_configs:
      - targets:
          - app-minio:9000

  - job_name: minio-audit
    metrics_path: /minio/metrics/v3/audit
    static_configs:
      - targets:
          - app-minio:9000

  - job_name: minio-batch
    metrics_path: /minio/metrics/v3/batch
    static_configs:
      - targets:
          - app-minio:9000

  - job_name: minio-bucket-batch
    metrics_path: /minio/metrics/v3/bucket/batch
    static_configs:
      - targets:
          - app-minio:9000

  - job_name: minio-cluster-config
    metrics_path: /minio/metrics/v3/cluster/config
    static_configs:
      - targets:
          - app-minio:9000

  - job_name: minio-cluster-erasure-set
    metrics_path: /minio/metrics/v3/cluster/erasure-set
    static_configs:
      - targets:
          - app-minio:9000

  - job_name: minio-cluster-health
    metrics_path: /minio/metrics/v3/cluster/health
    static_configs:
      - targets:
          - app-minio:9000

  - job_name: minio-cluster-iam
    metrics_path: /minio/metrics/v3/cluster/iam
    static_configs:
      - targets:
          - app-minio:9000

  - job_name: minio-cluster-usage-buckets
    metrics_path: /minio/metrics/v3/cluster/usage/buckets
    static_configs:
      - targets:
          - app-minio:9000

  - job_name: minio-cluster-usage-objects
    metrics_path: /minio/metrics/v3/cluster/usage/objects
    static_configs:
      - targets:
          - app-minio:9000

  - job_name: minio-debug-go
    metrics_path: /minio/metrics/v3/debug/go
    static_configs:
      - targets:
          - app-minio:9000

  - job_name: minio-ilm
    metrics_path: /minio/metrics/v3/ilm
    static_configs:
      - targets:
          - app-minio:9000

  - job_name: minio-logger-webhook
    metrics_path: /minio/metrics/v3/logger/webhook
    static_configs:
      - targets:
          - app-minio:9000

  - job_name: minio-notification
    metrics_path: /minio/metrics/v3/notification
    static_configs:
      - targets:
          - app-minio:9000

  - job_name: minio-replication
    metrics_path: /minio/metrics/v3/replication
    static_configs:
      - targets:
          - app-minio:9000

  - job_name: minio-bucket-replication
    metrics_path: /minio/metrics/v3/bucket/replication
    static_configs:
      - targets:
          - app-minio:9000

  - job_name: minio-scanner
    metrics_path: /minio/metrics/v3/scanner
    static_configs:
      - targets:
          - app-minio:9000

  - job_name: minio-system-cpu
    metrics_path: /minio/metrics/v3/system/cpu
    static_configs:
      - targets:
          - app-minio:9000

  - job_name: minio-system-drive
    metrics_path: /minio/metrics/v3/system/drive
    static_configs:
      - targets:
          - app-minio:9000

  - job_name: minio-system-memory
    metrics_path: /minio/metrics/v3/system/memory
    static_configs:
      - targets:
          - app-minio:9000

  - job_name: minio-system-network-internode
    metrics_path: /minio/metrics/v3/system/network/internode
    static_configs:
      - targets:
          - app-minio:9000

  - job_name: minio-system-process
    metrics_path: /minio/metrics/v3/system/process
    static_configs:
      - targets:
          - app-minio:9000

  # Add extra target groups as *.yml files in docker-compose/prometheus/targets/.
  - job_name: static-targets
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/*.yml
        refresh_interval: 30s
