services:

  clickhouse:
    container_name: app-clickhouse
    image: clickhouse/clickhouse-server:24.12.5.81-alpine
    environment:
      no_proxy: "*"
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-fred}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-fred}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-Azerty123_}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    networks:
      - app-network
    ports:
      - 0.0.0.0:${CLICKHOUSE_HTTP_PORT:-8123}:8123/tcp
      - 0.0.0.0:${CLICKHOUSE_NATIVE_PORT:-9002}:9000/tcp
    volumes:
      - vol-clickhouse-data:/var/lib/clickhouse
      - vol-clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: clickhouse-client --query "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  clickhouse-post-install-job:
    container_name: app-clickhouse-post-install-job
    image: clickhouse/clickhouse-server:24.12.5.81-alpine
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-fred}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-fred}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-Azerty123_}
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |-
        clickhouse-client \
          --host app-clickhouse \
          --user "$$CLICKHOUSE_USER" \
          --password "$$CLICKHOUSE_PASSWORD" \
          --query "CREATE DATABASE IF NOT EXISTS $$CLICKHOUSE_DB";
        clickhouse-client \
          --host app-clickhouse \
          --user "$$CLICKHOUSE_USER" \
          --password "$$CLICKHOUSE_PASSWORD" \
          --query "CREATE TABLE IF NOT EXISTS $$CLICKHOUSE_DB.vector_store (id String, embedding Array(Float32), metadata String, created_at DateTime DEFAULT now()) ENGINE = MergeTree ORDER BY id";
    networks:
      - app-network
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  vol-clickhouse-data:
  vol-clickhouse-logs:

networks:
  app-network:
    external: true
    name: fred-shared-network
