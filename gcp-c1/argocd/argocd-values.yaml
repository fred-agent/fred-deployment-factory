# ArgoCD config (non-secret). Read by bin/fredlab-argocd-install.sh.
# The OIDC client secret is NOT here — the install script fetches it from Keycloak at
# runtime and injects it, so no secret ever lands in git.
configs:
  params:
    # Serve HTTP behind the load balancer; TLS terminates at the GCE Ingress + managed cert.
    server.insecure: true
  cm:
    url: https://argocd.playground.fredlab.dev
    oidc.config: |
      name: Keycloak
      issuer: https://keycloak.playground.fredlab.dev/realms/app
      clientID: argocd
      clientSecret: $oidc.keycloak.clientSecret
      # No "groups" scope here — this realm has no such client scope (it would fail with
      # invalid_scope). The groups claim still arrives via the mapper on the argocd client.
      requestedScopes:
        - openid
        - profile
        - email
  rbac:
    policy.default: role:readonly
    # Admins are NAMED people, matched by email (the `fredlab` group is too broad — it
    # contains non-admins). Add Sébastien & Simon as more `g, <email>, role:admin` lines.
    scopes: '[groups, email]'
    policy.csv: |
      g, dimitri.tombroff@fredlab.dev, role:admin
      g, sebastien.ehling@fredlab.dev, role:admin
      g, simon.cariou@fredlab.dev, role:admin
      g, e044f362-bfeb-414f-bd14-ac559f319e66, role:admin
