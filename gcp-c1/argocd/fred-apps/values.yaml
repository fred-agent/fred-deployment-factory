# fred-apps — defaults for the GitOps-managed application layer.
#
# This chart deploys ONLY stateless app workloads, owned by ArgoCD, into `default`.
# It deliberately does NOT create: the fredlab-infra-secrets Secret, the Ingress,
# ManagedCertificates, or any infra StatefulSet/Service. Those stay owned by the
# imperative infra layer (helm release `fredlab-infra`) and are treated as frozen.
#
# App workloads reference the infra-owned Secret and Services BY NAME. The keys below
# under `secret` and `postgresql` must match the running infra layer.
#
# Per-environment image repository + tag live in values-fredlab.yaml (the overlay the
# ArgoCD Application loads last). Apps default to disabled here; the overlay enables them.

nameOverride: ""
fullnameOverride: ""
imagePullPolicy: IfNotPresent

# Infra-owned Secret the apps read credentials from (created by the infra layer).
secret:
  fullnameOverride: fredlab-infra-secrets

# Infra coordinates the apps reference. Must match the running infra layer.
postgresql:
  fullnameOverride: postgres
  service:
    port: 5432
  fred:
    database: fred
    user: fred
  # Dedicated evaluation database (password lives in the infra Secret as
  # POSTGRES_EVALUATION_PASSWORD, wired to the eval pods via FRED_POSTGRES_PASSWORD).
  evaluation:
    database: evaluation
    user: evaluation

controlPlane:
  enabled: false
  fullnameOverride: control-plane-backend
  configMapName: control-plane-config
  replicaCount: 1
  image:
    # Set in values-fredlab.yaml. Example:
    # europe-west1-docker.pkg.dev/<project-id>/fredlab-repo/control-plane-backend
    repository: ""
    tag: ""
  service:
    type: ClusterIP
    port: 8080
  containerPort: 8222
  health:
    path: /control-plane/v1/healthz
  # Schema migrations are NOT run by this chart in the GitOps slice — the live DB is
  # already at head. Kept for parity; wire as an ArgoCD PreSync hook when needed.
  migration:
    enabled: false
  resources:
    requests:
      cpu: 250m
      memory: 320Mi
    limits:
      memory: 1Gi
  config:
    appBaseUrl: /control-plane/v1
    logLevel: info
    gcuVersion: v1
    defaultTeamMaxResourcesStorageSize: 5368709120
    personalMaxResourcesStorageSize: 5368709120
    keycloakRealm: app
    keycloakInternalUrl: http://keycloak:8080
    keycloakIssuerUrl: https://keycloak.playground.fredlab.dev/realms/app
    keycloakClientId: control-plane
    openfgaUrl: http://openfga:8080
    openfgaStoreName: fred
    temporalAddress: temporal:7233
    scheduler:
      enabled: true
      backend: temporal
      temporalNamespace: default
      temporalTaskQueue: control-plane-lifecycle
      temporalWorkflowIdPrefix: control-plane
      temporalConnectTimeoutSeconds: 5
    security:
      m2m:
        enabled: true
      user:
        enabled: true
        clientId: app
      authorizedOrigins:
        - https://keycloak.playground.fredlab.dev
        - https://studio.playground.fredlab.dev
        - https://control-plane.playground.fredlab.dev
      rebac:
        enabled: true
    opensearch:
      host: http://opensearch:9200
      secure: false
      verifyCerts: false
      username: admin
      password: admin
    observability:
      log:
        enabled: true
      # Dedicated exporter (prometheus_client.start_http_server), separate from the
      # API port. Feeds the "Application KPIs" Grafana dashboard via a PodMonitoring
      # CR in this chart — GMP scrapes this port directly, no Service hop.
      prometheus:
        enabled: true
        address: 0.0.0.0
        port: 9222
      opensearch:
        enabled: true
        index: kpi-index
      processMetricsIntervalSec: 0
    contentStorage:
      localRootPath: /tmp/control-plane-content
    frontend:
      featureFlags:
        enableK8Features: false
        enableElecWarfare: false
      uiSettings:
        siteDisplayName: Fredlab
        agentsNicknameSingular: agent
        agentsNicknamePlural: agents
    knowledgeFlowBaseUrl: http://knowledge-flow-backend:8080/knowledge-flow/v1
    runtimeCatalogSources:
      - runtimeId: fred-agents
        baseUrl: http://fred-agents:8080/fred/agents/v2
        enabled: true
        ingressPrefix: /fred/agents/v2
      - runtimeId: rags-agents
        baseUrl: http://rags-agents:8080/rags/agents/v2
        enabled: true
        ingressPrefix: /rags/agents/v2
      - runtimeId: dt-agents
        baseUrl: http://dt-agents:8080/dt/agents/v2
        enabled: true
        ingressPrefix: /dt/agents/v2
      - runtimeId: evaluation
        baseUrl: http://fred-evaluation-backend:8080/evaluation/v1
        enabled: true
        ingressPrefix: /evaluation/v1
  extraEnv: {}

# control-plane-worker: the Temporal worker that drains the `control-plane-lifecycle`
# task queue. The control-plane-backend (scheduler.backend=temporal) enqueues lifecycle
# / erasure workflows (RGPD retention); this worker executes them. It runs the SAME image
# as controlPlane with the `control_plane_backend.main_worker` entrypoint, and REUSES the
# control-plane-config ConfigMap so scheduler backend, Temporal address + task queue and
# all connections match the API. Serves no HTTP API (metrics only) — no Service/Ingress.
# The control-plane backend uses no Workload Identity, so the worker needs no ServiceAccount.
controlPlaneWorker:
  enabled: false
  fullnameOverride: control-plane-worker
  replicaCount: 1
  image:
    # Same image as controlPlane.image (control-plane-backend). Pin to the tag you
    # want the worker to run — usually identical to the backend tag.
    repository: ""
    tag: ""
  resources:
    requests:
      cpu: 250m
      memory: 320Mi
    limits:
      memory: 1Gi

# fred-agents runtime. Stateless app workload; the runtime store (LangGraph checkpointer
# + session history) is the shared `fred` Postgres DB (durable). Ported verbatim from the
# imperative fredlab-infra values so ArgoCD renders the identical workload. Enabled +
# image pinned in values-fredlab.yaml; gcpServiceAccount set there for Workload Identity.
fredAgents:
  enabled: false
  fullnameOverride: fred-agents
  configMapName: fred-agents-config
  replicaCount: 1
  serviceAccount:
    name: fred-agents
    # Reuses the GSA that already has roles/aiplatform.user (Vertex via Workload
    # Identity). fred-agents object/GCS access is not required.
    gcpServiceAccount: ""
  image:
    # europe-west1-docker.pkg.dev/<project-id>/fredlab-repo/fred-agents
    repository: ""
    tag: ""
  service:
    type: ClusterIP
    port: 8080
  containerPort: 8000
  resources:
    requests:
      cpu: 250m
      memory: 320Mi
    limits:
      memory: 1Gi
  config:
    appBaseUrl: /fred/agents/v2
    logLevel: info
    openaiCompat: true
    keycloakIssuerUrl: https://keycloak.playground.fredlab.dev/realms/app
    keycloakClientId: agentic
    userClientId: app
    authorizedOrigins:
      - https://studio.playground.fredlab.dev
    openfgaUrl: http://openfga:8080
    openfgaStoreName: fred
    knowledgeFlowUrl: http://knowledge-flow-backend:8080/knowledge-flow/v1
    controlPlaneUrl: http://control-plane-backend:8080/control-plane/v1
    # Durable runtime store. The LangGraph checkpointer + session history persist to the
    # shared `fred` Postgres DB — the configmap renders storage.postgres from the global
    # postgresql.* values (host/port/database/user). No sqlite_path → fred-core uses real
    # Postgres; tables auto-create on first use (no migration job).
    opensearch:
      host: http://opensearch:9200
      secure: false
      verifyCerts: false
      username: admin
      password: admin
    # No Langfuse in fredlab — use plain logging tracer.
    tracer: logging
    # Dedicated exporter (prometheus_client.start_http_server, via fred-runtime's
    # shared context.py), separate from the API port. fred-runtime's own default
    # (enabled=true, address=127.0.0.1) is unreachable for scraping — address must
    # be explicit. Feeds the "Application KPIs" Grafana dashboard via a
    # PodMonitoring CR in this chart.
    observability:
      prometheus:
        enabled: true
        address: 0.0.0.0
        port: 9000

# knowledge-flow backend + worker. Ported verbatim from fredlab-infra values so
# ArgoCD renders the identical workloads. The migration job is intentionally NOT in
# this GitOps slice (live DB already at head); migrations stay imperative for now.
# Enabled + image + GSA + vertex project pinned in values-fredlab.yaml.
knowledgeFlow:
  enabled: false
  fullnameOverride: knowledge-flow-backend
  configMapName: knowledge-flow-config
  replicaCount: 1
  # Kubernetes service account annotated for Workload Identity. The GSA must hold
  # roles/storage.objectAdmin on the GCS buckets (see bin/fredlab-gcp-gcs-prereqs.sh).
  serviceAccount:
    name: knowledge-flow-backend
    # fredlab-knowledge-flow-gcs@<project-id>.iam.gserviceaccount.com
    gcpServiceAccount: ""
  image:
    # Example Artifact Registry image:
    # europe-west1-docker.pkg.dev/<project-id>/fredlab-repo/knowledge-flow-backend
    repository: ""
    tag: ""
  service:
    type: ClusterIP
    port: 8080
  containerPort: 8111
  metricsPort: 9111
  health:
    path: /knowledge-flow/v1/healthz
  migration:
    # Runs `alembic upgrade head` (KF version table alembic_version_knowledge_flow)
    # to create the metadata/tag/resource tables in the fred database.
    enabled: false
    backoffLimit: 3
    command:
      - alembic
    args:
      - upgrade
      - head
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        memory: 512Mi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi
  config:
    appBaseUrl: /knowledge-flow/v1
    logLevel: info
    keycloakInternalUrl: http://keycloak:8080
    keycloakIssuerUrl: https://keycloak.playground.fredlab.dev/realms/app
    keycloakClientId: knowledge-flow
    userClientId: app
    authorizedOrigins:
      - https://studio.playground.fredlab.dev
    openfgaUrl: http://openfga:8080
    openfgaStoreName: fred
    temporalAddress: temporal:7233
    temporalNamespace: default
    temporalTaskQueue: ingestion
    storage:
      # Content store: bucket_name is suffixed at runtime with -documents/-objects/-files.
      contentBucketName: fredlab-playground-content
      # Virtual filesystem bucket.
      filesystemBucketName: fredlab-playground-knowledge-flow
      filesystemPrefix: ""
      # Empty → inferred from ADC / Workload Identity.
      projectId: ""
      # SA email that signs V4 signed URLs for tabular Parquet reads (IAM signBlob
      # via Workload Identity). Empty → defaults to serviceAccount.gcpServiceAccount,
      # which the prereq script grants serviceAccountTokenCreator on itself.
      signingServiceAccountEmail: ""
    # OpenSearch is the vector store (hybrid/semantic search). The in-cluster
    # OpenSearch runs with the security plugin disabled → plain HTTP, no real auth.
    opensearch:
      host: http://opensearch:9200
      secure: false
      verifyCerts: false
      username: admin
      # Ignored by the security-disabled server, but must be non-empty.
      password: admin
      # The vector index. Tied to the embedding model's dimensions — if you change
      # the embedding model, use a new index name. Tracked in STORAGE-INVENTORY.md.
      vectorIndex: knowledge-flow-vectors
      vectorBulkSize: 1000
    # In-cluster Google Cloud Managed Service for Prometheus (GMP) query frontend
    # (the gmpFrontend Foundation component, gcp-c1/helm). baseUrl must match its
    # Service name — flip enabled once that Deployment is actually live.
    prometheus:
      enabled: false
      baseUrl: http://gmp-frontend:9090
    # Vertex AI models (authenticate via ADC). Needs roles/aiplatform.user on the GSA.
    models:
      # Empty project → resolved from ADC. Location must be a Vertex AI region.
      project: ""
      location: europe-west4
      chat:
        provider: vertex-ai-model-garden
        name: mistral-small-2503
        modelFamily: mistral
      embedding:
        provider: vertex-ai
        name: text-embedding-005
      vision:
        provider: vertex-ai
        name: gemini-2.5-flash

# knowledge-flow-worker: the Temporal worker that drains the `ingestion` task queue.
# The knowledge-flow-backend API submits ingestion workflows; this worker executes
# them (parse → embed → index). It runs the SAME image as knowledgeFlow but with the
# `main_worker` entrypoint, and REUSES the knowledge-flow-config ConfigMap so the
# task queue, Temporal address, models, GCS buckets and storage all match the API.
# It serves no HTTP API — only Prometheus metrics — so it has no Service/Ingress.
knowledgeFlowWorker:
  enabled: false
  fullnameOverride: knowledge-flow-worker
  replicaCount: 1
  # Kubernetes service account annotated for Workload Identity. The GSA must hold
  # roles/storage.objectAdmin on the GCS buckets AND roles/aiplatform.user (the worker
  # is what calls Vertex AI for embeddings/vision). WI binding for the KSA named here
  # is created by bin/fredlab-gcp-gcs-prereqs.sh (KSA_NAMES includes knowledge-flow-worker).
  serviceAccount:
    name: knowledge-flow-worker
    # fredlab-knowledge-flow-gcs@<project-id>.iam.gserviceaccount.com (same GSA as the backend)
    gcpServiceAccount: ""
  image:
    # Same image as knowledgeFlow.image (knowledge-flow-backend). Pin to the tag you
    # want the worker to run — usually identical to the backend tag.
    repository: ""
    tag: ""
  # Worker does the heavy lifting (document parsing + embeddings), so it gets more
  # headroom than the API pod.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 3Gi


# fred-frontend (nginx SPA + reverse proxy). Workload only — the studio Ingress,
# ManagedCertificate and BackendConfig STAY in the fredlab-infra layer (this chart
# never owns Ingress/certs). The Service keeps the backend-config annotation so the
# infra-owned BackendConfig (SSE timeout) still applies. Ported verbatim from infra
# values; enabled + image pinned in values-fredlab.yaml.
fredFrontend:
  enabled: false
  fullnameOverride: fred-frontend
  replicaCount: 1
  hostname: studio.playground.fredlab.dev
  managedCertificateName: fredlab-studio-cert
  image:
    # Example Artifact Registry image:
    # europe-west1-docker.pkg.dev/<project-id>/fredlab-repo/fred-frontend
    repository: ""
    tag: ""
  service:
    type: ClusterIP
    port: 8080
  containerPort: 8080
  upstreams:
    controlPlane: http://control-plane-backend:8080
    # nginx resolves upstream DNS names at startup, so each target must be a
    # service that already exists. Both knowledge-flow-backend and fred-agents are
    # now deployed by this chart, so the frontend points at them directly.
    fredAgents: http://fred-agents:8080
    knowledgeFlow: http://knowledge-flow-backend:8080
    # fred-evaluation-backend is deployed by this chart (fredEvaluation), so the
    # service name already resolves when nginx starts.
    evaluation: http://fred-evaluation-backend:8080
  clientMaxBodySize: 150m
  config:
    # Static pre-auth frontend configuration. It is served as /config.json
    # before the user has accepted CGU, so values needed by guards must live
    # here and not only in the authenticated control-plane bootstrap.
    configMapName: fred-frontend-config
    frontendBasename: /
    releaseBrand: fredlab
    featureFlags: {}
    properties: {}
  legal:
    # Public Markdown content served by nginx instead of the generic files
    # bundled in the frontend image. These files are not secrets and should be
    # reviewed/versioned with the deployment repository.
    enabled: true
    configMapName: fred-frontend-legal
    files:
      gcuFr: legal/gcu.fr.md
      gcuEn: legal/gcu.md
      gdprFr: legal/gdpr.fr.md
      gdprEn: legal/gdpr.md
  health:
    path: /config.json
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
  backendConfig:
    name: fredlab-frontend-backendconfig
    # L7 LB backend request timeout (seconds). Default is 30s, which cuts long SSE
    # chat streams mid-answer; 600s lets agent responses stream to completion.
    timeoutSec: 600
    healthCheck:
      requestPath: /config.json
      port: 8080
      type: HTTP
      checkIntervalSec: 15
      timeoutSec: 5
      healthyThreshold: 1
      unhealthyThreshold: 3


# fred-agent-evaluator backend (API) + worker. Ported from the imperative fredlab-infra
# layer to the GitOps Apps chart. FastAPI on :8336 (/evaluation/v1), reached IN-CLUSTER by
# the control-plane (NO ingress — internal-only). Two DISTINCT images (api != worker).
# No OpenFGA/OpenSearch/GCS in the base config. Enabled + images pinned in values-fredlab.yaml.
fredEvaluation:
  enabled: false
  fullnameOverride: fred-evaluation-backend
  configMapName: fred-evaluation-config
  replicaCount: 1
  serviceAccount:
    name: fred-evaluation-backend
    # Bind to a GSA with roles/aiplatform.user (Workload Identity) so the LLM-as-judge
    # reaches Vertex Gemini via ADC — no external API key. Set in values-fredlab.yaml.
    gcpServiceAccount: ""
  image:
    # europe-west1-docker.pkg.dev/<project-id>/fredlab-repo/fred-evaluation-api
    repository: ""
    tag: ""
  service:
    type: ClusterIP
    port: 8080
  containerPort: 8336
  health:
    path: /evaluation/v1/healthz
  resources:
    requests:
      cpu: 250m
      memory: 320Mi
    limits:
      memory: 1Gi
  config:
    appBaseUrl: /evaluation/v1
    logLevel: info
    keycloakIssuerUrl: https://keycloak.playground.fredlab.dev/realms/app
    keycloakClientId: evaluation
    userClientId: app
    authorizedOrigins:
      - https://studio.playground.fredlab.dev
    controlPlaneBaseUrl: http://control-plane-backend:8080/control-plane/v1
    runtimeBaseUrl: http://fred-agents:8080
    temporalAddress: temporal:7233
    temporalNamespace: default
    temporalTaskQueue: evaluation
    # fredlab has no Langfuse — plain logging tracer.
    tracer: logging
    langfuseHost: http://langfuse:3000
    # Vertex AI for the LLM-as-judge (litellm `vertex_ai/*` routing). Empty project →
    # resolved from ADC (Workload Identity). Location must be a Vertex AI region (same as KF).
    vertex:
      project: ""
      location: europe-west4
    worker:
      maxConcurrentCases: 4
      pollIntervalSeconds: 5

# fred-agent-evaluator worker: Temporal worker draining the `evaluation` queue. SEPARATE
# image from the API (main_worker entrypoint), REUSES the fred-evaluation-config ConfigMap.
# No Service/Ingress.
fredEvaluationWorker:
  enabled: false
  fullnameOverride: fred-evaluation-worker
  replicaCount: 1
  serviceAccount:
    name: fred-evaluation-worker
    # Same GSA as the API (aiplatform.user) — the worker runs the judge. Set in values-fredlab.yaml.
    gcpServiceAccount: ""
  image:
    # europe-west1-docker.pkg.dev/<project-id>/fredlab-repo/fred-evaluation-worker
    repository: ""
    tag: ""
  resources:
    requests:
      cpu: 250m
      memory: 384Mi
    limits:
      memory: 1Gi
