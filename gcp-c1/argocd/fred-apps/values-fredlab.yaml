# fredlab environment overlay — enables the apps and pins their images.
# The ArgoCD Application loads this AFTER values.yaml.
#
# This is the file the image-bump step (scripted commit) will edit: it sets the
# YYYYMMDD-<shortsha> tag per app, commits, and ArgoCD syncs the new tag.
#
# Region/project: GKE is europe-west9 but Artifact Registry is europe-west1
# (matches the build scripts' REGION default). Confirm the project id.

controlPlane:
  enabled: true
  image:
    # C5 (OPERATING-CONVENTIONS.md, proposed 2026-07-15): sourced from ghcr.io,
    # built by fred's own Build-and-push-docker.yml on the code/v* tag, rather
    # than a local Cloud Build round. The control-plane-migration Job (imperative
    # gcp-c1/helm chart, bin/fredlab-deploy.sh) still needs an Artifact Registry
    # copy — mirrored once from this same digest, see OPERATING-CONVENTIONS.md C5.
    repository: ghcr.io/thalesgroup/fred-agent/control-plane-backend
    tag: "v2.1.23" # release-tag: control-plane-backend

controlPlaneWorker:
  enabled: true
  image:
    # Same image as the backend (worker runs the control_plane_backend.main_worker
    # entrypoint off it). Shares the control-plane-backend release-tag marker.
    repository: ghcr.io/thalesgroup/fred-agent/control-plane-backend
    tag: "v2.1.23" # release-tag: control-plane-backend

fredAgents:
  enabled: true
  serviceAccount:
    # GSA with roles/aiplatform.user, bound to KSA default/fred-agents via Workload Identity.
    gcpServiceAccount: fredlab-knowledge-flow-gcs@fredlab-playground.iam.gserviceaccount.com
  image:
    repository: ghcr.io/thalesgroup/fred-agent/fred-agents
    tag: "v2.1.23" # release-tag: fred-agents

knowledgeFlow:
  enabled: true
  serviceAccount:
    # GSA with roles/storage.objectAdmin + roles/aiplatform.user, bound via Workload Identity.
    gcpServiceAccount: fredlab-knowledge-flow-gcs@fredlab-playground.iam.gserviceaccount.com
  image:
    repository: ghcr.io/thalesgroup/fred-agent/knowledge-flow-backend
    tag: "v2.1.23" # release-tag: knowledge-flow-backend
  config:
    models:
      # Vertex AI project (matches the imperative deploy's VERTEX_PROJECT=PROJECT_ID).
      project: fredlab-playground
    prometheus:
      # gcp-c1/helm's gmpFrontend Foundation component is now live (OPS-3).
      enabled: true

knowledgeFlowWorker:
  enabled: true
  serviceAccount:
    gcpServiceAccount: fredlab-knowledge-flow-gcs@fredlab-playground.iam.gserviceaccount.com
  image:
    # Same image as the backend (worker runs the main_worker entrypoint off it).
    repository: ghcr.io/thalesgroup/fred-agent/knowledge-flow-backend
    tag: "v2.1.23" # release-tag: knowledge-flow-backend
  # Chart default (500m/1Gi request, 3Gi limit, no CPU limit) was sized for the
  # "fast" profile. Under "medium" (Docling + OCR), observed live 2026-07-16:
  # CPU bursts past 1.5 cores (onnxruntime spawns threads for the node's full
  # core count, not the pod's cgroup share — see the affinity-pinning errors in
  # its logs) and memory exceeded the 1Gi request under real multi-file load,
  # OOMKilled 3 times in 6 minutes at the 3Gi limit. Bumped to 2 CPU/3Gi request
  # to give real headroom instead of fighting the node for scraps.
  #
  # TEMPORARILY REVERTED to chart default 2026-07-30: europe-west9's SSD_TOTAL_GB
  # quota is at 95% (475/500GB), so no new GKE node can be provisioned right now —
  # the 2 CPU/3Gi request couldn't fit on any existing node's remaining headroom,
  # leaving knowledge-flow-worker permanently Pending. Reverting to the smaller
  # default lets it fit on existing capacity for this afternoon's scalability
  # testing (fred-agents statelessness focus, not ingestion). Re-bump back to
  # 2 CPU/3Gi once the SSD quota is raised — the OOMKill risk under real
  # medium/rich-profile OCR load documented above is still real at this size.
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "4"
      memory: "3Gi"

fredFrontend:
  enabled: true
  image:
    repository: ghcr.io/thalesgroup/fred-agent/frontend
    tag: "v2.1.23" # release-tag: fred-frontend
  # Frontend's nginx resolves this upstream at REQUEST TIME via its `resolver` directive
  # (docker-entrypoint.sh: a deliberate choice so nginx doesn't crash-loop when evaluation
  # isn't deployed on a given platform) — unlike the other three upstreams (control-plane,
  # fred-agents, knowledge-flow), which are static `proxy_pass` targets resolved once at
  # nginx startup via the container's normal resolver (respects /etc/resolv.conf's search
  # domains). nginx's own runtime resolver does NOT do that search-domain expansion, so the
  # bare short name here 404s/502s with "could not be resolved" even though the service
  # exists and the same short name resolves fine via curl/wget in the same pod. Needs the
  # fully-qualified in-cluster DNS name instead — namespace-specific, hence overridden here
  # rather than in the base chart's values.yaml. Hit live on fredlab, 2026-07-24.
  upstreams:
    evaluation: http://fred-evaluation-backend.fred-demo.svc.cluster.local:8080

# fred-agent-evaluator (API + worker) — temporarily disabled 2026-07-30 to free node
# CPU/memory headroom (europe-west9 SSD_TOTAL_GB quota at 95%, blocking new-node
# provisioning for knowledge-flow-worker's rich-profile-sized request) and to get back to
# a base fred platform for v2.1.22 + multi-fred-agents testing. Re-enable once the quota is
# raised or the immediate testing need has passed — image tags below are left in place.
# Internal-only (no ingress). Two distinct images. LLM-as-judge on Vertex Gemini via
# Workload Identity. DB migrated (alembic head).
fredEvaluation:
  enabled: false
  serviceAccount:
    # Same GSA as KF/agents (roles/aiplatform.user) — Workload Identity for the Vertex judge.
    gcpServiceAccount: fredlab-knowledge-flow-gcs@fredlab-playground.iam.gserviceaccount.com
  config:
    vertex:
      project: fredlab-playground
  image:
    # C5 (OPERATING-CONVENTIONS.md): sourced from ghcr.io, built by fred-agent-evaluator's
    # OWN Build-and-push-docker.yml on its code/v* tag — same C5 pattern as the 4 apps
    # above, just under the fred-agent org namespace (separate GitHub repo/org from
    # thalesgroup/fred-agent, so the ghcr.io path differs; the tag scheme does not).
    repository: ghcr.io/fred-agent/fred-evaluation-api
    tag: "v1.1.3" # release-tag: fred-evaluation-api

fredEvaluationWorker:
  enabled: false
  serviceAccount:
    gcpServiceAccount: fredlab-knowledge-flow-gcs@fredlab-playground.iam.gserviceaccount.com
  image:
    # Same sourcing as fredEvaluation.image above (C5), but its OWN distinct image —
    # built from dockerfiles/Dockerfile-worker, not the API image with an overridden
    # entrypoint (unlike controlPlaneWorker/knowledgeFlowWorker, which reuse their API image).
    repository: ghcr.io/fred-agent/fred-evaluation-worker
    tag: "v1.1.3" # release-tag: fred-evaluation-worker
