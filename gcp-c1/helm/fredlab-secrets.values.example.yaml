# -----------------------------------------------------------------------------
# MODELE DE CONFIGURATION - CONFIGURATION GENERIQUE (TEMPLATE)
# Copiez ce fichier sous le nom 'fredlab-secrets.values.yaml' pour le remplir localement.
# Ce fichier exemple EST tracé par Git. NE METTEZ AUCUNE VALEUR RÉELLE ICI.
# -----------------------------------------------------------------------------

# Mots de passe d'accès aux bases de données créées dans PostgreSQL
postgresql:
  admin:
    password: ""   # À REMPLIR : Mot de passe du superadmin 'postgres'
  keycloak:
    password: ""   # À REMPLIR : Utilisé par Keycloak pour sa database
  openfga:
    password: ""   # À REMPLIR : Utilisé par OpenFGA pour sa database
  temporal:
    password: ""   # À REMPLIR : Utilisé par Temporal pour sa database
  fred:
    password: ""   # À REMPLIR : Utilisé par le backend Control Plane / Fred
  evaluation:
    password: ""   # À REMPLIR : Utilisé par le fred-agent-evaluator (base dédiée 'evaluation')
  grafana:
    password: ""   # À REMPLIR si grafana.datasources.postgres.enabled=true : rôle en lecture seule (aucune base dédiée)

# Configuration du serveur d'identité Keycloak
keycloak:
  admin:
    password: ""  # À REMPLIR : Mot de passe du compte 'admin' master initial
  clients:
    controlPlane:
      secret: ""  # À REMPLIR : Secret du client Keycloak confidentiel 'control-plane'
    knowledgeFlow:
      secret: ""  # À REMPLIR : Secret du client Keycloak confidentiel 'knowledge-flow'
    agentic:
      secret: ""  # À REMPLIR : Secret du client Keycloak confidentiel 'agentic' (fred-agents)
    evaluation:
      secret: ""  # À REMPLIR : Secret du client Keycloak confidentiel 'evaluation' (fred-agent-evaluator)
    temporalUi:
      secret: ""  # À REMPLIR : Secret du client Keycloak confidentiel 'temporal-ui' (auth UI Temporal)
    grafana:
      secret: ""  # À REMPLIR si grafana.auth.enabled=true : Secret du client Keycloak confidentiel 'grafana'

# Clé API LLM compatible OpenAI (ex. token Mistral https://api.mistral.ai/v1),
# utilisée par fred-agents (et knowledge-flow si configuré sur un modèle openai).
openaiApiKey: ""  # À REMPLIR : token Mistral / OpenAI-compatible

# Clé API Mistral des modèles juges du fred-agent-evaluator (câblage Mistral TBD).
# Optionnel ; vide = non configuré.
mistralApiKey: ""  # À REMPLIR : token Mistral pour le juge d'évaluation

# Clés Langfuse de l'évaluateur, utilisées uniquement si fredEvaluation.config.tracer=langfuse
# (fredlab utilise 'logging' par défaut). Laisser vide sinon.
langfuse:
  publicKey: ""  # À REMPLIR si tracer=langfuse
  secretKey: ""  # À REMPLIR si tracer=langfuse
  
  # NOTE ÉQUIPE : Spécifier ici sous forme de commentaires ou de variables 
  # les emails des administrateurs nominatifs à provisionner sur cet environnement.

# Mot de passe admin Grafana. Requis uniquement si grafana.enabled=true.
grafana:
  admin:
    password: ""  # À REMPLIR si grafana.enabled=true

# Configuration de la sécurité de l'API OpenFGA (Fine-Grained Authorization)
openfga:
  auth:
    apiToken: ""  # À REMPLIR : Jeton partagé pour authentifier les clients de l'API Fred

# Jeton unique d'amorçage du premier platform_admin (AUTHZ-07, RFC
# FRED-AUTHORIZATION-TARGET-MODEL Part 8 §40-42). Fred ne le génère et ne le
# journalise jamais : générez-le vous-même (ex. `openssl rand -hex 32`) avant le
# premier `helm upgrade` d'une instance neuve. Une fois le bootstrap effectué (un
# seul platform_admin auto-promu), la valeur devient inerte grâce au marqueur
# durable côté Fred ; la retirer ou la faire tourner ensuite reste une bonne
# pratique opérationnelle, non imposée par Fred.
controlPlaneBootstrapToken: ""  # À REMPLIR

# Compte de service GCP (Workload Identity) qui signe les URLs V4 pour les lectures
# Parquet du content store GCS (IAM signBlob, aucune clé JSON). Requis dès que le
# content_storage est de type gcs, sinon knowledge-flow-backend crashe au démarrage
# (ValueError: content_storage.type=gcs requires 'signing_service_account_email').
# Le SA a déjà roles/iam.serviceAccountTokenCreator sur lui-même via
# bin/fredlab-gcp-gcs-prereqs.sh.
knowledgeFlow:
  config:
    storage:
      signingServiceAccountEmail: ""  # À REMPLIR : fredlab-knowledge-flow-gcs@<project-id>.iam.gserviceaccount.com
    models:
      project: ""  # À REMPLIR : projet GCP Vertex AI (ex. fredlab-playground) — sinon knowledge-flow-backend
                    # crashe au démarrage (ValueError: Missing ['project'] in Vertex AI embeddings settings)
