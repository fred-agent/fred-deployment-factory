{{- if and .Values.ingress.enabled .Values.ingress.backendConfig.enabled }}
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ .Values.ingress.backendConfig.name }}
  labels:
    {{- include "fredlab-infra.labels" . | nindent 4 }}
spec:
  healthCheck:
    requestPath: {{ .Values.ingress.backendConfig.healthCheck.requestPath | quote }}
    port: {{ .Values.ingress.backendConfig.healthCheck.port }}
    type: {{ .Values.ingress.backendConfig.healthCheck.type }}
    checkIntervalSec: {{ .Values.ingress.backendConfig.healthCheck.checkIntervalSec }}
    timeoutSec: {{ .Values.ingress.backendConfig.healthCheck.timeoutSec }}
    healthyThreshold: {{ .Values.ingress.backendConfig.healthCheck.healthyThreshold }}
    unhealthyThreshold: {{ .Values.ingress.backendConfig.healthCheck.unhealthyThreshold }}
{{- if and .Values.temporal.enabled .Values.temporal.ui.enabled }}
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ .Values.temporal.ui.backendConfig.name }}
  labels:
    {{- include "fredlab-infra.labels" . | nindent 4 }}
spec:
  {{- if .Values.adminAccess.securityPolicyName }}
  # Optional defense-in-depth: attach a Cloud Armor IP allowlist IN FRONT of the
  # OIDC login. Only emitted when a non-empty policy name is set, because a name
  # pointing at a non-existent policy makes the BackendConfig fail to sync (which
  # previously left the UI with no protection at all). Primary gate is OIDC.
  securityPolicy:
    name: {{ .Values.adminAccess.securityPolicyName | quote }}
  {{- end }}
  healthCheck:
    requestPath: {{ .Values.temporal.ui.backendConfig.healthCheck.requestPath | quote }}
    port: {{ .Values.temporal.ui.backendConfig.healthCheck.port }}
    type: {{ .Values.temporal.ui.backendConfig.healthCheck.type }}
    checkIntervalSec: {{ .Values.temporal.ui.backendConfig.healthCheck.checkIntervalSec }}
    timeoutSec: {{ .Values.temporal.ui.backendConfig.healthCheck.timeoutSec }}
    healthyThreshold: {{ .Values.temporal.ui.backendConfig.healthCheck.healthyThreshold }}
    unhealthyThreshold: {{ .Values.temporal.ui.backendConfig.healthCheck.unhealthyThreshold }}
{{- end }}
{{- if .Values.fredFrontend.ingressEnabled }}
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ .Values.fredFrontend.backendConfig.name }}
  labels:
    {{- include "fredlab-infra.labels" . | nindent 4 }}
spec:
  {{- if .Values.fredFrontend.backendConfig.timeoutSec }}
  # Backend request timeout for the L7 LB. The default is 30s, which severs long
  # SSE chat streams mid-response; raise it so agent answers can stream to completion.
  timeoutSec: {{ .Values.fredFrontend.backendConfig.timeoutSec }}
  {{- end }}
  healthCheck:
    requestPath: {{ .Values.fredFrontend.backendConfig.healthCheck.requestPath | quote }}
    port: {{ .Values.fredFrontend.backendConfig.healthCheck.port }}
    type: {{ .Values.fredFrontend.backendConfig.healthCheck.type }}
    checkIntervalSec: {{ .Values.fredFrontend.backendConfig.healthCheck.checkIntervalSec }}
    timeoutSec: {{ .Values.fredFrontend.backendConfig.healthCheck.timeoutSec }}
    healthyThreshold: {{ .Values.fredFrontend.backendConfig.healthCheck.healthyThreshold }}
    unhealthyThreshold: {{ .Values.fredFrontend.backendConfig.healthCheck.unhealthyThreshold }}
{{- end }}
{{- if and .Values.grafana.enabled .Values.grafana.hostname }}
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ .Values.grafana.backendConfig.name }}
  labels:
    {{- include "fredlab-infra.labels" . | nindent 4 }}
spec:
  {{- if .Values.adminAccess.securityPolicyName }}
  # Same optional defense-in-depth as Temporal UI's BackendConfig: a Cloud Armor
  # IP allowlist IN FRONT of the OIDC login. Primary gate is OIDC (grafana.auth).
  securityPolicy:
    name: {{ .Values.adminAccess.securityPolicyName | quote }}
  {{- end }}
  healthCheck:
    requestPath: {{ .Values.grafana.backendConfig.healthCheck.requestPath | quote }}
    port: {{ .Values.grafana.backendConfig.healthCheck.port }}
    type: {{ .Values.grafana.backendConfig.healthCheck.type }}
    checkIntervalSec: {{ .Values.grafana.backendConfig.healthCheck.checkIntervalSec }}
    timeoutSec: {{ .Values.grafana.backendConfig.healthCheck.timeoutSec }}
    healthyThreshold: {{ .Values.grafana.backendConfig.healthCheck.healthyThreshold }}
    unhealthyThreshold: {{ .Values.grafana.backendConfig.healthCheck.unhealthyThreshold }}
{{- end }}
{{- end }}
