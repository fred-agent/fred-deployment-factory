apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-provision
  labels:
    {{- include "fredlab-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-provision
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "fredlab-infra.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres-provision
    spec:
      enableServiceLinks: false
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres-provision
          image: {{ .Values.images.postgresClient | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          envFrom:
            - secretRef:
                name: {{ include "fredlab-infra.secretName" . }}
          env:
            {{- if and .Values.grafana.enabled .Values.grafana.datasources.postgres.enabled }}
            - name: POSTGRES_GRAFANA_USER
              value: {{ .Values.postgresql.grafana.user | quote }}
            {{- end }}
            - name: PGHOST
              value: {{ include "fredlab-infra.postgresName" . }}
            - name: PGPORT
              value: {{ .Values.postgresql.service.port | quote }}
            - name: PGDATABASE
              value: postgres
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ include "fredlab-infra.secretName" . }}
                  key: POSTGRES_ADMIN_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "fredlab-infra.secretName" . }}
                  key: POSTGRES_ADMIN_PASSWORD
            {{- if and .Values.grafana.enabled .Values.grafana.datasources.postgres.enabled }}
            - name: POSTGRES_GRAFANA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "fredlab-infra.secretName" . }}
                  key: POSTGRES_GRAFANA_PASSWORD
            {{- end }}
          command:
            - /bin/sh
            - -ec
            - |
              until pg_isready -h "$PGHOST" -U "$PGUSER" -d "$PGDATABASE"; do sleep 2; done

              provision_db() {
                local db="$1"
                local user="$2"
                local password="$3"

                psql \
                  -v ON_ERROR_STOP=1 \
                  -v db="$db" \
                  -v user="$user" \
                  -v password="$password" <<'SQL'
              SELECT format('CREATE ROLE %I NOSUPERUSER LOGIN PASSWORD %L', :'user', :'password')
              WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'user')\gexec
              SELECT format('ALTER ROLE %I WITH PASSWORD %L', :'user', :'password')\gexec
              SELECT format('CREATE DATABASE %I OWNER %I', :'db', :'user')
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'db')\gexec
              SELECT format('ALTER DATABASE %I OWNER TO %I', :'db', :'user')\gexec
              SELECT format('REVOKE ALL ON DATABASE %I FROM PUBLIC', :'db')\gexec
              SELECT format('GRANT CONNECT ON DATABASE %I TO %I', :'db', :'user')\gexec
              SQL
              }

              provision_db "$POSTGRES_KEYCLOAK_DB" "$POSTGRES_KEYCLOAK_USER" "$POSTGRES_KEYCLOAK_PASSWORD"
              provision_db "$POSTGRES_OPENFGA_DB" "$POSTGRES_OPENFGA_USER" "$POSTGRES_OPENFGA_PASSWORD"
              provision_db "$POSTGRES_TEMPORAL_DB" "$POSTGRES_TEMPORAL_USER" "$POSTGRES_TEMPORAL_PASSWORD"
              provision_db "$POSTGRES_TEMPORAL_VISIBILITY_DB" "$POSTGRES_TEMPORAL_USER" "$POSTGRES_TEMPORAL_PASSWORD"
              provision_db "$POSTGRES_FRED_DB" "$POSTGRES_FRED_USER" "$POSTGRES_FRED_PASSWORD"
              provision_db "$POSTGRES_EVALUATION_DB" "$POSTGRES_EVALUATION_USER" "$POSTGRES_EVALUATION_PASSWORD"

              {{- if and .Values.grafana.enabled .Values.grafana.datasources.postgres.enabled }}
              # Read-only observability role for Grafana's Postgres datasource (DB-size
              # dashboard panels). CONNECT-only on every database + pg_read_all_stats
              # membership is enough to call pg_database_size()/pg_total_relation_size();
              # it grants no SELECT on any table, so it cannot read business data.
              psql \
                -v ON_ERROR_STOP=1 \
                -v user="$POSTGRES_GRAFANA_USER" \
                -v password="$POSTGRES_GRAFANA_PASSWORD" <<'SQL'
              SELECT format('CREATE ROLE %I NOSUPERUSER LOGIN PASSWORD %L', :'user', :'password')
              WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'user')\gexec
              SELECT format('ALTER ROLE %I WITH PASSWORD %L', :'user', :'password')\gexec
              SELECT format('GRANT pg_read_all_stats TO %I', :'user')\gexec
              SQL

              grant_connect() {
                local db="$1"
                local user="$2"

                psql \
                  -v ON_ERROR_STOP=1 \
                  -v db="$db" \
                  -v user="$user" <<'SQL'
              SELECT format('GRANT CONNECT ON DATABASE %I TO %I', :'db', :'user')\gexec
              SQL
              }

              grant_connect "$POSTGRES_KEYCLOAK_DB" "$POSTGRES_GRAFANA_USER"
              grant_connect "$POSTGRES_OPENFGA_DB" "$POSTGRES_GRAFANA_USER"
              grant_connect "$POSTGRES_TEMPORAL_DB" "$POSTGRES_GRAFANA_USER"
              grant_connect "$POSTGRES_TEMPORAL_VISIBILITY_DB" "$POSTGRES_GRAFANA_USER"
              grant_connect "$POSTGRES_FRED_DB" "$POSTGRES_GRAFANA_USER"
              grant_connect "$POSTGRES_EVALUATION_DB" "$POSTGRES_GRAFANA_USER"
              {{- end }}

              # Knowledge Flow's pgvector store needs the "vector" extension. It is an
              # untrusted extension, so only a superuser can create it — the fred app
              # user cannot. Create it here (admin/superuser) in the fred database;
              # idempotent, so KF's own CREATE EXTENSION IF NOT EXISTS becomes a no-op.
              psql -v ON_ERROR_STOP=1 -d "$POSTGRES_FRED_DB" \
                -c "CREATE EXTENSION IF NOT EXISTS vector;"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
