apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fredlab-infra.secretName" . }}
  labels:
    {{- include "fredlab-infra.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_ADMIN_USER: {{ .Values.postgresql.admin.user | quote }}
  POSTGRES_ADMIN_PASSWORD: {{ required "postgresql.admin.password is required. Provide it with fredlab-secrets.values.yaml." .Values.postgresql.admin.password | quote }}
  POSTGRES_KEYCLOAK_DB: {{ .Values.postgresql.keycloak.database | quote }}
  POSTGRES_KEYCLOAK_USER: {{ .Values.postgresql.keycloak.user | quote }}
  POSTGRES_KEYCLOAK_PASSWORD: {{ required "postgresql.keycloak.password is required. Provide it with fredlab-secrets.values.yaml." .Values.postgresql.keycloak.password | quote }}
  POSTGRES_OPENFGA_DB: {{ .Values.postgresql.openfga.database | quote }}
  POSTGRES_OPENFGA_USER: {{ .Values.postgresql.openfga.user | quote }}
  POSTGRES_OPENFGA_PASSWORD: {{ required "postgresql.openfga.password is required. Provide it with fredlab-secrets.values.yaml." .Values.postgresql.openfga.password | quote }}
  POSTGRES_TEMPORAL_DB: {{ .Values.postgresql.temporal.database | quote }}
  POSTGRES_TEMPORAL_VISIBILITY_DB: {{ .Values.postgresql.temporal.visibilityDatabase | quote }}
  POSTGRES_TEMPORAL_USER: {{ .Values.postgresql.temporal.user | quote }}
  POSTGRES_TEMPORAL_PASSWORD: {{ required "postgresql.temporal.password is required. Provide it with fredlab-secrets.values.yaml." .Values.postgresql.temporal.password | quote }}
  POSTGRES_FRED_DB: {{ .Values.postgresql.fred.database | quote }}
  POSTGRES_FRED_USER: {{ .Values.postgresql.fred.user | quote }}
  POSTGRES_FRED_PASSWORD: {{ required "postgresql.fred.password is required. Provide it with fredlab-secrets.values.yaml." .Values.postgresql.fred.password | quote }}
  POSTGRES_EVALUATION_DB: {{ .Values.postgresql.evaluation.database | quote }}
  POSTGRES_EVALUATION_USER: {{ .Values.postgresql.evaluation.user | quote }}
  POSTGRES_EVALUATION_PASSWORD: {{ required "postgresql.evaluation.password is required. Provide it with fredlab-secrets.values.yaml." .Values.postgresql.evaluation.password | quote }}
  KC_BOOTSTRAP_ADMIN_USERNAME: {{ .Values.keycloak.admin.user | quote }}
  KC_BOOTSTRAP_ADMIN_PASSWORD: {{ required "keycloak.admin.password is required. Provide it with fredlab-secrets.values.yaml." .Values.keycloak.admin.password | quote }}
  KEYCLOAK_CONTROL_PLANE_CLIENT_SECRET: {{ required "keycloak.clients.controlPlane.secret is required. Provide it with fredlab-secrets.values.yaml." .Values.keycloak.clients.controlPlane.secret | quote }}
  KEYCLOAK_KNOWLEDGE_FLOW_CLIENT_SECRET: {{ required "keycloak.clients.knowledgeFlow.secret is required. Provide it with fredlab-secrets.values.yaml." .Values.keycloak.clients.knowledgeFlow.secret | quote }}
  KEYCLOAK_AGENTIC_CLIENT_SECRET: {{ required "keycloak.clients.agentic.secret is required. Provide it with fredlab-secrets.values.yaml." .Values.keycloak.clients.agentic.secret | quote }}
{{- if and .Values.temporal.enabled .Values.temporal.ui.enabled .Values.temporal.ui.auth.enabled }}
  KEYCLOAK_TEMPORAL_UI_CLIENT_SECRET: {{ required "keycloak.clients.temporalUi.secret is required when temporal.ui.auth.enabled. Provide it with fredlab-secrets.values.yaml." .Values.keycloak.clients.temporalUi.secret | quote }}
{{- end }}
  OPENFGA_API_TOKEN: {{ required "openfga.auth.apiToken is required. Provide it with fredlab-secrets.values.yaml." .Values.openfga.auth.apiToken | quote }}
  # Root platform-admin bootstrap secret (AUTHZ-07). Dedicated key on the existing
  # Foundation Secret; the Apps layer only ever references it by name/key, never
  # creates a Secret of its own.
  CONTROL_PLANE_BOOTSTRAP_TOKEN: {{ required "controlPlaneBootstrapToken is required. Provide it with fredlab-secrets.values.yaml." .Values.controlPlaneBootstrapToken | quote }}
  OPENAI_API_KEY: {{ .Values.openaiApiKey | default "" | quote }}
  KEYCLOAK_EVALUATION_CLIENT_SECRET: {{ required "keycloak.clients.evaluation.secret is required. Provide it with fredlab-secrets.values.yaml." .Values.keycloak.clients.evaluation.secret | quote }}
  # Mistral judge key for the evaluator (analysis + judge_profiles). Optional until
  # judging runs; empty = not configured (Mistral wiring TBD).
  MISTRAL_API_KEY: {{ .Values.mistralApiKey | default "" | quote }}
  # Langfuse keys, only used when fredEvaluation.config.tracer=langfuse. Optional.
  LANGFUSE_PUBLIC_KEY: {{ .Values.langfuse.publicKey | default "" | quote }}
  LANGFUSE_SECRET_KEY: {{ .Values.langfuse.secretKey | default "" | quote }}
{{- if .Values.grafana.enabled }}
  GRAFANA_ADMIN_PASSWORD: {{ required "grafana.admin.password is required when grafana.enabled=true. Provide it with fredlab-secrets.values.yaml." .Values.grafana.admin.password | quote }}
{{- if .Values.grafana.auth.enabled }}
  KEYCLOAK_GRAFANA_CLIENT_SECRET: {{ required "keycloak.clients.grafana.secret is required when grafana.auth.enabled. Provide it with fredlab-secrets.values.yaml." .Values.keycloak.clients.grafana.secret | quote }}
{{- end }}
{{- if .Values.grafana.datasources.postgres.enabled }}
  POSTGRES_GRAFANA_PASSWORD: {{ required "postgresql.grafana.password is required when grafana.datasources.postgres.enabled. Provide it with fredlab-secrets.values.yaml." .Values.postgresql.grafana.password | quote }}
{{- end }}
{{- end }}
