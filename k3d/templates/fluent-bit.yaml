{{- if eq (include "fred-stack.logCollectionEnabled" .) "true" }}
{{- /*
Fluent Bit ships every container's output of this namespace, and the cluster's
Kubernetes events, to OpenSearch (see logCollection in values.yaml). One pod
per node, reading the node's /var/log/containers.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  labels:
    {{- include "fred-stack.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-fluent-bit
  labels:
    {{- include "fred-stack.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-fluent-bit
  labels:
    {{- include "fred-stack.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-fluent-bit
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  labels:
    {{- include "fred-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: fluent-bit
data:
  fluent-bit.conf: |
{{ include "fred-stack.fluentBitConfig" . | indent 4 }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  labels:
    {{- include "fred-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: fluent-bit
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: fluent-bit
      {{- include "fred-stack.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: fluent-bit
        {{- include "fred-stack.selectorLabels" . | nindent 8 }}
      annotations:
        # Mounted with subPath, which never updates: a changed config rolls the pods.
        checksum/config: {{ include "fred-stack.fluentBitConfig" . | sha256sum }}
    spec:
      serviceAccountName: fluent-bit
      enableServiceLinks: false
      containers:
        - name: fluent-bit
          image: {{ .Values.images.fluentBit }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: OPENSEARCH_USER
              valueFrom:
                secretKeyRef: { name: fred-secrets, key: OPENSEARCH_ADMIN }
            - name: OPENSEARCH_PASSWORD
              valueFrom:
                secretKeyRef: { name: fred-secrets, key: OPENSEARCH_ADMIN_PASSWORD }
          # Root: the node's container logs are readable by root only.
          securityContext:
            runAsUser: 0
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/fluent-bit.conf
              subPath: fluent-bit.conf
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: state
              mountPath: /var/lib/fluent-bit
      volumes:
        - name: config
          configMap:
            name: fluent-bit-config
        - name: varlog
          hostPath:
            path: /var/log
        # Where each file was read up to: survives a restart, no line twice.
        - name: state
          hostPath:
            path: /var/lib/fluent-bit
            type: DirectoryOrCreate
{{- end }}
