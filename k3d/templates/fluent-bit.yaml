{{- if eq (include "fred-stack.logCollectionEnabled" .) "true" }}
{{- /*
Fluent Bit ships every container's output of this namespace, and the cluster's
Kubernetes events, to OpenSearch (see logCollection in values.yaml). One pod
per node, reading the node's /var/log/containers.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  labels:
    {{- include "fred-stack.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-fluent-bit
  labels:
    {{- include "fred-stack.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-fluent-bit
  labels:
    {{- include "fred-stack.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-fluent-bit
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  labels:
    {{- include "fred-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: fluent-bit
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         2
        Log_Level     warn
        HTTP_Server   Off

    # One record per line of a container's stdout/stderr (CRI format).
    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*_{{ .Release.Namespace }}_*.log
        Exclude_Path      /var/log/containers/fluent-bit-*
        multiline.parser  cri
        # A file it has never read is read from its start (what a pod logged
        # before Fluent Bit ran); the DB then remembers where each file stops.
        Read_from_Head    On
        DB                /var/lib/fluent-bit/tail.db
        Mem_Buf_Limit     32MB
        Skip_Long_Lines   On
        Refresh_Interval  5

    # OOMKilled, BackOff, failed probes, image pulls...
    [INPUT]
        Name   kubernetes_events
        Tag    k8s_events

    # Pod, container and labels on every line; a line that is JSON (Fred's
    # audit log, for one) is parsed under `log_json`, away from other fields.
    [FILTER]
        Name             kubernetes
        Match            kube.*
        Kube_Tag_Prefix  kube.var.log.containers.
        Merge_Log        On
        Merge_Log_Key    log_json
        Keep_Log         On
        Labels           On
        Annotations      Off

    [OUTPUT]
        Name                opensearch
        Match               kube.*
        Host                opensearch
        Port                9200
        tls                 On
        tls.verify          Off
        HTTP_User           ${OPENSEARCH_USER}
        HTTP_Passwd         ${OPENSEARCH_PASSWORD}
        Logstash_Format     On
        Logstash_Prefix     k3d-logs
        Suppress_Type_Name  On
        Replace_Dots        On
        Retry_Limit         5

    [OUTPUT]
        Name                opensearch
        Match               k8s_events
        Host                opensearch
        Port                9200
        tls                 On
        tls.verify          Off
        HTTP_User           ${OPENSEARCH_USER}
        HTTP_Passwd         ${OPENSEARCH_PASSWORD}
        Logstash_Format     On
        Logstash_Prefix     k3d-events
        Suppress_Type_Name  On
        Replace_Dots        On
        Retry_Limit         5
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  labels:
    {{- include "fred-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: fluent-bit
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: fluent-bit
      {{- include "fred-stack.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: fluent-bit
        {{- include "fred-stack.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: fluent-bit
      enableServiceLinks: false
      containers:
        - name: fluent-bit
          image: {{ .Values.images.fluentBit }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: OPENSEARCH_USER
              valueFrom:
                secretKeyRef: { name: fred-secrets, key: OPENSEARCH_ADMIN }
            - name: OPENSEARCH_PASSWORD
              valueFrom:
                secretKeyRef: { name: fred-secrets, key: OPENSEARCH_ADMIN_PASSWORD }
          # Root: the node's container logs are readable by root only.
          securityContext:
            runAsUser: 0
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/fluent-bit.conf
              subPath: fluent-bit.conf
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: state
              mountPath: /var/lib/fluent-bit
      volumes:
        - name: config
          configMap:
            name: fluent-bit-config
        - name: varlog
          hostPath:
            path: /var/log
        # Where each file was read up to: survives a restart, no line twice.
        - name: state
          hostPath:
            path: /var/lib/fluent-bit
            type: DirectoryOrCreate
{{- end }}
