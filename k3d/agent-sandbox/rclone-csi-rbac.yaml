apiVersion: v1
kind: ServiceAccount
metadata:
  name: csi-rclone-controller-sa
  namespace: fred-sandbox-csi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: csi-rclone-node-sa
  namespace: fred-sandbox-csi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rclone-controller
rules:
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, list, watch, create, delete, patch]
  - apiGroups: [storage.k8s.io]
    resources: [volumeattachments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch, update]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [list, watch, create, update, patch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses, csinodes]
    verbs: [get, list, watch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rclone-controller
subjects:
  - kind: ServiceAccount
    name: csi-rclone-controller-sa
    namespace: fred-sandbox-csi
roleRef:
  kind: ClusterRole
  name: rclone-controller
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rclone-node
rules:
  - apiGroups: [""]
    resources: [persistentvolumes, persistentvolumeclaims, nodes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [persistentvolumeclaims/status]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [storage.k8s.io]
    resources: [csinodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rclone-node
subjects:
  - kind: ServiceAccount
    name: csi-rclone-node-sa
    namespace: fred-sandbox-csi
roleRef:
  kind: ClusterRole
  name: rclone-node
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rclone-controller-mount-secrets
  namespace: fred-sandbox
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rclone-controller-mount-secrets
  namespace: fred-sandbox
subjects:
  - kind: ServiceAccount
    name: csi-rclone-controller-sa
    namespace: fred-sandbox-csi
roleRef:
  kind: Role
  name: rclone-controller-mount-secrets
  apiGroup: rbac.authorization.k8s.io
