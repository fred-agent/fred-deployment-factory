apiVersion: v1
kind: Namespace
metadata:
  name: fred-sandbox
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: fred-sandbox-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fred-sandbox-deny-all
  namespace: fred-sandbox
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: fred-sandbox-cap
  namespace: fred-sandbox
spec:
  hard:
    pods: "20"
    persistentvolumeclaims: "20"
    requests.storage: 20Gi
    count/secrets: "20"
    requests.cpu: "4"
    requests.memory: 4Gi
    limits.cpu: "12"
    limits.memory: 8Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fred-sandbox-broker
  namespace: fred-sandbox-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fred-sandbox-broker
  namespace: fred-sandbox
rules:
  - apiGroups: [extensions.agents.x-k8s.io]
    resources: [sandboxclaims]
    verbs: [create, get, list, watch, patch, delete]
  - apiGroups: [extensions.agents.x-k8s.io]
    resources: [sandboxtemplates, sandboxwarmpools]
    verbs: [get]
  - apiGroups: [agents.x-k8s.io]
    resources: [sandboxes]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [get, create]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fred-sandbox-broker
  namespace: fred-sandbox
subjects:
  - kind: ServiceAccount
    name: fred-sandbox-broker
    namespace: fred-sandbox-system
roleRef:
  kind: Role
  name: fred-sandbox-broker
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fred-sandbox-broker-read
rules:
  - apiGroups: [node.k8s.io]
    resources: [runtimeclasses]
    verbs: [get]
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [fred-sandbox]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fred-sandbox-broker-read
subjects:
  - kind: ServiceAccount
    name: fred-sandbox-broker
    namespace: fred-sandbox-system
roleRef:
  kind: ClusterRole
  name: fred-sandbox-broker-read
  apiGroup: rbac.authorization.k8s.io
