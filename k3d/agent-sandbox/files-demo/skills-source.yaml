apiVersion: apps/v1
kind: Deployment
metadata:
  name: fred-platform-skills-source
  namespace: fred
spec:
  replicas: 1
  selector:
    matchLabels: { app: fred-platform-skills-source }
  template:
    metadata:
      labels: { app: fred-platform-skills-source }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: source
          image: REPLACE_WITH_APPROVED_PYTHON_IMAGE_DIGEST
          command: [python, /app/skill-webdav-server.py]
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { tcpSocket: { port: 8080 } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          volumeMounts:
            - { name: server, mountPath: /app, readOnly: true }
            - { name: skill, mountPath: /skills/summarize-document, readOnly: true }
            - { name: tabular-evidence, mountPath: /skills/tabular-evidence, readOnly: true }
      volumes:
        - name: server
          configMap: { name: fred-platform-skills-source-code }
        - name: skill
          configMap: { name: fred-platform-summarize-document }
        - name: tabular-evidence
          configMap: { name: fred-platform-tabular-evidence }
---
apiVersion: v1
kind: Service
metadata:
  name: fred-platform-skills-source
  namespace: fred
spec:
  type: ClusterIP
  selector: { app: fred-platform-skills-source }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
