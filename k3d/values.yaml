nameOverride: ""
fullnameOverride: ""

imagePullPolicy: IfNotPresent

# Stack profile — selects which services are deployed:
#   base (default) → drops ClickHouse (only Langfuse uses it)
#   extended       → the full stack (everything)
# ClickHouse is deployed only when stack=extended AND clickhouse.enabled.
# Observability (Prometheus, Grafana, log collection) is part of both profiles,
# each behind its own `enabled` flag below.
stack: base

host:
  fqdn: localhost
  frontendPort: 8088
  dashboardsPort: 5601

# One issuer reachable with the same hostname/port from the browser and the pods.
keycloak:
  hostname: keycloak
  publicPort: 8080
  # The confidential service clients applications use, beyond the platform's own
  # (files/scripts/keycloak-post-install-k8s.sh), applied by the post-install Job.
  # secretKey is the client's key in `fred-secrets`; grants are <client>/<role>
  # for its service account; representation and protocolMappers are Keycloak's own.
  serviceClients:
    fred-evaluation-worker:
      secretKey: KEYCLOAK_EVAL_WORKER_CLIENT_SECRET
      secret: Azerty123_
      grants: [app/service_agent]
    # Named after the prefix it publishes under: Fred binds the prefix to the client.
    kb-fred.webdav:
      secretKey: KEYCLOAK_KB_FRED_WEBDAV_CLIENT_SECRET
      secret: Azerty123_
      grants: [app/service_agent]
    # Weaver's ingestion worker, a workload that calls the control plane as itself.
    knowledge-flow-worker:
      secretKey: KEYCLOAK_MANAGER_WORKER_CLIENT_SECRET
      secret: Azerty123_
      representation:
        standardFlowEnabled: false
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        fullScopeAllowed: false
      protocolMappers:
        - name: workload-audience
          protocolMapper: oidc-audience-mapper
          config:
            included.custom.audience: control-plane
        - name: workload-client-id
          protocolMapper: oidc-hardcoded-claim-mapper
          config:
            claim.name: client_id
            claim.value: knowledge-flow-worker
            jsonType.label: String
        - name: workload-username
          protocolMapper: oidc-usermodel-property-mapper
          config:
            user.attribute: username
            claim.name: preferred_username
            jsonType.label: String

auth:
  postgresAdminUser: admin
  postgresAdminPassword: Azerty123_

  postgresKeycloakUser: keycloak_db_user
  postgresKeycloakPassword: Azerty123_
  postgresKeycloakDb: keycloak

  postgresFredUser: fred
  postgresFredPassword: Azerty123_
  # The database of the line that uses this login (lines.swift below).
  postgresFredDb: fred_swift

  postgresTabularUser: tabular
  postgresTabularPassword: Azerty123_
  postgresTabularDb: data

  postgresOpenfgaUser: openfga
  postgresOpenfgaPassword: Azerty123_
  postgresOpenfgaDb: openfga

  postgresTemporalUser: temporal
  postgresTemporalPassword: Azerty123_
  postgresTemporalDb: temporal
  postgresTemporalVisibilityDb: temporal_visibility

  postgresEvaluationUser: evaluation
  postgresEvaluationPassword: Azerty123_
  postgresEvaluationDb: evaluation

  keycloakAdminUser: admin
  keycloakAdminPassword: Azerty123_
  keycloakAgenticClientSecret: Azerty123_
  keycloakKnowledgeFlowClientSecret: Azerty123_
  keycloakControlPlaneClientSecret: Azerty123_
  keycloakKfEnableManageUsers: "true"
  keycloakForceRelogin: auto

  seaweedfsAdminUser: admin
  seaweedfsAdminPassword: Azerty123_

  clickhouseUser: fred
  clickhousePassword: Azerty123_
  clickhouseDb: fred

  opensearchAdminUser: admin
  opensearchAdminPassword: FredOpensearch123!!

  openfgaApiToken: Azerty123_
  openfgaStoreName: fred
  openfgaSeedIncludeUsernameUsers: "true"

  grafanaAdminUser: admin
  grafanaAdminPassword: Azerty123_

temporal:
  uiPort: 8233

postgres:
  maxConnections: 250

clickhouse:
  enabled: true

# The Fred release lines this instance runs. Each line gets the namespace
# fred-<line>, with its `fred-secrets`, the aliases to the infrastructure, its
# database and its Temporal namespace: what `make k3d-app FRED=<line>` relies on.
# Credentials are local defaults, for this local stack only, as in `auth` above.
#   database      its PostgreSQL database
#   services      short names resolving to the services of the infrastructure
#   sharedSecrets key prefixes of the Foundation Secret its applications read
#   secrets       further keys of its `fred-secrets`
#   namedSecrets  further Secrets in its namespace
lines:
  swift:
    database: fred_swift
    services: [postgres, seaweedfs, opensearch, temporal, keycloak, prometheus, openfga]
    sharedSecrets: [KEYCLOAK_, SEAWEEDFS_, OPENSEARCH_, POSTGRES_FRED_, POSTGRES_EVALUATION_, POSTGRES_TABULAR_DATA_, OPENFGA_]
  weaver:
    database: fred_weaver
    services: [postgres, seaweedfs, opensearch, temporal, keycloak, prometheus]
    sharedSecrets: [KEYCLOAK_, SEAWEEDFS_, OPENSEARCH_]
    secrets:
      POSTGRES_CP_PASSWORD: Azerty123_
      POSTGRES_KF_PASSWORD: Azerty123_
      POSTGRES_RUNTIME_PASSWORD: Azerty123_
      POSTGRES_MONITOR_PASSWORD: Azerty123_
      POSTGRES_MONITOR_DATABASE_URL: postgresql://fred_monitor:Azerty123_@postgres:5432/fred_weaver
    namedSecrets:
      # For the chart's postgresBootstrap hook, which creates the SQL owners.
      postgres-admin:
        password: Azerty123_
      fred-ingestion:
        manager-s3-secret: &s3-manager Azerty123_manager
        processor-s3-secret: &s3-processor Azerty123_processor
        kf-api-s3-secret: &s3-reader Azerty123_reader
        opensearch-password: &opensearch-ingestion FredOpensearch123!!
        kf-api-opensearch-password: &opensearch-kf-api FredOpensearch123!!
        agents-opensearch-password: &opensearch-agents FredOpensearch123!!

# What the applications need on S3, beyond the administrator of `auth`.
s3:
  buckets: [app-content, app-feedback, app-chat-profile, app-content-documents]
  # Their policies are in files/seaweedfs/policies.yaml.
  identities:
    fred-document-manager: {secretKey: *s3-manager, policy: manager}
    fred-document-processor: {secretKey: *s3-processor, policy: kf}
    fred-document-reader: {secretKey: *s3-reader, policy: kf-read}

# What the applications need on OpenSearch, beyond the administrator of `auth`.
opensearch:
  # Global to the instance. Mirrors fred_knowledge.vector.opensearch_vector_store,
  # whose adapter uses an existing pipeline and creates a missing one.
  searchPipeline:
    name: hybrid-search-pipeline
    body:
      description: Post processor for hybrid search
      phase_results_processors:
        - normalization-processor:
            normalization: {technique: min_max}
            combination:
              technique: arithmetic_mean
              parameters: {weights: [0.5, 0.5]}
  # One account, role and mapping per name. The indexes are the ones Weaver's values name.
  identities:
    fred-kf-ingestion:
      password: *opensearch-ingestion
      role:
        cluster_permissions: &search-cluster [cluster_monitor, cluster_composite_ops, "cluster:admin/search/pipeline/get"]
        index_permissions:
          - index_patterns: [document-vectors, weaver-kpi]
            allowed_actions: &index-owner [crud, create_index, manage]
    # One connection serves search and observability; only the latter may write.
    fred-kf-api:
      password: *opensearch-kf-api
      role:
        cluster_permissions: *search-cluster
        index_permissions:
          - index_patterns: [document-vectors]
            # The adapter checks the index and its mapping at startup.
            allowed_actions: [read, "indices:admin/get", "indices:admin/mappings/get", "indices:monitor/settings/get"]
          - index_patterns: &weaver-observability [weaver-app-logs, weaver-kpi]
            allowed_actions: *index-owner
    # The agent runtime only writes its logs and KPI: no corpus, no pipeline.
    fred-agents:
      password: *opensearch-agents
      role:
        cluster_permissions: [cluster_monitor, cluster_composite_ops]
        index_permissions:
          - index_patterns: *weaver-observability
            allowed_actions: *index-owner

prometheus:
  enabled: true
  scrapeInterval: 15s
  evaluationInterval: 15s
  retention: 7d
  # Every pod of the lines' namespaces that declares a container port named
  # `metrics` is scraped (job `apps`), with no target list to keep.
  # SeaweedFS is scraped through its pod annotations (job `fred-stack-pods`).
  seaweedfsMetricsPath: /metrics

grafana:
  enabled: true

# Fluent Bit ships every container's output (this namespace, the lines') and the
# cluster's Kubernetes events (OOMKilled, BackOff, failed probes...) to OpenSearch:
#   k3d-logs-YYYY.MM.DD    one document per log line, with pod, container, app
#   k3d-events-YYYY.MM.DD  one document per event
# Browse them in OpenSearch Dashboards (:5601); query them with
# bin/k3d-observe.
logCollection:
  enabled: true

service:
  type: NodePort
  nodePorts:
    postgres: 30432
    keycloak: 30080
    seaweedfsS3: 30833
    seaweedfsFiler: 30888
    seaweedfsMaster: 30933
    clickhouseHttp: 30823
    clickhouseNative: 30902
    opensearch: 30920
    opensearchDashboards: 30561
    openfgaHttp: 30908
    openfgaGrpc: 30981
    openfgaPlayground: 30000
    temporalFrontend: 30723
    temporalUi: 30233
    prometheus: 30090
    grafana: 30300

persistence:
  postgresSize: 10Gi
  seaweedfsSize: 10Gi
  clickhouseSize: 10Gi
  opensearchSize: 10Gi
  prometheusSize: 8Gi
  grafanaSize: 4Gi

images:
  postgres: pgvector/pgvector:pg17
  postgresClient: mirror.gcr.io/postgres:15.12-alpine3.20
  keycloak: mirror.gcr.io/keycloak/keycloak:26.3.0
  toolbox: nicolaka/netshoot:v0.13
  seaweedfs: chrislusf/seaweedfs:4.29
  clickhouse: clickhouse/clickhouse-server:24.12.5.81-alpine
  alpine: mirror.gcr.io/alpine:3.21.3
  opensearch: mirror.gcr.io/opensearchproject/opensearch:2.19.3
  opensearchDashboards: mirror.gcr.io/opensearchproject/opensearch-dashboards:2.19.3
  openfga: openfga/openfga:v1.11.0
  temporalServer: mirror.gcr.io/temporalio/server:1.28.0
  temporalAdminTools: mirror.gcr.io/temporalio/admin-tools:1.28
  temporalUi: mirror.gcr.io/temporalio/ui:2.38.3
  prometheus: prom/prometheus:v2.54.1
  grafana: grafana/grafana:11.1.4
  fluentBit: fluent/fluent-bit:4.0.3

# For Swift's authorization; Weaver does not use it.
openfga:
  enabled: true
