nameOverride: ""
fullnameOverride: ""

imagePullPolicy: IfNotPresent

# Set to true to also provision the fred_kea database (for kea→swift migration testing)
withKea: false

host:
  fqdn: localhost

auth:
  postgresAdminUser: admin
  postgresAdminPassword: Azerty123_

  postgresKeycloakUser: keycloak_db_user
  postgresKeycloakPassword: Azerty123_
  postgresKeycloakDb: keycloak

  postgresFredUser: fred
  postgresFredPassword: Azerty123_
  postgresFredDb: fred
  postgresFredKeaDb: fred_kea

  postgresTabularUser: tabular
  postgresTabularPassword: Azerty123_
  postgresTabularDb: data

  postgresOpenfgaUser: openfga
  postgresOpenfgaPassword: Azerty123_
  postgresOpenfgaDb: openfga

  postgresTemporalUser: temporal
  postgresTemporalPassword: Azerty123_
  postgresTemporalDb: temporal
  postgresTemporalVisibilityDb: temporal_visibility

  keycloakAdminUser: admin
  keycloakAdminPassword: Azerty123_
  keycloakAgenticClientSecret: Azerty123_
  keycloakKnowledgeFlowClientSecret: Azerty123_
  keycloakControlPlaneClientSecret: Azerty123_
  keycloakKfEnableManageUsers: "true"
  keycloakForceRelogin: auto

  seaweedfsAdminUser: admin
  seaweedfsAdminPassword: Azerty123_

  clickhouseUser: fred
  clickhousePassword: Azerty123_
  clickhouseDb: fred

  opensearchAdminUser: admin
  opensearchAdminPassword: FredOpensearch123!!

  openfgaApiToken: Azerty123_
  openfgaStoreName: fred
  openfgaSeedIncludeUsernameUsers: "true"

  grafanaAdminUser: admin
  grafanaAdminPassword: Azerty123_

temporal:
  uiPort: 8233

clickhouse:
  enabled: true

prometheus:
  enabled: true
  scrapeInterval: 15s
  evaluationInterval: 15s
  retention: 7d
  extraMetricsTargets:
    - enabled: true
      jobName: agentic-backend
      target: agentic-backend-metrics:9000
      metricsPath: /metrics
    - enabled: true
      jobName: knowledge-flow-backend
      target: knowledge-flow-backend-metrics:9111
      metricsPath: /metrics
  seaweedfsMetricsPath: /metrics

grafana:
  enabled: true

service:
  type: NodePort
  nodePorts:
    postgres: 30432
    keycloak: 30080
    seaweedfsS3: 30833
    seaweedfsFiler: 30888
    seaweedfsMaster: 30933
    clickhouseHttp: 30823
    clickhouseNative: 30902
    opensearch: 30920
    opensearchDashboards: 30561
    openfgaHttp: 30908
    openfgaGrpc: 30981
    openfgaPlayground: 30000
    temporalFrontend: 30723
    temporalUi: 30233
    prometheus: 30090
    grafana: 30300

persistence:
  postgresSize: 10Gi
  seaweedfsSize: 10Gi
  clickhouseSize: 10Gi
  opensearchSize: 10Gi
  prometheusSize: 8Gi
  grafanaSize: 4Gi

images:
  postgres: pgvector/pgvector:pg17
  postgresClient: mirror.gcr.io/postgres:15.12-alpine3.20
  keycloak: mirror.gcr.io/keycloak/keycloak:26.3.0
  toolbox: nicolaka/netshoot:v0.13
  seaweedfs: chrislusf/seaweedfs:4.29
  clickhouse: clickhouse/clickhouse-server:24.12.5.81-alpine
  alpine: mirror.gcr.io/alpine:3.21.3
  opensearch: mirror.gcr.io/opensearchproject/opensearch:2.19.3
  opensearchDashboards: mirror.gcr.io/opensearchproject/opensearch-dashboards:2.19.3
  openfga: openfga/openfga:v1.11.0
  temporalServer: mirror.gcr.io/temporalio/server:1.28.0
  temporalAdminTools: mirror.gcr.io/temporalio/admin-tools:1.28
  temporalUi: mirror.gcr.io/temporalio/ui:2.38.3
  prometheus: prom/prometheus:v2.54.1
  grafana: grafana/grafana:11.1.4
