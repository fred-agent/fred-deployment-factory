apiVersion: v1
kind: Service
metadata:
  name: {{ include "fredlab-infra.keycloakName" . }}
  labels:
    {{- include "fredlab-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    {{- if .Values.ingress.backendConfig.enabled }}
    cloud.google.com/backend-config: '{"ports": {"http":"{{ .Values.ingress.backendConfig.name }}"}}'
    {{- end }}
spec:
  type: {{ .Values.keycloak.service.type }}
  ports:
    - name: http
      port: {{ .Values.keycloak.service.port }}
      targetPort: http
  selector:
    {{- include "fredlab-infra.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
