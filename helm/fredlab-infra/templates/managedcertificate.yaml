{{- if .Values.ingress.enabled }}
{{- $certificates := list (dict "name" .Values.ingress.managedCertificateName "domains" (list .Values.ingress.keycloakHost)) -}}
{{- if and .Values.temporal.enabled .Values.temporal.ui.enabled -}}
{{- $certificates = append $certificates (dict "name" .Values.temporal.ui.managedCertificateName "domains" (list .Values.temporal.ui.hostname)) -}}
{{- end -}}
{{- if .Values.fredFrontend.enabled -}}
{{- $certificates = append $certificates (dict "name" .Values.fredFrontend.managedCertificateName "domains" (list .Values.fredFrontend.hostname)) -}}
{{- end -}}
{{- range .Values.ingress.extraManagedCertificates -}}
{{- $certificates = append $certificates . -}}
{{- end }}
{{- range $certificate := $certificates }}
{{- if and $certificate.name $certificate.domains }}
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: {{ $certificate.name | quote }}
  labels:
    {{- include "fredlab-infra.labels" $ | nindent 4 }}
spec:
  domains:
{{- range ($certificate.domains | compact | uniq) }}
    - {{ . | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
