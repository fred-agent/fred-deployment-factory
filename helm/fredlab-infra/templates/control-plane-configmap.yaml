{{- if or .Values.controlPlane.enabled .Values.controlPlane.migration.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fredlab-infra.controlPlaneConfigName" . }}
  labels:
    {{- include "fredlab-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane-backend
data:
  empty.env: ""
  conversation_policy_catalog.yaml: |
    version: v1

    conversation_policies:
      purge:
        default:
          mode: deferred_delete
          retention: PT30S
          cancel_on_rejoin: true

        rules:
          - rule_id: purge.team.swiftpost
            match:
              team_id: swiftpost
              trigger: member_removed
            action:
              retention: PT60S

          - rule_id: purge.team.northbridge
            match:
              team_id: northbridge
              trigger: member_removed
            action:
              retention: PT120S
  configuration.yaml: |
    app:
      name: Control Plane Backend
      base_url: {{ .Values.controlPlane.config.appBaseUrl | quote }}
      address: 0.0.0.0
      port: {{ .Values.controlPlane.containerPort }}
      log_level: {{ .Values.controlPlane.config.logLevel | quote }}
      gcu_version: {{ .Values.controlPlane.config.gcuVersion | quote }}
      default_team_max_resources_storage_size: {{ .Values.controlPlane.config.defaultTeamMaxResourcesStorageSize }}
      personal_max_resources_storage_size: {{ .Values.controlPlane.config.personalMaxResourcesStorageSize }}

    observability:
      kpi:
        log:
          enabled: {{ .Values.controlPlane.config.observability.log.enabled }}
        prometheus:
          enabled: {{ .Values.controlPlane.config.observability.prometheus.enabled }}
          port: {{ .Values.controlPlane.config.observability.prometheus.port }}
          address: {{ .Values.controlPlane.config.observability.prometheus.address | quote }}
        opensearch:
          enabled: false
        process_metrics_interval_sec: {{ .Values.controlPlane.config.observability.processMetricsIntervalSec }}

    scheduler:
      enabled: {{ .Values.controlPlane.config.scheduler.enabled }}
      backend: {{ .Values.controlPlane.config.scheduler.backend | quote }}
      temporal:
        host: {{ .Values.controlPlane.config.temporalAddress | quote }}
        namespace: {{ .Values.controlPlane.config.scheduler.temporalNamespace | quote }}
        task_queue: {{ .Values.controlPlane.config.scheduler.temporalTaskQueue | quote }}
        workflow_id_prefix: {{ .Values.controlPlane.config.scheduler.temporalWorkflowIdPrefix | quote }}
        connect_timeout_seconds: {{ .Values.controlPlane.config.scheduler.temporalConnectTimeoutSeconds }}

    security:
      m2m:
        enabled: {{ .Values.controlPlane.config.security.m2m.enabled }}
        realm_url: {{ .Values.controlPlane.config.keycloakIssuerUrl | quote }}
        client_id: {{ .Values.controlPlane.config.keycloakClientId | quote }}
        secret_env_var: KEYCLOAK_CONTROL_PLANE_CLIENT_SECRET
      user:
        enabled: {{ .Values.controlPlane.config.security.user.enabled }}
        realm_url: {{ .Values.controlPlane.config.keycloakIssuerUrl | quote }}
        client_id: {{ .Values.controlPlane.config.security.user.clientId | quote }}
      authorized_origins:
        {{- range .Values.controlPlane.config.security.authorizedOrigins }}
        - {{ . | quote }}
        {{- end }}
      rebac:
        enabled: {{ .Values.controlPlane.config.security.rebac.enabled }}
        type: openfga
        api_url: {{ .Values.controlPlane.config.openfgaUrl | quote }}
        store_name: {{ .Values.controlPlane.config.openfgaStoreName | quote }}
        token_env_var: OPENFGA_API_TOKEN

    storage:
      postgres:
        host: {{ include "fredlab-infra.postgresName" . | quote }}
        port: {{ .Values.postgresql.service.port }}
        database: {{ .Values.postgresql.fred.database | quote }}
        username: {{ .Values.postgresql.fred.user | quote }}
        pool_pre_ping: true
      content_storage:
        type: local
        root_path: {{ .Values.controlPlane.config.contentStorage.localRootPath | quote }}

    policies:
      purge_catalog_path: ./conversation_policy_catalog.yaml

    platform:
      frontend:
        feature_flags:
          enableK8Features: {{ .Values.controlPlane.config.frontend.featureFlags.enableK8Features }}
          enableElecWarfare: {{ .Values.controlPlane.config.frontend.featureFlags.enableElecWarfare }}
        ui_settings:
          siteDisplayName: {{ .Values.controlPlane.config.frontend.uiSettings.siteDisplayName | quote }}
          agentsNicknameSingular: {{ .Values.controlPlane.config.frontend.uiSettings.agentsNicknameSingular | quote }}
          agentsNicknamePlural: {{ .Values.controlPlane.config.frontend.uiSettings.agentsNicknamePlural | quote }}
      knowledge_flow_base_url: {{ .Values.controlPlane.config.knowledgeFlowBaseUrl | quote }}
      runtime_catalog_sources:
        {{- range .Values.controlPlane.config.runtimeCatalogSources }}
        - runtime_id: {{ .runtimeId | quote }}
          base_url: {{ .baseUrl | quote }}
          enabled: {{ .enabled }}
          ingress_prefix: {{ .ingressPrefix | quote }}
        {{- end }}
{{- end }}
