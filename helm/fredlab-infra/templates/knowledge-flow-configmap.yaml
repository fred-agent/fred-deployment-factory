{{- if .Values.knowledgeFlow.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fredlab-infra.knowledgeFlowConfigName" . }}
  labels:
    {{- include "fredlab-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: knowledge-flow-backend
data:
  empty.env: ""
  configuration.yaml: |
    app:
      name: "Knowledge Flow Backend"
      base_url: {{ .Values.knowledgeFlow.config.appBaseUrl | quote }}
      address: 0.0.0.0
      port: {{ .Values.knowledgeFlow.containerPort }}
      log_level: {{ .Values.knowledgeFlow.config.logLevel | quote }}
      reload: false
      reload_dir: "."

    observability:
      kpi:
        prometheus:
          port: {{ .Values.knowledgeFlow.metricsPort }}

    processing:
      default_profile: fast
      profiles:
        fast:
          use_gpu: false
          generate_summary: false
          input_activity_timeout: 90m
          activity_heartbeat_timeout: 5m
          retry_initial_interval: 5s
          retry_backoff_coefficient: 2.0
          retry_maximum_interval: 20s
          retry_maximum_attempts: 3
          retry_non_retryable_error_types: []
          process_images: false
          text_splitter:
            chunk_size: 1500
            chunk_overlap: 150
            preserve_tables: true
          pdf:
            backend: pypdfium2
            images_scale: 1.0
            generate_picture_images: false
            generate_page_images: false
            generate_table_images: false
            do_table_structure: false
            do_ocr: false
          input_processors:
            - suffix: ".pdf"
              class_path: knowledge_flow_backend.core.processors.input.lightweight_markdown_processor.lite_pdf_to_md_processor.LitePdfMarkdownProcessor
            - suffix: ".docx"
              class_path: knowledge_flow_backend.core.processors.input.docx_markdown_processor.docx_markdown_processor.DocxMarkdownProcessor
            - suffix: ".pptx"
              class_path: knowledge_flow_backend.core.processors.input.pptx_markdown_processor.pptx_markdown_processor.PptxMarkdownProcessor
            - suffix: ".csv"
              class_path: knowledge_flow_backend.core.processors.input.csv_tabular_processor.csv_tabular_processor.CsvTabularProcessor
            - suffix: ".txt"
              class_path: knowledge_flow_backend.core.processors.input.text_markdown_processor.text_markdown_processor.TextMarkdownProcessor
            - suffix: ".md"
              class_path: knowledge_flow_backend.core.processors.input.markdown_markdown_processor.markdown_markdown_processor.MarkdownMarkdownProcessor
            - suffix: ".jsonl"
              class_path: knowledge_flow_backend.core.processors.input.jsonl.jsonl_markdown_processor.JsonlMarkdownProcessor
            - suffix: ".png"
              class_path: knowledge_flow_backend.core.processors.input.image_processor.image_processor.ImageProcessor
            - suffix: ".jpg"
              class_path: knowledge_flow_backend.core.processors.input.image_processor.image_processor.ImageProcessor
            - suffix: ".jpeg"
              class_path: knowledge_flow_backend.core.processors.input.image_processor.image_processor.ImageProcessor
            - suffix: ".gif"
              class_path: knowledge_flow_backend.core.processors.input.image_processor.image_processor.ImageProcessor
            - suffix: ".bmp"
              class_path: knowledge_flow_backend.core.processors.input.image_processor.image_processor.ImageProcessor
            - suffix: ".svg"
              class_path: knowledge_flow_backend.core.processors.input.image_processor.image_processor.ImageProcessor
            - suffix: ".webp"
              class_path: knowledge_flow_backend.core.processors.input.image_processor.image_processor.ImageProcessor
            - suffix: ".ico"
              class_path: knowledge_flow_backend.core.processors.input.image_processor.image_processor.ImageProcessor

    security:
      m2m:
        enabled: true
        client_id: {{ .Values.knowledgeFlow.config.keycloakClientId | quote }}
        realm_url: {{ .Values.knowledgeFlow.config.keycloakIssuerUrl | quote }}
        secret_env_var: KEYCLOAK_KNOWLEDGE_FLOW_CLIENT_SECRET
      user:
        enabled: true
        client_id: {{ .Values.knowledgeFlow.config.userClientId | quote }}
        realm_url: {{ .Values.knowledgeFlow.config.keycloakIssuerUrl | quote }}
      authorized_origins:
        {{- range .Values.knowledgeFlow.config.authorizedOrigins }}
        - {{ . | quote }}
        {{- end }}
      rebac:
        enabled: true
        type: openfga
        api_url: {{ .Values.knowledgeFlow.config.openfgaUrl | quote }}
        store_name: {{ .Values.knowledgeFlow.config.openfgaStoreName | quote }}
        token_env_var: OPENFGA_API_TOKEN

    scheduler:
      enabled: true
      backend: "temporal"
      temporal:
        host: {{ .Values.knowledgeFlow.config.temporalAddress | quote }}
        namespace: {{ .Values.knowledgeFlow.config.temporalNamespace | quote }}
        task_queue: {{ .Values.knowledgeFlow.config.temporalTaskQueue | quote }}
        workflow_id_prefix: "pipeline"
        connect_timeout_seconds: 5
        ingestion_workflow_parallelism: 3
        ingestion_max_concurrent_workflow_tasks: 3
        ingestion_max_concurrent_activities: 3

    content_storage:
      type: gcs
      bucket_name: {{ .Values.knowledgeFlow.config.storage.contentBucketName | quote }}
      project_id: {{ .Values.knowledgeFlow.config.storage.projectId | quote }}

    document_sources:
      fred:
        type: push
        description: "Documents manually uploaded by users"

    chat_model:
      provider: {{ .Values.knowledgeFlow.config.models.chat.provider | quote }}
      name: {{ .Values.knowledgeFlow.config.models.chat.name | quote }}
      settings:
        model_family: {{ .Values.knowledgeFlow.config.models.chat.modelFamily | quote }}
        project: {{ .Values.knowledgeFlow.config.models.project | quote }}
        location: {{ .Values.knowledgeFlow.config.models.location | quote }}
        temperature: 0
        max_retries: 2
        request_timeout: 90
    embedding_model:
      provider: {{ .Values.knowledgeFlow.config.models.embedding.provider | quote }}
      name: {{ .Values.knowledgeFlow.config.models.embedding.name | quote }}
      settings:
        project: {{ .Values.knowledgeFlow.config.models.project | quote }}
        location: {{ .Values.knowledgeFlow.config.models.location | quote }}
        max_retries: 2
    vision_model:
      provider: {{ .Values.knowledgeFlow.config.models.vision.provider | quote }}
      name: {{ .Values.knowledgeFlow.config.models.vision.name | quote }}
      settings:
        project: {{ .Values.knowledgeFlow.config.models.project | quote }}
        location: {{ .Values.knowledgeFlow.config.models.location | quote }}
        temperature: 0
        max_retries: 2
        request_timeout: 90

    crossencoder_model:
      name: cross-encoder/ms-marco-MiniLM-L-12-v2
      settings:
        online: true
        local_path: ~/.cache/huggingface/hub

    storage:
      postgres:
        host: {{ include "fredlab-infra.postgresName" . | quote }}
        port: {{ .Values.postgresql.service.port }}
        database: {{ .Values.postgresql.fred.database | quote }}
        username: {{ .Values.postgresql.fred.user | quote }}
        pool_size: 2
        max_overflow: 0
        pool_timeout: 30
        pool_recycle: 1800
        pool_pre_ping: true
      # In-cluster OpenSearch (security plugin disabled → plain HTTP, no real auth).
      # username/password are sent but ignored by the server; OPENSEARCH_PASSWORD env
      # must still be non-empty because the client config requires it.
      opensearch:
        host: {{ .Values.knowledgeFlow.config.opensearch.host | quote }}
        secure: {{ .Values.knowledgeFlow.config.opensearch.secure }}
        verify_certs: {{ .Values.knowledgeFlow.config.opensearch.verifyCerts }}
        username: {{ .Values.knowledgeFlow.config.opensearch.username | quote }}
      resource_store:
        type: "postgres"
      tag_store:
        type: "postgres"
      metadata_store:
        type: "postgres"
      log_store:
        type: "in_memory"
      tabular_store:
        artifacts_prefix: "tabular/datasets"
        format: "parquet"
        compression: "snappy"
        query:
          engine: "duckdb"
          # GCS on pure Workload Identity does not support presigned URLs, so the
          # tabular SQL preview is unavailable (same as the local backend).
          access_mode: "presigned_url"
          internal_presigned_ttl_seconds: 3600
          default_max_rows: 200
          max_rows: 1000
      vector_store:
        type: opensearch
        index: {{ .Values.knowledgeFlow.config.opensearch.vectorIndex | quote }}
        bulk_size: {{ .Values.knowledgeFlow.config.opensearch.vectorBulkSize }}

    mcp:
      reports_enabled: true
      kpi_enabled: true
      tabular_enabled: true
      statistic_enabled: true
      text_enabled: true
      templates_enabled: true
      resources_enabled: true
      opensearch_ops_enabled: false
      prometheus_ops_enabled: false
      neo4j_enabled: false
      filesystem_enabled: true
      filesystem_read_default_limit: 100
      filesystem_read_max_limit: 500
      filesystem_read_default_max_chars: 20000
      filesystem_read_absolute_max_chars: 50000

    filesystem:
      type: gcs
      bucket_name: {{ .Values.knowledgeFlow.config.storage.filesystemBucketName | quote }}
      prefix: {{ .Values.knowledgeFlow.config.storage.filesystemPrefix | quote }}
      project_id: {{ .Values.knowledgeFlow.config.storage.projectId | quote }}
{{- end }}
