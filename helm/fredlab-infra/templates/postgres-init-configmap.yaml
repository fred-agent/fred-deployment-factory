{{- $keycloakPassword := required "postgresql.keycloak.password is required. Provide it with fredlab-secrets.values.yaml." .Values.postgresql.keycloak.password -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fredlab-infra.postgresName" . }}-init
  labels:
    {{- include "fredlab-infra.labels" . | nindent 4 }}
data:
  001-keycloak.sql: |
    DO $$
    BEGIN
      IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ .Values.postgresql.keycloak.user }}') THEN
        EXECUTE format(
          'CREATE ROLE %I NOSUPERUSER LOGIN PASSWORD %L',
          '{{ .Values.postgresql.keycloak.user }}',
          '{{ $keycloakPassword | replace "'" "''" }}'
        );
      END IF;
    END
    $$;

    SELECT format(
      'CREATE DATABASE %I OWNER %I',
      '{{ .Values.postgresql.keycloak.database }}',
      '{{ .Values.postgresql.keycloak.user }}'
    )
    WHERE NOT EXISTS (
      SELECT FROM pg_database WHERE datname = '{{ .Values.postgresql.keycloak.database }}'
    )\gexec

    REVOKE ALL ON DATABASE "{{ .Values.postgresql.keycloak.database }}" FROM PUBLIC;
    GRANT CONNECT ON DATABASE "{{ .Values.postgresql.keycloak.database }}" TO "{{ .Values.postgresql.keycloak.user }}";
