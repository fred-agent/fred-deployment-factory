{{- if .Values.controlPlane.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fredlab-infra.controlPlaneBackendName" . }}
  labels:
    {{- include "fredlab-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane-backend
spec:
  type: {{ .Values.controlPlane.service.type }}
  ports:
    - name: http
      port: {{ .Values.controlPlane.service.port }}
      targetPort: http
  selector:
    {{- include "fredlab-infra.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fredlab-infra.controlPlaneBackendName" . }}
  labels:
    {{- include "fredlab-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane-backend
spec:
  replicas: {{ .Values.controlPlane.replicaCount }}
  selector:
    matchLabels:
      {{- include "fredlab-infra.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: control-plane-backend
  template:
    metadata:
      labels:
        {{- include "fredlab-infra.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: control-plane-backend
    spec:
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-plane-backend
          image: {{ printf "%s:%s" (required "controlPlane.image.repository is required when controlPlane.enabled=true." .Values.controlPlane.image.repository) (required "controlPlane.image.tag is required when controlPlane.enabled=true." .Values.controlPlane.image.tag) | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: CONFIG_FILE
              value: /etc/fred/control-plane/configuration.yaml
            - name: ENV_FILE
              value: /etc/fred/control-plane/empty.env
            - name: PORT
              value: {{ .Values.controlPlane.containerPort | quote }}
            - name: POSTGRES_HOST
              value: {{ include "fredlab-infra.postgresName" . }}
            - name: POSTGRES_PORT
              value: {{ .Values.postgresql.service.port | quote }}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "fredlab-infra.secretName" . }}
                  key: POSTGRES_FRED_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "fredlab-infra.secretName" . }}
                  key: POSTGRES_FRED_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "fredlab-infra.secretName" . }}
                  key: POSTGRES_FRED_PASSWORD
            - name: FRED_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "fredlab-infra.secretName" . }}
                  key: POSTGRES_FRED_PASSWORD
            - name: DATABASE_URL
              value: "postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@{{ include "fredlab-infra.postgresName" . }}:{{ .Values.postgresql.service.port }}/$(POSTGRES_DB)"
            - name: KEYCLOAK_BASE_URL
              value: {{ .Values.controlPlane.config.keycloakInternalUrl | quote }}
            - name: KEYCLOAK_REALM
              value: {{ .Values.controlPlane.config.keycloakRealm | quote }}
            - name: OIDC_ISSUER_URL
              value: {{ .Values.controlPlane.config.keycloakIssuerUrl | quote }}
            - name: KEYCLOAK_CLIENT_ID
              value: {{ .Values.controlPlane.config.keycloakClientId | quote }}
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "fredlab-infra.secretName" . }}
                  key: KEYCLOAK_CONTROL_PLANE_CLIENT_SECRET
            - name: OPENFGA_API_URL
              value: {{ .Values.controlPlane.config.openfgaUrl | quote }}
            - name: OPENFGA_URL
              value: {{ .Values.controlPlane.config.openfgaUrl | quote }}
            - name: OPENFGA_STORE_NAME
              value: {{ .Values.controlPlane.config.openfgaStoreName | quote }}
            - name: OPENFGA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "fredlab-infra.secretName" . }}
                  key: OPENFGA_API_TOKEN
            - name: TEMPORAL_ADDRESS
              value: {{ .Values.controlPlane.config.temporalAddress | quote }}
            {{- range $name, $value := .Values.controlPlane.extraEnv }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.controlPlane.containerPort }}
          readinessProbe:
            httpGet:
              path: {{ .Values.controlPlane.health.path | quote }}
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: {{ .Values.controlPlane.health.path | quote }}
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: control-plane-config
              mountPath: /etc/fred/control-plane
              readOnly: true
      volumes:
        - name: control-plane-config
          configMap:
            name: {{ include "fredlab-infra.controlPlaneConfigName" . }}
{{- end }}
