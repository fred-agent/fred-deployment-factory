apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fredlab-infra.secretName" . }}
  labels:
    {{- include "fredlab-infra.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_ADMIN_USER: {{ .Values.postgresql.admin.user | quote }}
  POSTGRES_ADMIN_PASSWORD: {{ required "postgresql.admin.password is required. Provide it with fredlab-secrets.values.yaml." .Values.postgresql.admin.password | quote }}
  POSTGRES_KEYCLOAK_DB: {{ .Values.postgresql.keycloak.database | quote }}
  POSTGRES_KEYCLOAK_USER: {{ .Values.postgresql.keycloak.user | quote }}
  POSTGRES_KEYCLOAK_PASSWORD: {{ required "postgresql.keycloak.password is required. Provide it with fredlab-secrets.values.yaml." .Values.postgresql.keycloak.password | quote }}
  POSTGRES_OPENFGA_DB: {{ .Values.postgresql.openfga.database | quote }}
  POSTGRES_OPENFGA_USER: {{ .Values.postgresql.openfga.user | quote }}
  POSTGRES_OPENFGA_PASSWORD: {{ required "postgresql.openfga.password is required. Provide it with fredlab-secrets.values.yaml." .Values.postgresql.openfga.password | quote }}
  POSTGRES_TEMPORAL_DB: {{ .Values.postgresql.temporal.database | quote }}
  POSTGRES_TEMPORAL_VISIBILITY_DB: {{ .Values.postgresql.temporal.visibilityDatabase | quote }}
  POSTGRES_TEMPORAL_USER: {{ .Values.postgresql.temporal.user | quote }}
  POSTGRES_TEMPORAL_PASSWORD: {{ required "postgresql.temporal.password is required. Provide it with fredlab-secrets.values.yaml." .Values.postgresql.temporal.password | quote }}
  POSTGRES_FRED_DB: {{ .Values.postgresql.fred.database | quote }}
  POSTGRES_FRED_USER: {{ .Values.postgresql.fred.user | quote }}
  POSTGRES_FRED_PASSWORD: {{ required "postgresql.fred.password is required. Provide it with fredlab-secrets.values.yaml." .Values.postgresql.fred.password | quote }}
  KC_BOOTSTRAP_ADMIN_USERNAME: {{ .Values.keycloak.admin.user | quote }}
  KC_BOOTSTRAP_ADMIN_PASSWORD: {{ required "keycloak.admin.password is required. Provide it with fredlab-secrets.values.yaml." .Values.keycloak.admin.password | quote }}
  KEYCLOAK_CONTROL_PLANE_CLIENT_SECRET: {{ required "keycloak.clients.controlPlane.secret is required. Provide it with fredlab-secrets.values.yaml." .Values.keycloak.clients.controlPlane.secret | quote }}
  OPENFGA_API_TOKEN: {{ required "openfga.auth.apiToken is required. Provide it with fredlab-secrets.values.yaml." .Values.openfga.auth.apiToken | quote }}
