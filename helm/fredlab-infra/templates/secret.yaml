apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fredlab-infra.secretName" . }}
  labels:
    {{- include "fredlab-infra.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_ADMIN_USER: {{ .Values.postgresql.admin.user | quote }}
  POSTGRES_ADMIN_PASSWORD: {{ required "postgresql.admin.password is required. Provide it with fredlab-secrets.values.yaml." .Values.postgresql.admin.password | quote }}
  POSTGRES_KEYCLOAK_DB: {{ .Values.postgresql.keycloak.database | quote }}
  POSTGRES_KEYCLOAK_USER: {{ .Values.postgresql.keycloak.user | quote }}
  POSTGRES_KEYCLOAK_PASSWORD: {{ required "postgresql.keycloak.password is required. Provide it with fredlab-secrets.values.yaml." .Values.postgresql.keycloak.password | quote }}
  KC_BOOTSTRAP_ADMIN_USERNAME: {{ .Values.keycloak.admin.user | quote }}
  KC_BOOTSTRAP_ADMIN_PASSWORD: {{ required "keycloak.admin.password is required. Provide it with fredlab-secrets.values.yaml." .Values.keycloak.admin.password | quote }}
