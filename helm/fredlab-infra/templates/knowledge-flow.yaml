{{- if .Values.knowledgeFlow.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.knowledgeFlow.serviceAccount.name }}
  labels:
    {{- include "fredlab-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: knowledge-flow-backend
  annotations:
    iam.gke.io/gcp-service-account: {{ required "knowledgeFlow.serviceAccount.gcpServiceAccount is required when knowledgeFlow.enabled=true (Workload Identity)." .Values.knowledgeFlow.serviceAccount.gcpServiceAccount | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fredlab-infra.knowledgeFlowName" . }}
  labels:
    {{- include "fredlab-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: knowledge-flow-backend
spec:
  type: {{ .Values.knowledgeFlow.service.type }}
  ports:
    - name: http
      port: {{ .Values.knowledgeFlow.service.port }}
      targetPort: http
  selector:
    {{- include "fredlab-infra.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: knowledge-flow-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fredlab-infra.knowledgeFlowName" . }}
  labels:
    {{- include "fredlab-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: knowledge-flow-backend
spec:
  replicas: {{ .Values.knowledgeFlow.replicaCount }}
  selector:
    matchLabels:
      {{- include "fredlab-infra.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: knowledge-flow-backend
  template:
    metadata:
      labels:
        {{- include "fredlab-infra.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: knowledge-flow-backend
    spec:
      serviceAccountName: {{ .Values.knowledgeFlow.serviceAccount.name }}
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: knowledge-flow-backend
          image: {{ printf "%s:%s" (required "knowledgeFlow.image.repository is required when knowledgeFlow.enabled=true." .Values.knowledgeFlow.image.repository) (required "knowledgeFlow.image.tag is required when knowledgeFlow.enabled=true." .Values.knowledgeFlow.image.tag) | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: CONFIG_FILE
              value: /etc/fred/knowledge-flow/configuration.yaml
            - name: ENV_FILE
              value: /etc/fred/knowledge-flow/empty.env
            - name: PORT
              value: {{ .Values.knowledgeFlow.containerPort | quote }}
            # Postgres password is read from FRED_POSTGRES_PASSWORD by fred-core's
            # PostgresStoreConfig; host/db/user come from the config file.
            - name: FRED_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "fredlab-infra.secretName" . }}
                  key: POSTGRES_FRED_PASSWORD
            - name: KEYCLOAK_KNOWLEDGE_FLOW_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "fredlab-infra.secretName" . }}
                  key: KEYCLOAK_KNOWLEDGE_FLOW_CLIENT_SECRET
            - name: OPENFGA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "fredlab-infra.secretName" . }}
                  key: OPENFGA_API_TOKEN
            # In-cluster OpenSearch has the security plugin disabled, so this value
            # is sent but ignored by the server. It must be non-empty because the
            # OpenSearch store config requires OPENSEARCH_PASSWORD to be set.
            - name: OPENSEARCH_PASSWORD
              value: {{ .Values.knowledgeFlow.config.opensearch.password | quote }}
            # OpenAI-compatible API key (e.g. Mistral) for openai-provider models.
            # Unused while the model config uses Vertex AI; set when switching to Mistral.
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "fredlab-infra.secretName" . }}
                  key: OPENAI_API_KEY
          ports:
            - name: http
              containerPort: {{ .Values.knowledgeFlow.containerPort }}
            - name: metrics
              containerPort: {{ .Values.knowledgeFlow.metricsPort }}
          startupProbe:
            httpGet:
              path: {{ .Values.knowledgeFlow.health.path | quote }}
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: {{ .Values.knowledgeFlow.health.path | quote }}
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: {{ .Values.knowledgeFlow.health.path | quote }}
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.knowledgeFlow.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: knowledge-flow-config
              mountPath: /etc/fred/knowledge-flow
              readOnly: true
      volumes:
        - name: knowledge-flow-config
          configMap:
            name: {{ include "fredlab-infra.knowledgeFlowConfigName" . }}
{{- end }}
