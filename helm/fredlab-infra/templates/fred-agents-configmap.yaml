{{- if .Values.fredAgents.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fredlab-infra.agentsConfigName" . }}
  labels:
    {{- include "fredlab-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: fred-agents
data:
  empty.env: ""
  configuration.yaml: |
    app:
      name: "Fred default agents"
      base_url: {{ .Values.fredAgents.config.appBaseUrl | quote }}
      host: 0.0.0.0
      port: {{ .Values.fredAgents.containerPort }}
      log_level: {{ .Values.fredAgents.config.logLevel | quote }}
      limit_concurrency: null
      openai_compat: {{ .Values.fredAgents.config.openaiCompat }}

    security:
      m2m:
        enabled: true
        client_id: {{ .Values.fredAgents.config.keycloakClientId | quote }}
        realm_url: {{ .Values.fredAgents.config.keycloakIssuerUrl | quote }}
        secret_env_var: KEYCLOAK_AGENTIC_CLIENT_SECRET
      user:
        enabled: true
        client_id: {{ .Values.fredAgents.config.userClientId | quote }}
        realm_url: {{ .Values.fredAgents.config.keycloakIssuerUrl | quote }}
      authorized_origins:
        {{- range .Values.fredAgents.config.authorizedOrigins }}
        - {{ . | quote }}
        {{- end }}
      rebac:
        enabled: true
        type: openfga
        api_url: {{ .Values.fredAgents.config.openfgaUrl | quote }}
        store_name: {{ .Values.fredAgents.config.openfgaStoreName | quote }}
        token_env_var: OPENFGA_API_TOKEN

    ai:
      knowledge_flow_url: {{ .Values.fredAgents.config.knowledgeFlowUrl | quote }}
      timeout:
        connect: 20
        read: 60

    observability:
      tracer: {{ .Values.fredAgents.config.tracer | quote }}

    storage:
      postgres:
        sqlite_path: {{ .Values.fredAgents.config.sqlitePath | quote }}
      opensearch:
        host: {{ .Values.fredAgents.config.opensearch.host | quote }}
        secure: {{ .Values.fredAgents.config.opensearch.secure }}
        verify_certs: {{ .Values.fredAgents.config.opensearch.verifyCerts }}
        username: {{ .Values.fredAgents.config.opensearch.username | quote }}

    scheduler:
      enabled: false

    platform:
      control_plane_url: {{ .Values.fredAgents.config.controlPlaneUrl | quote }}
{{- end }}
