{{- if .Values.keycloak.provision.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-provision
  labels:
    {{- include "fredlab-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-provision
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "fredlab-infra.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: keycloak-provision
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak-provision
          image: {{ .Values.images.keycloak | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: HOME
              value: /tmp
            - name: KEYCLOAK_SERVER_URL
              value: "http://{{ include "fredlab-infra.keycloakName" . }}:{{ .Values.keycloak.service.port }}"
            - name: KEYCLOAK_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "fredlab-infra.secretName" . }}
                  key: KC_BOOTSTRAP_ADMIN_USERNAME
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "fredlab-infra.secretName" . }}
                  key: KC_BOOTSTRAP_ADMIN_PASSWORD
            - name: KEYCLOAK_CONTROL_PLANE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "fredlab-infra.secretName" . }}
                  key: KEYCLOAK_CONTROL_PLANE_CLIENT_SECRET
            - name: KEYCLOAK_KNOWLEDGE_FLOW_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "fredlab-infra.secretName" . }}
                  key: KEYCLOAK_KNOWLEDGE_FLOW_CLIENT_SECRET
            - name: REALM
              value: {{ .Values.keycloak.provision.realm | quote }}
            - name: APP_CLIENT_ID
              value: {{ .Values.keycloak.provision.clients.app.clientId | quote }}
            - name: APP_REDIRECT_URIS
              value: {{ .Values.keycloak.provision.clients.app.redirectUris | toJson | quote }}
            - name: APP_WEB_ORIGINS
              value: {{ .Values.keycloak.provision.clients.app.webOrigins | toJson | quote }}
            - name: CONTROL_PLANE_CLIENT_ID
              value: {{ .Values.keycloak.provision.clients.controlPlane.clientId | quote }}
            - name: CONTROL_PLANE_APP_ROLES
              value: {{ join " " .Values.keycloak.provision.clients.controlPlane.appRoles | quote }}
            - name: CONTROL_PLANE_REALM_MANAGEMENT_ROLES
              value: {{ join " " .Values.keycloak.provision.clients.controlPlane.realmManagementRoles | quote }}
            - name: CONTROL_PLANE_ACCOUNT_ROLES
              value: {{ join " " .Values.keycloak.provision.clients.controlPlane.accountRoles | quote }}
            - name: KNOWLEDGE_FLOW_CLIENT_ID
              value: {{ .Values.keycloak.provision.clients.knowledgeFlow.clientId | quote }}
            - name: KNOWLEDGE_FLOW_APP_ROLES
              value: {{ join " " .Values.keycloak.provision.clients.knowledgeFlow.appRoles | quote }}
            - name: KNOWLEDGE_FLOW_REALM_MANAGEMENT_ROLES
              value: {{ join " " (.Values.keycloak.provision.clients.knowledgeFlow.realmManagementRoles | default list) | quote }}
            - name: KNOWLEDGE_FLOW_ACCOUNT_ROLES
              value: {{ join " " (.Values.keycloak.provision.clients.knowledgeFlow.accountRoles | default list) | quote }}
            - name: KEYCLOAK_AGENTIC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "fredlab-infra.secretName" . }}
                  key: KEYCLOAK_AGENTIC_CLIENT_SECRET
            - name: AGENTIC_CLIENT_ID
              value: {{ .Values.keycloak.provision.clients.agentic.clientId | quote }}
            - name: AGENTIC_APP_ROLES
              value: {{ join " " .Values.keycloak.provision.clients.agentic.appRoles | quote }}
            - name: AGENTIC_REALM_MANAGEMENT_ROLES
              value: {{ join " " (.Values.keycloak.provision.clients.agentic.realmManagementRoles | default list) | quote }}
            - name: AGENTIC_ACCOUNT_ROLES
              value: {{ join " " (.Values.keycloak.provision.clients.agentic.accountRoles | default list) | quote }}
            {{- if and .Values.temporal.enabled .Values.temporal.ui.enabled .Values.temporal.ui.auth.enabled }}
            - name: KEYCLOAK_TEMPORAL_UI_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "fredlab-infra.secretName" . }}
                  key: KEYCLOAK_TEMPORAL_UI_CLIENT_SECRET
            - name: TEMPORAL_UI_CLIENT_ID
              value: {{ .Values.keycloak.provision.clients.temporalUi.clientId | quote }}
            - name: TEMPORAL_UI_REDIRECT_URIS
              value: {{ .Values.keycloak.provision.clients.temporalUi.redirectUris | toJson | quote }}
            - name: TEMPORAL_UI_WEB_ORIGINS
              value: {{ .Values.keycloak.provision.clients.temporalUi.webOrigins | toJson | quote }}
            - name: TEMPORAL_UI_ALLOWED_APP_ROLE
              value: {{ .Values.temporal.ui.auth.allowedAppRole | quote }}
            {{- end }}
          command:
            - /bin/sh
            - -ec
            - |
              KCADM="/opt/keycloak/bin/kcadm.sh"

              login() {
                i=0
                until "$KCADM" config credentials \
                  --server "$KEYCLOAK_SERVER_URL" \
                  --realm master \
                  --user "$KEYCLOAK_ADMIN_USER" \
                  --password "$KEYCLOAK_ADMIN_PASSWORD"; do
                  i=$((i + 1))
                  if [ "$i" -ge 60 ]; then
                    echo "Timed out waiting for Keycloak admin login."
                    return 1
                  fi
                  sleep 5
                done
              }

              client_id() {
                "$KCADM" get clients -r "$REALM" -q "clientId=$1" --fields id --format csv --noquotes 2>/dev/null \
                  | grep -v '^id$' \
                  | head -n 1 \
                  || true
              }

              ensure_client_role() {
                client="$1"
                role="$2"
                description="$3"
                client_uuid="$(client_id "$client")"
                if [ -z "$client_uuid" ]; then
                  echo "Cannot ensure role '$client/$role': client not found."
                  return 1
                fi
                if "$KCADM" get "clients/$client_uuid/roles/$role" -r "$REALM" >/dev/null 2>&1; then
                  echo "Role '$client/$role' already exists."
                else
                  echo "Creating role '$client/$role'."
                  "$KCADM" create "clients/$client_uuid/roles" -r "$REALM" \
                    -s "name=$role" \
                    -s "description=$description"
                fi
              }

              login

              if "$KCADM" get "realms/$REALM" >/dev/null 2>&1; then
                echo "Realm '$REALM' already exists; updating baseline settings."
                "$KCADM" update "realms/$REALM" \
                  -s enabled=true \
                  -s loginWithEmailAllowed=true \
                  -s resetPasswordAllowed=true
              else
                echo "Creating realm '$REALM'."
                "$KCADM" create realms \
                  -s "realm=$REALM" \
                  -s enabled=true \
                  -s loginWithEmailAllowed=true \
                  -s resetPasswordAllowed=true
              fi

              APP_ID="$(client_id "$APP_CLIENT_ID")"
              if [ -n "$APP_ID" ]; then
                echo "Updating public client '$APP_CLIENT_ID'."
                "$KCADM" update "clients/$APP_ID" -r "$REALM" \
                  -s "clientId=$APP_CLIENT_ID" \
                  -s enabled=true \
                  -s publicClient=true \
                  -s standardFlowEnabled=true \
                  -s implicitFlowEnabled=false \
                  -s directAccessGrantsEnabled=false \
                  -s "redirectUris=$APP_REDIRECT_URIS" \
                  -s "webOrigins=$APP_WEB_ORIGINS"
              else
                echo "Creating public client '$APP_CLIENT_ID'."
                "$KCADM" create clients -r "$REALM" \
                  -s "clientId=$APP_CLIENT_ID" \
                  -s enabled=true \
                  -s publicClient=true \
                  -s standardFlowEnabled=true \
                  -s implicitFlowEnabled=false \
                  -s directAccessGrantsEnabled=false \
                  -s "redirectUris=$APP_REDIRECT_URIS" \
                  -s "webOrigins=$APP_WEB_ORIGINS"
              fi

              CP_ID="$(client_id "$CONTROL_PLANE_CLIENT_ID")"
              if [ -n "$CP_ID" ]; then
                echo "Updating confidential client '$CONTROL_PLANE_CLIENT_ID'."
                "$KCADM" update "clients/$CP_ID" -r "$REALM" \
                  -s "clientId=$CONTROL_PLANE_CLIENT_ID" \
                  -s enabled=true \
                  -s publicClient=false \
                  -s serviceAccountsEnabled=true \
                  -s standardFlowEnabled=false \
                  -s directAccessGrantsEnabled=false \
                  -s "secret=$KEYCLOAK_CONTROL_PLANE_CLIENT_SECRET"
              else
                echo "Creating confidential client '$CONTROL_PLANE_CLIENT_ID'."
                "$KCADM" create clients -r "$REALM" \
                  -s "clientId=$CONTROL_PLANE_CLIENT_ID" \
                  -s enabled=true \
                  -s publicClient=false \
                  -s serviceAccountsEnabled=true \
                  -s standardFlowEnabled=false \
                  -s directAccessGrantsEnabled=false \
                  -s "secret=$KEYCLOAK_CONTROL_PLANE_CLIENT_SECRET"
              fi

              for role in $CONTROL_PLANE_REALM_MANAGEMENT_ROLES; do
                echo "Granting realm-management/$role to service-account-$CONTROL_PLANE_CLIENT_ID."
                "$KCADM" add-roles -r "$REALM" \
                  --uusername "service-account-$CONTROL_PLANE_CLIENT_ID" \
                  --cclientid realm-management \
                  --rolename "$role" || true
              done

              for role in $CONTROL_PLANE_ACCOUNT_ROLES; do
                echo "Granting account/$role to service-account-$CONTROL_PLANE_CLIENT_ID."
                "$KCADM" add-roles -r "$REALM" \
                  --uusername "service-account-$CONTROL_PLANE_CLIENT_ID" \
                  --cclientid account \
                  --rolename "$role" || true
              done

              for role in $CONTROL_PLANE_APP_ROLES; do
                ensure_client_role "$APP_CLIENT_ID" "$role" "Fred service account role"
                echo "Granting $APP_CLIENT_ID/$role to service-account-$CONTROL_PLANE_CLIENT_ID."
                "$KCADM" add-roles -r "$REALM" \
                  --uusername "service-account-$CONTROL_PLANE_CLIENT_ID" \
                  --cclientid "$APP_CLIENT_ID" \
                  --rolename "$role" || true
              done

              KF_ID="$(client_id "$KNOWLEDGE_FLOW_CLIENT_ID")"
              if [ -n "$KF_ID" ]; then
                echo "Updating confidential client '$KNOWLEDGE_FLOW_CLIENT_ID'."
                "$KCADM" update "clients/$KF_ID" -r "$REALM" \
                  -s "clientId=$KNOWLEDGE_FLOW_CLIENT_ID" \
                  -s enabled=true \
                  -s publicClient=false \
                  -s serviceAccountsEnabled=true \
                  -s standardFlowEnabled=false \
                  -s directAccessGrantsEnabled=false \
                  -s "secret=$KEYCLOAK_KNOWLEDGE_FLOW_CLIENT_SECRET"
              else
                echo "Creating confidential client '$KNOWLEDGE_FLOW_CLIENT_ID'."
                "$KCADM" create clients -r "$REALM" \
                  -s "clientId=$KNOWLEDGE_FLOW_CLIENT_ID" \
                  -s enabled=true \
                  -s publicClient=false \
                  -s serviceAccountsEnabled=true \
                  -s standardFlowEnabled=false \
                  -s directAccessGrantsEnabled=false \
                  -s "secret=$KEYCLOAK_KNOWLEDGE_FLOW_CLIENT_SECRET"
              fi

              for role in $KNOWLEDGE_FLOW_REALM_MANAGEMENT_ROLES; do
                echo "Granting realm-management/$role to service-account-$KNOWLEDGE_FLOW_CLIENT_ID."
                "$KCADM" add-roles -r "$REALM" \
                  --uusername "service-account-$KNOWLEDGE_FLOW_CLIENT_ID" \
                  --cclientid realm-management \
                  --rolename "$role" || true
              done

              for role in $KNOWLEDGE_FLOW_ACCOUNT_ROLES; do
                echo "Granting account/$role to service-account-$KNOWLEDGE_FLOW_CLIENT_ID."
                "$KCADM" add-roles -r "$REALM" \
                  --uusername "service-account-$KNOWLEDGE_FLOW_CLIENT_ID" \
                  --cclientid account \
                  --rolename "$role" || true
              done

              for role in $KNOWLEDGE_FLOW_APP_ROLES; do
                ensure_client_role "$APP_CLIENT_ID" "$role" "Fred service account role"
                echo "Granting $APP_CLIENT_ID/$role to service-account-$KNOWLEDGE_FLOW_CLIENT_ID."
                "$KCADM" add-roles -r "$REALM" \
                  --uusername "service-account-$KNOWLEDGE_FLOW_CLIENT_ID" \
                  --cclientid "$APP_CLIENT_ID" \
                  --rolename "$role" || true
              done

              AGENTIC_ID="$(client_id "$AGENTIC_CLIENT_ID")"
              if [ -n "$AGENTIC_ID" ]; then
                echo "Updating confidential client '$AGENTIC_CLIENT_ID'."
                "$KCADM" update "clients/$AGENTIC_ID" -r "$REALM" \
                  -s "clientId=$AGENTIC_CLIENT_ID" \
                  -s enabled=true \
                  -s publicClient=false \
                  -s serviceAccountsEnabled=true \
                  -s standardFlowEnabled=false \
                  -s directAccessGrantsEnabled=false \
                  -s "secret=$KEYCLOAK_AGENTIC_CLIENT_SECRET"
              else
                echo "Creating confidential client '$AGENTIC_CLIENT_ID'."
                "$KCADM" create clients -r "$REALM" \
                  -s "clientId=$AGENTIC_CLIENT_ID" \
                  -s enabled=true \
                  -s publicClient=false \
                  -s serviceAccountsEnabled=true \
                  -s standardFlowEnabled=false \
                  -s directAccessGrantsEnabled=false \
                  -s "secret=$KEYCLOAK_AGENTIC_CLIENT_SECRET"
              fi

              for role in $AGENTIC_REALM_MANAGEMENT_ROLES; do
                echo "Granting realm-management/$role to service-account-$AGENTIC_CLIENT_ID."
                "$KCADM" add-roles -r "$REALM" \
                  --uusername "service-account-$AGENTIC_CLIENT_ID" \
                  --cclientid realm-management \
                  --rolename "$role" || true
              done

              for role in $AGENTIC_ACCOUNT_ROLES; do
                echo "Granting account/$role to service-account-$AGENTIC_CLIENT_ID."
                "$KCADM" add-roles -r "$REALM" \
                  --uusername "service-account-$AGENTIC_CLIENT_ID" \
                  --cclientid account \
                  --rolename "$role" || true
              done

              for role in $AGENTIC_APP_ROLES; do
                ensure_client_role "$APP_CLIENT_ID" "$role" "Fred service account role"
                echo "Granting $APP_CLIENT_ID/$role to service-account-$AGENTIC_CLIENT_ID."
                "$KCADM" add-roles -r "$REALM" \
                  --uusername "service-account-$AGENTIC_CLIENT_ID" \
                  --cclientid "$APP_CLIENT_ID" \
                  --rolename "$role" || true
              done

              {{- if and .Values.temporal.enabled .Values.temporal.ui.enabled .Values.temporal.ui.auth.enabled }}
              TEMPORAL_UI_ID="$(client_id "$TEMPORAL_UI_CLIENT_ID")"
              if [ -n "$TEMPORAL_UI_ID" ]; then
                echo "Updating confidential client '$TEMPORAL_UI_CLIENT_ID'."
                "$KCADM" update "clients/$TEMPORAL_UI_ID" -r "$REALM" \
                  -s "clientId=$TEMPORAL_UI_CLIENT_ID" \
                  -s enabled=true \
                  -s publicClient=false \
                  -s standardFlowEnabled=true \
                  -s serviceAccountsEnabled=false \
                  -s implicitFlowEnabled=false \
                  -s directAccessGrantsEnabled=false \
                  -s "redirectUris=$TEMPORAL_UI_REDIRECT_URIS" \
                  -s "webOrigins=$TEMPORAL_UI_WEB_ORIGINS" \
                  -s "secret=$KEYCLOAK_TEMPORAL_UI_CLIENT_SECRET"
              else
                echo "Creating confidential client '$TEMPORAL_UI_CLIENT_ID'."
                "$KCADM" create clients -r "$REALM" \
                  -s "clientId=$TEMPORAL_UI_CLIENT_ID" \
                  -s enabled=true \
                  -s publicClient=false \
                  -s standardFlowEnabled=true \
                  -s serviceAccountsEnabled=false \
                  -s implicitFlowEnabled=false \
                  -s directAccessGrantsEnabled=false \
                  -s "redirectUris=$TEMPORAL_UI_REDIRECT_URIS" \
                  -s "webOrigins=$TEMPORAL_UI_WEB_ORIGINS" \
                  -s "secret=$KEYCLOAK_TEMPORAL_UI_CLIENT_SECRET"
              fi

              {{- if .Values.temporal.ui.auth.allowedAppRole }}
              # Authorization gate: only holders of the app/<role> client role may log in
              # to the Temporal UI. The UI cannot filter by role itself, so non-admins are
              # denied AT THE KEYCLOAK LOGIN via a custom browser flow bound ONLY to the
              # temporal-ui client (Studio and the gRPC services are untouched).
              #
              # Structure (this exact shape matters — Keycloak forbids mixing
              # REQUIRED/CONDITIONAL with ALTERNATIVE at the same level; doing so makes it
              # ignore the password form and lock everyone out):
              #   temporal-ui-gate
              #     temporal-ui-gate-auth    (REQUIRED)     wraps the auth alternatives
              #       Cookie                 (ALTERNATIVE)
              #       temporal-ui-gate-forms (ALTERNATIVE)
              #         Username Password Form (REQUIRED)
              #     temporal-ui-gate-admin   (CONDITIONAL)  runs AFTER auth (identity known)
              #       Condition - user role  (REQUIRED, app/<role>, negate)
              #       Deny access            (REQUIRED)
              # Re-fetch the UUID since the client may have just been created.
              TEMPORAL_UI_ID="$(client_id "$TEMPORAL_UI_CLIENT_ID")"
              TEMPORAL_UI_FLOW="temporal-ui-gate"

              # The condition references app/<role>; ensure that role exists first,
              # otherwise "user lacks the role" is true for everyone and locks all out.
              ensure_client_role "$APP_CLIENT_ID" "$TEMPORAL_UI_ALLOWED_APP_ROLE" \
                "Role required to access the Temporal admin UI"

              # NOTE: the Keycloak image ships no `awk`, so all CSV parsing below uses
              # only grep/head/cut/tr (tr strips any trailing CR from kcadm output).
              flow_exists() {
                "$KCADM" get authentication/flows -r "$REALM" \
                  --fields alias --format csv --noquotes 2>/dev/null \
                  | tr -d '\r' | grep -qx "$TEMPORAL_UI_FLOW"
              }

              # id of the flow itself (for the client binding).
              flow_id() {
                "$KCADM" get authentication/flows -r "$REALM" \
                  --fields id,alias --format csv --noquotes 2>/dev/null \
                  | tr -d '\r' | grep -E ",$TEMPORAL_UI_FLOW\$" | head -n 1 | cut -d, -f1
              }

              # id of an execution within the flow, matched on a given column value.
              exec_id() {
                "$KCADM" get "authentication/flows/$TEMPORAL_UI_FLOW/executions" -r "$REALM" \
                  --fields "id,$1" --format csv --noquotes 2>/dev/null \
                  | tr -d '\r' | grep -E ",$2\$" | head -n 1 | cut -d, -f1
              }

              # Set an execution's requirement. The executions endpoint returns a JSON
              # ARRAY, so a `-s` merge fails ("ObjectNode from Array"); send a raw body.
              set_requirement() {
                "$KCADM" update "authentication/flows/$TEMPORAL_UI_FLOW/executions" -r "$REALM" \
                  -b "{\"id\":\"$1\",\"requirement\":\"$2\"}"
              }

              if flow_exists; then
                # Created on a previous run. If a run ever fails half-way, delete the
                # flow in Keycloak and re-deploy to rebuild it cleanly.
                echo "Auth flow '$TEMPORAL_UI_FLOW' already exists; leaving as-is."
              else
                echo "Creating restricted login flow '$TEMPORAL_UI_FLOW'."
                "$KCADM" create authentication/flows -r "$REALM" \
                  -s "alias=$TEMPORAL_UI_FLOW" -s providerId=basic-flow \
                  -s topLevel=true -s builtIn=false

                # Auth wrapper (REQUIRED): cookie SSO or the username/password form. Keeping
                # these alternatives inside their own REQUIRED subflow is what lets the role
                # gate sit beside them without Keycloak ignoring the password form.
                "$KCADM" create "authentication/flows/$TEMPORAL_UI_FLOW/executions/flow" -r "$REALM" \
                  -s alias=temporal-ui-gate-auth -s type=basic-flow
                "$KCADM" create "authentication/flows/temporal-ui-gate-auth/executions/execution" -r "$REALM" \
                  -s provider=auth-cookie
                "$KCADM" create "authentication/flows/temporal-ui-gate-auth/executions/flow" -r "$REALM" \
                  -s alias=temporal-ui-gate-forms -s type=basic-flow
                "$KCADM" create "authentication/flows/temporal-ui-gate-forms/executions/execution" -r "$REALM" \
                  -s provider=auth-username-password-form

                # Role gate (CONDITIONAL): deny when the user lacks app/<role>.
                "$KCADM" create "authentication/flows/$TEMPORAL_UI_FLOW/executions/flow" -r "$REALM" \
                  -s alias=temporal-ui-gate-admin -s type=basic-flow
                "$KCADM" create "authentication/flows/temporal-ui-gate-admin/executions/execution" -r "$REALM" \
                  -s provider=conditional-user-role
                "$KCADM" create "authentication/flows/temporal-ui-gate-admin/executions/execution" -r "$REALM" \
                  -s provider=deny-access-authenticator

                # Requirements (executions endpoint needs a raw body, see set_requirement).
                set_requirement "$(exec_id displayName temporal-ui-gate-auth)"      REQUIRED
                set_requirement "$(exec_id providerId auth-cookie)"                 ALTERNATIVE
                set_requirement "$(exec_id displayName temporal-ui-gate-forms)"     ALTERNATIVE
                set_requirement "$(exec_id providerId auth-username-password-form)" REQUIRED
                ADMIN_SUBFLOW_ID="$(exec_id displayName temporal-ui-gate-admin)"
                set_requirement "$ADMIN_SUBFLOW_ID" CONDITIONAL
                COND_ID="$(exec_id providerId conditional-user-role)"
                DENY_ID="$(exec_id providerId deny-access-authenticator)"
                set_requirement "$COND_ID" REQUIRED
                set_requirement "$DENY_ID" REQUIRED

                # Deny when the user is NOT app/<role>. condUserRole uses a dot to
                # separate the client id from the role name. (Condition order within the
                # subflow does not matter: Keycloak evaluates it as a guard for the subflow.)
                "$KCADM" create "authentication/executions/$COND_ID/config" -r "$REALM" \
                  -s alias=temporal-ui-gate-condition \
                  -s "config.\"condUserRole\"=$APP_CLIENT_ID.$TEMPORAL_UI_ALLOWED_APP_ROLE" \
                  -s 'config."negate"=true'

                # CRITICAL: a freshly created subflow lands FIRST in the flow. The role gate
                # MUST run LAST, after authentication — otherwise the condition evaluates with
                # no authenticated user (everyone "lacks" the role) and Deny Access blocks ALL
                # logins. Lower its priority once per top-level execution to push it to the
                # bottom (extra calls once it is last are harmless no-ops).
                TOP_LEVEL_COUNT="$("$KCADM" get "authentication/flows/$TEMPORAL_UI_FLOW/executions" -r "$REALM" \
                  --fields level --format csv --noquotes 2>/dev/null | tr -d '\r' | grep -c '^0$')"
                i=0
                while [ "$i" -lt "$TOP_LEVEL_COUNT" ]; do
                  "$KCADM" create "authentication/executions/$ADMIN_SUBFLOW_ID/lower-priority" -r "$REALM" >/dev/null 2>&1 || true
                  i=$((i + 1))
                done
              fi

              # Bind the flow as this client's browser override (idempotent). The dotted
              # key sets the nested map entry without disturbing other client fields.
              echo "Binding '$TEMPORAL_UI_FLOW' as browser override on '$TEMPORAL_UI_CLIENT_ID'."
              "$KCADM" update "clients/$TEMPORAL_UI_ID" -r "$REALM" \
                -s "authenticationFlowBindingOverrides.browser=$(flow_id)"
              {{- end }}
              {{- end }}

              echo "Keycloak provisioning complete."
          resources:
            {{- toYaml .Values.keycloak.provision.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
{{- end }}
