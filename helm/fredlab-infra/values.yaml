# Fredlab playground target.
cluster:
  name: fredlab-playground-gke
  namespace: default

nameOverride: ""
fullnameOverride: ""
imagePullPolicy: IfNotPresent

images:
  # pgvector is kept because Fred commonly expects PostgreSQL with vector support.
  postgres: pgvector/pgvector:pg17
  postgresClient: mirror.gcr.io/postgres:15.12-alpine3.20
  keycloak: quay.io/keycloak/keycloak:26.3.0
  openfga: openfga/openfga:v1.11.0
  opensearch: mirror.gcr.io/opensearchproject/opensearch:2.19.3
  temporalServer: mirror.gcr.io/temporalio/server:1.28.0
  temporalAdminTools: mirror.gcr.io/temporalio/admin-tools:1.28
  temporalUi: mirror.gcr.io/temporalio/ui:2.38.3

secret:
  fullnameOverride: fredlab-infra-secrets

postgresql:
  fullnameOverride: postgres
  service:
    type: ClusterIP
    port: 5432
  persistence:
    storageClassName: standard-rwo
    size: 10Gi
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi
  admin:
    user: admin
    password: ""
  keycloak:
    database: keycloak
    user: keycloak_db_user
    password: ""
  openfga:
    database: openfga
    user: openfga
    password: ""
  temporal:
    database: temporal
    visibilityDatabase: temporal_visibility
    user: temporal
    password: ""
  fred:
    database: fred
    user: fred
    password: ""

keycloak:
  fullnameOverride: keycloak
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8080
  hostname: keycloak.playground.fredlab.dev
  admin:
    user: admin
    password: ""
  clients:
    controlPlane:
      secret: ""
    knowledgeFlow:
      secret: ""
  provision:
    enabled: true
    realm: app
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    clients:
      app:
        clientId: app
        redirectUris:
          - https://studio.playground.fredlab.dev/*
        webOrigins:
          - https://studio.playground.fredlab.dev
      controlPlane:
        clientId: control-plane
        appRoles:
          - service_agent
        realmManagementRoles:
          - manage-users
          - view-users
          - query-users
          - query-groups
        accountRoles:
          - view-groups
      knowledgeFlow:
        # Confidential M2M client for knowledge-flow-backend. Needs the service_agent
        # app role so its M2M token is accepted by other Fred resource servers. It
        # does not manage users, so no realm-management/account roles.
        clientId: knowledge-flow
        appRoles:
          - service_agent
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi
  # KC_PROXY=edge is included for compatibility with the requested generated prompt.
  # KC_PROXY_HEADERS=xforwarded is the effective modern Keycloak setting for GCE HTTPS termination.
  proxy: edge
  proxyHeaders: xforwarded
  health:
    enabled: true
    managementPort: 9000

openfga:
  enabled: true
  fullnameOverride: openfga
  replicaCount: 1
  service:
    type: ClusterIP
    httpPort: 8080
    grpcPort: 8081
    metricsPort: 2112
  auth:
    method: preshared
    apiToken: ""
  playground:
    enabled: false
    port: 3000
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 512Mi

opensearch:
  enabled: true
  fullnameOverride: opensearch
  clusterName: fredlab-opensearch
  replicaCount: 1
  service:
    type: ClusterIP
    httpPort: 9200
    transportPort: 9300
    metricsPort: 9600
  persistence:
    storageClassName: standard-rwo
    size: 20Gi
    accessModes:
      - ReadWriteOnce
  config:
    # Single-node playground mode avoids cluster bootstrap complexity.
    discoveryType: single-node
    # Required on GKE Autopilot because node-level vm.max_map_count sysctl is not allowed.
    allowMmap: false
    # Internal-only playground service. Do not expose this service through Ingress.
    disableSecurityPlugin: true
    disableInstallDemoConfig: true
    javaOpts: -Xms1g -Xmx1g
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      memory: 3Gi

temporal:
  enabled: true
  fullnameOverride: temporal
  service:
    type: ClusterIP
    grpcPort: 7233
    metricsPort: 9090
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi
  schema:
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        memory: 512Mi
  ui:
    enabled: true
    fullnameOverride: temporal-ui
    hostname: temporal.playground.fredlab.dev
    managedCertificateName: fredlab-temporal-cert
    service:
      type: ClusterIP
      port: 8080
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        memory: 512Mi
    backendConfig:
      name: fredlab-temporal-ui-backendconfig
      healthCheck:
        requestPath: /
        port: 8080
        type: HTTP
        checkIntervalSec: 15
        timeoutSec: 5
        healthyThreshold: 1
        unhealthyThreshold: 3

adminAccess:
  # Cloud Armor policy created outside this chart and attached through BackendConfig.
  securityPolicyName: fredlab-admin-ui-allowlist
  allowedOperatorCidrs:
    dimitri: ""
    sebastien: ""
    simon: ""

controlPlane:
  enabled: false
  fullnameOverride: control-plane-backend
  configMapName: control-plane-config
  replicaCount: 1
  image:
    # Example Artifact Registry image:
    # europe-west1-docker.pkg.dev/<project-id>/fredlab-repo/control-plane-backend
    repository: ""
    tag: ""
  service:
    type: ClusterIP
    port: 8080
  containerPort: 8222
  health:
    path: /control-plane/v1/healthz
  migration:
    enabled: false
    backoffLimit: 3
    command:
      - alembic
    args:
      - upgrade
      - head
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        memory: 512Mi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
  config:
    appBaseUrl: /control-plane/v1
    logLevel: info
    gcuVersion: v1
    defaultTeamMaxResourcesStorageSize: 5368709120
    personalMaxResourcesStorageSize: 5368709120
    keycloakRealm: app
    keycloakInternalUrl: http://keycloak:8080
    keycloakIssuerUrl: https://keycloak.playground.fredlab.dev/realms/app
    keycloakClientId: control-plane
    openfgaUrl: http://openfga:8080
    openfgaStoreName: fred
    temporalAddress: temporal:7233
    scheduler:
      enabled: true
      backend: temporal
      temporalNamespace: default
      temporalTaskQueue: control-plane-lifecycle
      temporalWorkflowIdPrefix: control-plane
      temporalConnectTimeoutSeconds: 5
    security:
      m2m:
        enabled: true
      user:
        enabled: true
        clientId: app
      authorizedOrigins:
        - https://keycloak.playground.fredlab.dev
        - https://studio.playground.fredlab.dev
        - https://control-plane.playground.fredlab.dev
      rebac:
        enabled: true
    observability:
      log:
        enabled: true
      prometheus:
        enabled: false
        address: 0.0.0.0
        port: 9222
      processMetricsIntervalSec: 0
    contentStorage:
      localRootPath: /tmp/control-plane-content
    frontend:
      featureFlags:
        enableK8Features: false
        enableElecWarfare: false
      uiSettings:
        siteDisplayName: Fredlab
        agentsNicknameSingular: agent
        agentsNicknamePlural: agents
    knowledgeFlowBaseUrl: http://knowledge-flow-backend:8080/knowledge-flow/v1
    runtimeCatalogSources:
      - runtimeId: fred-agents
        baseUrl: http://fred-agents:8080/fred/agents/v2
        enabled: true
        ingressPrefix: /fred/agents/v2
      - runtimeId: rags-agents
        baseUrl: http://rags-agents:8080/rags/agents/v2
        enabled: true
        ingressPrefix: /rags/agents/v2
      - runtimeId: dt-agents
        baseUrl: http://dt-agents:8080/dt/agents/v2
        enabled: true
        ingressPrefix: /dt/agents/v2
  extraEnv: {}

knowledgeFlow:
  enabled: false
  fullnameOverride: knowledge-flow-backend
  configMapName: knowledge-flow-config
  replicaCount: 1
  # Kubernetes service account annotated for Workload Identity. The GSA must hold
  # roles/storage.objectAdmin on the GCS buckets (see bin/fredlab-gcp-gcs-prereqs.sh).
  serviceAccount:
    name: knowledge-flow-backend
    # fredlab-knowledge-flow-gcs@<project-id>.iam.gserviceaccount.com
    gcpServiceAccount: ""
  image:
    # Example Artifact Registry image:
    # europe-west1-docker.pkg.dev/<project-id>/fredlab-repo/knowledge-flow-backend
    repository: ""
    tag: ""
  service:
    type: ClusterIP
    port: 8080
  containerPort: 8111
  metricsPort: 9111
  health:
    path: /knowledge-flow/v1/healthz
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi
  config:
    appBaseUrl: /knowledge-flow/v1
    logLevel: info
    keycloakInternalUrl: http://keycloak:8080
    keycloakIssuerUrl: https://keycloak.playground.fredlab.dev/realms/app
    keycloakClientId: knowledge-flow
    userClientId: app
    authorizedOrigins:
      - https://studio.playground.fredlab.dev
    openfgaUrl: http://openfga:8080
    openfgaStoreName: fred
    temporalAddress: temporal:7233
    temporalNamespace: default
    temporalTaskQueue: ingestion
    storage:
      # Content store: bucket_name is suffixed at runtime with -documents/-objects/-files.
      contentBucketName: fredlab-playground-content
      # Virtual filesystem bucket.
      filesystemBucketName: fredlab-playground-knowledge-flow
      filesystemPrefix: ""
      # Empty → inferred from ADC / Workload Identity.
      projectId: ""
    # Vertex AI models (authenticate via ADC). Needs roles/aiplatform.user on the GSA.
    models:
      # Empty project → resolved from ADC. Location must be a Vertex AI region.
      project: ""
      location: europe-west4
      chat:
        provider: vertex-ai-model-garden
        name: mistral-small-2503
        modelFamily: mistral
      embedding:
        provider: vertex-ai
        name: text-embedding-005
      vision:
        provider: vertex-ai
        name: gemini-2.5-flash

fredFrontend:
  enabled: false
  fullnameOverride: fred-frontend
  replicaCount: 1
  hostname: studio.playground.fredlab.dev
  managedCertificateName: fredlab-studio-cert
  image:
    # Example Artifact Registry image:
    # europe-west1-docker.pkg.dev/<project-id>/fredlab-repo/fred-frontend
    repository: ""
    tag: ""
  service:
    type: ClusterIP
    port: 8080
  containerPort: 8080
  upstreams:
    controlPlane: http://control-plane-backend:8080
    # nginx resolves upstream DNS names at startup, so each target must be a
    # service that already exists. knowledge-flow-backend is now deployed by this
    # chart (knowledgeFlow.enabled), so the frontend points at it directly.
    # fred-agents is still a bootstrap placeholder until that component is added.
    fredAgents: http://control-plane-backend:8080
    knowledgeFlow: http://knowledge-flow-backend:8080
  clientMaxBodySize: 150m
  config:
    # Static pre-auth frontend configuration. It is served as /config.json
    # before the user has accepted CGU, so values needed by guards must live
    # here and not only in the authenticated control-plane bootstrap.
    configMapName: fred-frontend-config
    frontendBasename: /
    releaseBrand: fredlab
    featureFlags: {}
    properties: {}
  legal:
    # Public Markdown content served by nginx instead of the generic files
    # bundled in the frontend image. These files are not secrets and should be
    # reviewed/versioned with the deployment repository.
    enabled: true
    configMapName: fred-frontend-legal
    files:
      gcuFr: legal/gcu.fr.md
      gcuEn: legal/gcu.md
      gdprFr: legal/gdpr.fr.md
      gdprEn: legal/gdpr.md
  health:
    path: /config.json
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
  backendConfig:
    name: fredlab-frontend-backendconfig
    healthCheck:
      requestPath: /config.json
      port: 8080
      type: HTTP
      checkIntervalSec: 15
      timeoutSec: 5
      healthyThreshold: 1
      unhealthyThreshold: 3

ingress:
  enabled: true
  name: fredlab-infra-ingress
  className: gce
  # Historical single-domain value kept for compatibility.
  domain: keycloak.playground.fredlab.dev
  keycloakHost: keycloak.playground.fredlab.dev
  extraManagedCertificates: []
  # The reserved public IP address is documented here for operators.
  # GKE Ingress requires the GCP address resource name in the annotation below, not the literal IP.
  staticIpAddress: 8.233.26.38
  staticIpName: fredlab-playground-ip
  managedCertificateName: fredlab-infra-cert
  allowHttp: false
  path: /*
  backendConfig:
    enabled: true
    name: fredlab-keycloak-backendconfig
    healthCheck:
      requestPath: /realms/master
      port: 8080
      type: HTTP
      checkIntervalSec: 15
      timeoutSec: 5
      healthyThreshold: 1
      unhealthyThreshold: 3
