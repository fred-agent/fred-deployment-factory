# Fredlab playground target.
cluster:
  name: fredlab-playground-gke
  namespace: default

nameOverride: ""
fullnameOverride: ""
imagePullPolicy: IfNotPresent

images:
  # pgvector is kept because Fred commonly expects PostgreSQL with vector support.
  postgres: pgvector/pgvector:pg17
  postgresClient: mirror.gcr.io/postgres:15.12-alpine3.20
  keycloak: quay.io/keycloak/keycloak:26.3.0
  openfga: openfga/openfga:v1.11.0
  temporalServer: mirror.gcr.io/temporalio/server:1.28.0
  temporalAdminTools: mirror.gcr.io/temporalio/admin-tools:1.28
  temporalUi: mirror.gcr.io/temporalio/ui:2.38.3

secret:
  fullnameOverride: fredlab-infra-secrets

postgresql:
  fullnameOverride: postgres
  service:
    type: ClusterIP
    port: 5432
  persistence:
    storageClassName: standard-rwo
    size: 10Gi
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi
  admin:
    user: admin
    password: ""
  keycloak:
    database: keycloak
    user: keycloak_db_user
    password: ""
  openfga:
    database: openfga
    user: openfga
    password: ""
  temporal:
    database: temporal
    visibilityDatabase: temporal_visibility
    user: temporal
    password: ""
  fred:
    database: fred
    user: fred
    password: ""

keycloak:
  fullnameOverride: keycloak
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8080
  hostname: keycloak.playground.fredlab.dev
  admin:
    user: admin
    password: ""
  clients:
    controlPlane:
      secret: ""
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi
  # KC_PROXY=edge is included for compatibility with the requested generated prompt.
  # KC_PROXY_HEADERS=xforwarded is the effective modern Keycloak setting for GCE HTTPS termination.
  proxy: edge
  proxyHeaders: xforwarded
  health:
    enabled: true
    managementPort: 9000

openfga:
  enabled: true
  fullnameOverride: openfga
  replicaCount: 1
  service:
    type: ClusterIP
    httpPort: 8080
    grpcPort: 8081
    metricsPort: 2112
  auth:
    method: preshared
    apiToken: ""
  playground:
    enabled: false
    port: 3000
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 512Mi

temporal:
  enabled: true
  fullnameOverride: temporal
  service:
    type: ClusterIP
    grpcPort: 7233
    metricsPort: 9090
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi
  schema:
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        memory: 512Mi
  ui:
    enabled: true
    fullnameOverride: temporal-ui
    hostname: temporal.playground.fredlab.dev
    service:
      type: ClusterIP
      port: 8080
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        memory: 512Mi
    backendConfig:
      name: fredlab-temporal-ui-backendconfig
      healthCheck:
        requestPath: /
        port: 8080
        type: HTTP
        checkIntervalSec: 15
        timeoutSec: 5
        healthyThreshold: 1
        unhealthyThreshold: 3

adminAccess:
  # Cloud Armor policy created outside this chart and attached through BackendConfig.
  securityPolicyName: fredlab-admin-ui-allowlist
  allowedOperatorCidrs:
    dimitri: ""
    sebastien: ""
    simon: ""

controlPlane:
  enabled: false
  fullnameOverride: control-plane-backend
  replicaCount: 1
  image:
    # Example Artifact Registry image:
    # europe-west1-docker.pkg.dev/<project-id>/fredlab-repo/control-plane-backend
    repository: ""
    tag: ""
  service:
    type: ClusterIP
    port: 8080
  containerPort: 8222
  health:
    path: /healthz
  migration:
    enabled: false
    backoffLimit: 3
    command:
      - alembic
    args:
      - upgrade
      - head
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        memory: 512Mi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
  config:
    keycloakRealm: app
    keycloakInternalUrl: http://keycloak:8080
    keycloakIssuerUrl: https://keycloak.playground.fredlab.dev/realms/app
    keycloakClientId: control-plane
    openfgaUrl: http://openfga:8080
    openfgaStoreName: fred
    temporalAddress: temporal:7233
  extraEnv: {}

ingress:
  enabled: true
  name: fredlab-infra-ingress
  className: gce
  # Domain rendered in the GKE ManagedCertificate.
  domain: keycloak.playground.fredlab.dev
  keycloakHost: keycloak.playground.fredlab.dev
  # The reserved public IP address is documented here for operators.
  # GKE Ingress requires the GCP address resource name in the annotation below, not the literal IP.
  staticIpAddress: 8.233.26.38
  staticIpName: fredlab-playground-ip
  managedCertificateName: fredlab-infra-cert
  allowHttp: false
  path: /*
  backendConfig:
    enabled: true
    name: fredlab-keycloak-backendconfig
    healthCheck:
      requestPath: /realms/master
      port: 8080
      type: HTTP
      checkIntervalSec: 15
      timeoutSec: 5
      healthyThreshold: 1
      unhealthyThreshold: 3
