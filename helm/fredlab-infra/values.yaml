# Fredlab playground target.
cluster:
  name: fredlab-playground-gke
  namespace: default

nameOverride: ""
fullnameOverride: ""
imagePullPolicy: IfNotPresent

images:
  # pgvector is kept because Fred commonly expects PostgreSQL with vector support.
  postgres: pgvector/pgvector:pg17
  postgresClient: mirror.gcr.io/postgres:15.12-alpine3.20
  keycloak: quay.io/keycloak/keycloak:26.3.0
  openfga: openfga/openfga:v1.11.0
  opensearch: mirror.gcr.io/opensearchproject/opensearch:2.19.3
  temporalServer: mirror.gcr.io/temporalio/server:1.28.0
  temporalAdminTools: mirror.gcr.io/temporalio/admin-tools:1.28
  temporalUi: mirror.gcr.io/temporalio/ui:2.38.3

secret:
  fullnameOverride: fredlab-infra-secrets

# OpenAI-compatible LLM API key, shared by fred-agents and knowledge-flow when they
# use an `openai` provider model (e.g. Mistral's API at https://api.mistral.ai/v1).
# Optional: set the real token in fredlab-secrets.values.yaml. Empty = not configured.
openaiApiKey: ""

# Mistral API key used by the fred-agent-evaluator judge models (analysis +
# worker.judge_profiles). Optional: set in fredlab-secrets.values.yaml. Mistral
# wiring is still TBD; empty = not configured.
mistralApiKey: ""

# Langfuse keys for the evaluator, only consumed when fredEvaluation.config.tracer
# is set to "langfuse" (fredlab defaults to "logging", so these stay empty).
langfuse:
  publicKey: ""
  secretKey: ""

postgresql:
  fullnameOverride: postgres
  service:
    type: ClusterIP
    port: 5432
  persistence:
    storageClassName: standard-rwo
    size: 10Gi
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi
  admin:
    user: admin
    password: ""
  keycloak:
    database: keycloak
    user: keycloak_db_user
    password: ""
  openfga:
    database: openfga
    user: openfga
    password: ""
  temporal:
    database: temporal
    visibilityDatabase: temporal_visibility
    user: temporal
    password: ""
  fred:
    database: fred
    user: fred
    password: ""
  # Dedicated database for the fred-agent-evaluator (campaigns, cases, metrics).
  # Isolated from the shared `fred` database so the evaluator owns its own schema
  # and Alembic migration history.
  evaluation:
    database: evaluation
    user: evaluation
    password: ""

keycloak:
  fullnameOverride: keycloak
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8080
  hostname: keycloak.playground.fredlab.dev
  admin:
    user: admin
    password: ""
  clients:
    controlPlane:
      secret: ""
    knowledgeFlow:
      secret: ""
    agentic:
      secret: ""
    evaluation:
      secret: ""
    temporalUi:
      secret: ""
  provision:
    enabled: true
    realm: app
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    clients:
      app:
        clientId: app
        redirectUris:
          - https://studio.playground.fredlab.dev/*
        webOrigins:
          - https://studio.playground.fredlab.dev
      controlPlane:
        clientId: control-plane
        appRoles:
          - service_agent
        realmManagementRoles:
          - manage-users
          - view-users
          - query-users
          - query-groups
        accountRoles:
          - view-groups
      knowledgeFlow:
        # Confidential M2M client for knowledge-flow-backend. Needs the service_agent
        # app role so its M2M token is accepted by other Fred resource servers, plus
        # read-only realm-management/account roles so it can resolve a user's Keycloak
        # groups (a_get_group_by_path) when building ReBAC contextual relations.
        # Read-only: no manage-users (KF never modifies identities).
        clientId: knowledge-flow
        appRoles:
          - service_agent
        realmManagementRoles:
          - view-users
          - query-users
          - query-groups
        accountRoles:
          - view-groups
      agentic:
        # Confidential M2M client for fred-agents. Same shape as knowledge-flow:
        # service_agent app role + read-only group/user roles for ReBAC contextual
        # relations (proactively granted to avoid the group-read 403).
        clientId: agentic
        appRoles:
          - service_agent
        realmManagementRoles:
          - view-users
          - query-users
          - query-groups
        accountRoles:
          - view-groups
      evaluation:
        # Confidential M2M client for the fred-agent-evaluator. Needs the service_agent
        # app role so its M2M token is accepted by the control plane and agent runtimes
        # it evaluates. The evaluator does not use ReBAC, so no realm-management/account
        # group roles are required.
        clientId: evaluation
        appRoles:
          - service_agent
        realmManagementRoles: []
        accountRoles: []
      temporalUi:
        # Confidential, interactive OIDC client for the Temporal admin UI. Unlike the
        # M2M clients above it uses the browser authorization-code flow (standard flow),
        # has no service account and no app roles — it only proves the visitor holds a
        # valid Keycloak login. Provisioned only when temporal.ui.auth.enabled.
        clientId: temporal-ui
        redirectUris:
          - https://temporal.playground.fredlab.dev/*
        webOrigins:
          - https://temporal.playground.fredlab.dev
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi
  # KC_PROXY=edge is included for compatibility with the requested generated prompt.
  # KC_PROXY_HEADERS=xforwarded is the effective modern Keycloak setting for GCE HTTPS termination.
  proxy: edge
  proxyHeaders: xforwarded
  health:
    enabled: true
    managementPort: 9000

openfga:
  enabled: true
  fullnameOverride: openfga
  replicaCount: 1
  service:
    type: ClusterIP
    httpPort: 8080
    grpcPort: 8081
    metricsPort: 2112
  auth:
    method: preshared
    apiToken: ""
  playground:
    enabled: false
    port: 3000
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 512Mi

opensearch:
  enabled: true
  fullnameOverride: opensearch
  clusterName: fredlab-opensearch
  replicaCount: 1
  service:
    type: ClusterIP
    httpPort: 9200
    transportPort: 9300
    metricsPort: 9600
  persistence:
    storageClassName: standard-rwo
    size: 20Gi
    accessModes:
      - ReadWriteOnce
  config:
    # Single-node playground mode avoids cluster bootstrap complexity.
    discoveryType: single-node
    # Required on GKE Autopilot because node-level vm.max_map_count sysctl is not allowed.
    allowMmap: false
    # Internal-only playground service. Do not expose this service through Ingress.
    disableSecurityPlugin: true
    disableInstallDemoConfig: true
    javaOpts: -Xms1g -Xmx1g
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      memory: 3Gi

temporal:
  enabled: true
  fullnameOverride: temporal
  service:
    type: ClusterIP
    grpcPort: 7233
    metricsPort: 9090
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi
  schema:
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        memory: 512Mi
  ui:
    enabled: true
    fullnameOverride: temporal-ui
    hostname: temporal.playground.fredlab.dev
    managedCertificateName: fredlab-temporal-cert
    # OIDC authentication for the Temporal web UI. The UI has no built-in auth, so
    # without this it is reachable by anyone who can hit the Ingress. We front it with
    # Keycloak (the same `app` realm the rest of Fred uses) so a Keycloak login is
    # required before the UI is shown. Cloud-agnostic: no GCP-specific IAP involved.
    auth:
      enabled: true
      # Login button label shown on the Temporal sign-in screen.
      label: Keycloak
      # OIDC discovery base = Keycloak realm issuer. go-oidc appends
      # /.well-known/openid-configuration. Must be the PUBLIC issuer URL so the value
      # matches the `iss` in tokens the browser receives (Keycloak proxy=edge serves
      # this hostname). The temporal-ui pod must be able to reach this URL for the
      # server-side token exchange (egress to the Ingress IP / hairpin).
      providerUrl: https://keycloak.playground.fredlab.dev/realms/app
      # Confidential client provisioned in keycloak.provision.clients.temporalUi.
      clientId: temporal-ui
      scopes: openid,profile,email
      # Public URL Keycloak redirects back to after login. Path is fixed by the UI.
      callbackUrl: https://temporal.playground.fredlab.dev/auth/sso/callback
      # Authorization: restrict who may log in to the Temporal UI. When set, only users
      # holding this client role on the `app` client are allowed; everyone else is
      # denied AT THE KEYCLOAK LOGIN (a browser-flow override bound only to the
      # temporal-ui client — other clients like Studio are unaffected, and the Fred
      # services that talk to Temporal over gRPC are untouched). The Temporal UI itself
      # cannot filter by role, so the gate lives in Keycloak. Empty = any authenticated
      # realm user may enter.
      allowedAppRole: admin
    service:
      type: ClusterIP
      port: 8080
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        memory: 512Mi
    backendConfig:
      name: fredlab-temporal-ui-backendconfig
      healthCheck:
        requestPath: /
        port: 8080
        type: HTTP
        checkIntervalSec: 15
        timeoutSec: 5
        healthyThreshold: 1
        unhealthyThreshold: 3

adminAccess:
  # Temporal UI is now gated by Keycloak OIDC (see temporal.ui.auth), so no IP
  # allowlist is required. This is an OPTIONAL extra layer: set it to the name of an
  # EXISTING Cloud Armor security policy to also restrict the admin UIs by source IP.
  # Left empty on purpose — a name referencing a policy that was never created makes
  # the BackendConfig fail to sync, which is exactly how the UI ended up unprotected.
  securityPolicyName: ""

controlPlane:
  enabled: false
  fullnameOverride: control-plane-backend
  configMapName: control-plane-config
  replicaCount: 1
  image:
    # Example Artifact Registry image:
    # europe-west1-docker.pkg.dev/<project-id>/fredlab-repo/control-plane-backend
    repository: ""
    tag: ""
  service:
    type: ClusterIP
    port: 8080
  containerPort: 8222
  health:
    path: /control-plane/v1/healthz
  migration:
    enabled: false
    backoffLimit: 3
    command:
      - alembic
    args:
      - upgrade
      - head
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        memory: 512Mi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
  config:
    appBaseUrl: /control-plane/v1
    logLevel: info
    gcuVersion: v1
    defaultTeamMaxResourcesStorageSize: 5368709120
    personalMaxResourcesStorageSize: 5368709120
    keycloakRealm: app
    keycloakInternalUrl: http://keycloak:8080
    keycloakIssuerUrl: https://keycloak.playground.fredlab.dev/realms/app
    keycloakClientId: control-plane
    openfgaUrl: http://openfga:8080
    openfgaStoreName: fred
    temporalAddress: temporal:7233
    scheduler:
      enabled: true
      backend: temporal
      temporalNamespace: default
      temporalTaskQueue: control-plane-lifecycle
      temporalWorkflowIdPrefix: control-plane
      temporalConnectTimeoutSeconds: 5
    security:
      m2m:
        enabled: true
      user:
        enabled: true
        clientId: app
      authorizedOrigins:
        - https://keycloak.playground.fredlab.dev
        - https://studio.playground.fredlab.dev
        - https://control-plane.playground.fredlab.dev
      rebac:
        enabled: true
    # OpenSearch connection used as the KPI store backend for the analytics dashboard.
    # Same in-cluster, security-disabled OpenSearch as knowledge-flow (password ignored
    # by the server but must be non-empty; passed via OPENSEARCH_PASSWORD env).
    opensearch:
      host: http://opensearch:9200
      secure: false
      verifyCerts: false
      username: admin
      password: admin
    observability:
      log:
        enabled: true
      prometheus:
        enabled: false
        address: 0.0.0.0
        port: 9222
      # KPI OpenSearch sink: writes KPI events to OpenSearch AND backs the analytics
      # dashboard read queries. Disabled → presets return 503 "KPI store not available".
      opensearch:
        enabled: true
        index: kpi-index
      processMetricsIntervalSec: 0
    contentStorage:
      localRootPath: /tmp/control-plane-content
    frontend:
      featureFlags:
        enableK8Features: false
        enableElecWarfare: false
      uiSettings:
        siteDisplayName: Fredlab
        agentsNicknameSingular: agent
        agentsNicknamePlural: agents
    knowledgeFlowBaseUrl: http://knowledge-flow-backend:8080/knowledge-flow/v1
    runtimeCatalogSources:
      - runtimeId: fred-agents
        baseUrl: http://fred-agents:8080/fred/agents/v2
        enabled: true
        ingressPrefix: /fred/agents/v2
      - runtimeId: rags-agents
        baseUrl: http://rags-agents:8080/rags/agents/v2
        enabled: true
        ingressPrefix: /rags/agents/v2
      - runtimeId: dt-agents
        baseUrl: http://dt-agents:8080/dt/agents/v2
        enabled: true
        ingressPrefix: /dt/agents/v2
      - runtimeId: evaluation
        baseUrl: http://fred-evaluation-backend:8080/evaluation/v1
        enabled: true
        ingressPrefix: /evaluation/v1
  extraEnv: {}

knowledgeFlow:
  enabled: false
  fullnameOverride: knowledge-flow-backend
  configMapName: knowledge-flow-config
  replicaCount: 1
  # Kubernetes service account annotated for Workload Identity. The GSA must hold
  # roles/storage.objectAdmin on the GCS buckets (see bin/fredlab-gcp-gcs-prereqs.sh).
  serviceAccount:
    name: knowledge-flow-backend
    # fredlab-knowledge-flow-gcs@<project-id>.iam.gserviceaccount.com
    gcpServiceAccount: ""
  image:
    # Example Artifact Registry image:
    # europe-west1-docker.pkg.dev/<project-id>/fredlab-repo/knowledge-flow-backend
    repository: ""
    tag: ""
  service:
    type: ClusterIP
    port: 8080
  containerPort: 8111
  metricsPort: 9111
  health:
    path: /knowledge-flow/v1/healthz
  migration:
    # Runs `alembic upgrade head` (KF version table alembic_version_knowledge_flow)
    # to create the metadata/tag/resource tables in the fred database.
    enabled: false
    backoffLimit: 3
    command:
      - alembic
    args:
      - upgrade
      - head
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        memory: 512Mi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi
  config:
    appBaseUrl: /knowledge-flow/v1
    logLevel: info
    keycloakInternalUrl: http://keycloak:8080
    keycloakIssuerUrl: https://keycloak.playground.fredlab.dev/realms/app
    keycloakClientId: knowledge-flow
    userClientId: app
    authorizedOrigins:
      - https://studio.playground.fredlab.dev
    openfgaUrl: http://openfga:8080
    openfgaStoreName: fred
    temporalAddress: temporal:7233
    temporalNamespace: default
    temporalTaskQueue: ingestion
    storage:
      # Content store: bucket_name is suffixed at runtime with -documents/-objects/-files.
      contentBucketName: fredlab-playground-content
      # Virtual filesystem bucket.
      filesystemBucketName: fredlab-playground-knowledge-flow
      filesystemPrefix: ""
      # Empty → inferred from ADC / Workload Identity.
      projectId: ""
      # SA email that signs V4 signed URLs for tabular Parquet reads (IAM signBlob
      # via Workload Identity). Empty → defaults to serviceAccount.gcpServiceAccount,
      # which the prereq script grants serviceAccountTokenCreator on itself.
      signingServiceAccountEmail: ""
    # OpenSearch is the vector store (hybrid/semantic search). The in-cluster
    # OpenSearch runs with the security plugin disabled → plain HTTP, no real auth.
    opensearch:
      host: http://opensearch:9200
      secure: false
      verifyCerts: false
      username: admin
      # Ignored by the security-disabled server, but must be non-empty.
      password: admin
      # The vector index. Tied to the embedding model's dimensions — if you change
      # the embedding model, use a new index name. Tracked in STORAGE-INVENTORY.md.
      vectorIndex: knowledge-flow-vectors
      vectorBulkSize: 1000
    # Vertex AI models (authenticate via ADC). Needs roles/aiplatform.user on the GSA.
    models:
      # Empty project → resolved from ADC. Location must be a Vertex AI region.
      project: ""
      location: europe-west4
      chat:
        provider: vertex-ai-model-garden
        name: mistral-small-2503
        modelFamily: mistral
      embedding:
        provider: vertex-ai
        name: text-embedding-005
      vision:
        provider: vertex-ai
        name: gemini-2.5-flash

# knowledge-flow-worker: the Temporal worker that drains the `ingestion` task queue.
# The knowledge-flow-backend API submits ingestion workflows; this worker executes
# them (parse → embed → index). It runs the SAME image as knowledgeFlow but with the
# `main_worker` entrypoint, and REUSES the knowledge-flow-config ConfigMap so the
# task queue, Temporal address, models, GCS buckets and storage all match the API.
# It serves no HTTP API — only Prometheus metrics — so it has no Service/Ingress.
knowledgeFlowWorker:
  enabled: false
  fullnameOverride: knowledge-flow-worker
  replicaCount: 1
  # Kubernetes service account annotated for Workload Identity. The GSA must hold
  # roles/storage.objectAdmin on the GCS buckets AND roles/aiplatform.user (the worker
  # is what calls Vertex AI for embeddings/vision). WI binding for the KSA named here
  # is created by bin/fredlab-gcp-gcs-prereqs.sh (KSA_NAMES includes knowledge-flow-worker).
  serviceAccount:
    name: knowledge-flow-worker
    # fredlab-knowledge-flow-gcs@<project-id>.iam.gserviceaccount.com (same GSA as the backend)
    gcpServiceAccount: ""
  image:
    # Same image as knowledgeFlow.image (knowledge-flow-backend). Pin to the tag you
    # want the worker to run — usually identical to the backend tag.
    repository: ""
    tag: ""
  # Worker does the heavy lifting (document parsing + embeddings), so it gets more
  # headroom than the API pod.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 3Gi

# fred-agent-evaluator backend: FastAPI/uvicorn serving /evaluation/v1 on port 8336.
# Submits evaluation campaign workflows onto the `evaluation` Temporal task queue; the
# fredEvaluationWorker drains them. Uses the dedicated `evaluation` Postgres database
# and its own Keycloak `evaluation` M2M client. No GCS/Vertex → no Workload Identity.
fredEvaluation:
  enabled: false
  fullnameOverride: fred-evaluation-backend
  configMapName: fred-evaluation-config
  replicaCount: 1
  serviceAccount:
    name: fred-evaluation-backend
  image:
    # europe-west1-docker.pkg.dev/<project-id>/fredlab-repo/fred-evaluation-api
    repository: ""
    tag: ""
  service:
    type: ClusterIP
    port: 8080
  containerPort: 8336
  health:
    path: /evaluation/v1/healthz
  migration:
    # Runs `alembic upgrade head` (version table alembic_version_evaluation) to create
    # the campaign/case/metric tables in the dedicated `evaluation` database.
    enabled: false
    backoffLimit: 3
    command:
      - alembic
    args:
      - upgrade
      - head
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        memory: 512Mi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
  config:
    appBaseUrl: /evaluation/v1
    logLevel: info
    keycloakIssuerUrl: https://keycloak.playground.fredlab.dev/realms/app
    keycloakClientId: evaluation
    userClientId: app
    authorizedOrigins:
      - https://studio.playground.fredlab.dev
    # In-cluster control plane. runtimeBaseUrl is the agent runtime the evaluator
    # exercises when running campaigns.
    controlPlaneBaseUrl: http://control-plane-backend:8080/control-plane/v1
    runtimeBaseUrl: http://fred-agents:8080
    temporalAddress: temporal:7233
    temporalNamespace: default
    temporalTaskQueue: evaluation
    # fredlab has no Langfuse deployed; use plain logging like the other components.
    # Set to "langfuse" and populate langfuse.* secrets to enable tracing.
    tracer: logging
    langfuseHost: http://langfuse:3000
    worker:
      maxConcurrentCases: 4
      pollIntervalSeconds: 5

# fred-agent-evaluator worker: the Temporal worker that drains the `evaluation` task
# queue. Runs the SEPARATE fred-evaluation-worker image (not the API image) with the
# main_worker entrypoint, and REUSES the fred-evaluation-config ConfigMap so its
# Temporal/Postgres/judge settings match the backend. No Service/Ingress.
fredEvaluationWorker:
  enabled: false
  fullnameOverride: fred-evaluation-worker
  replicaCount: 1
  serviceAccount:
    name: fred-evaluation-worker
  image:
    # europe-west1-docker.pkg.dev/<project-id>/fredlab-repo/fred-evaluation-worker
    repository: ""
    tag: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi

# fred-agents: a Fred agent runtime serving agents at /fred/agents/v2. The control
# plane discovers it via runtimeCatalogSources (baseUrl http://fred-agents:8080/...).
# Models/MCP come from the image-bundled catalogs (FRED_MODELS_CATALOG_FILE default).
fredAgents:
  enabled: false
  fullnameOverride: fred-agents
  configMapName: fred-agents-config
  replicaCount: 1
  serviceAccount:
    name: fred-agents
    # Reuses the GSA that already has roles/aiplatform.user (Vertex via Workload
    # Identity). fred-agents object/GCS access is not required.
    gcpServiceAccount: ""
  image:
    # europe-west1-docker.pkg.dev/<project-id>/fredlab-repo/fred-agents
    repository: ""
    tag: ""
  service:
    type: ClusterIP
    port: 8080
  containerPort: 8000
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
  config:
    appBaseUrl: /fred/agents/v2
    logLevel: info
    openaiCompat: true
    keycloakIssuerUrl: https://keycloak.playground.fredlab.dev/realms/app
    keycloakClientId: agentic
    userClientId: app
    authorizedOrigins:
      - https://studio.playground.fredlab.dev
    openfgaUrl: http://openfga:8080
    openfgaStoreName: fred
    knowledgeFlowUrl: http://knowledge-flow-backend:8080/knowledge-flow/v1
    controlPlaneUrl: http://control-plane-backend:8080/control-plane/v1
    # Durable runtime store. The LangGraph checkpointer + session history persist to the
    # shared `fred` Postgres DB — the configmap renders storage.postgres from the global
    # postgresql.* values (host/port/database/user), same as control-plane/knowledge-flow.
    # No sqlite_path → fred-core uses real Postgres; tables auto-create on first use (no
    # migration job). (Previously sqlite on an emptyDir, which lost conversations on every
    # pod restart.)
    opensearch:
      host: http://opensearch:9200
      secure: false
      verifyCerts: false
      username: admin
      password: admin
    # No Langfuse in fredlab — use plain logging tracer.
    tracer: logging

fredFrontend:
  enabled: false
  # Studio L7 entrypoint (Ingress host-rule + ManagedCertificate + BackendConfig) is
  # gated on THIS toggle, not `enabled`, so the workload can move to the ArgoCD-owned
  # fred-apps chart while the infra layer keeps owning the public studio URL + cert.
  # The Ingress routes to the `fred-frontend` Service by name regardless of who creates
  # it. Keep true whenever studio should be reachable; `enabled` only controls the
  # in-cluster Deployment/Service/ConfigMaps.
  ingressEnabled: true
  fullnameOverride: fred-frontend
  replicaCount: 1
  hostname: studio.playground.fredlab.dev
  managedCertificateName: fredlab-studio-cert
  image:
    # Example Artifact Registry image:
    # europe-west1-docker.pkg.dev/<project-id>/fredlab-repo/fred-frontend
    repository: ""
    tag: ""
  service:
    type: ClusterIP
    port: 8080
  containerPort: 8080
  upstreams:
    controlPlane: http://control-plane-backend:8080
    # nginx resolves upstream DNS names at startup, so each target must be a
    # service that already exists. Both knowledge-flow-backend and fred-agents are
    # now deployed by this chart, so the frontend points at them directly.
    fredAgents: http://fred-agents:8080
    knowledgeFlow: http://knowledge-flow-backend:8080
  clientMaxBodySize: 150m
  config:
    # Static pre-auth frontend configuration. It is served as /config.json
    # before the user has accepted CGU, so values needed by guards must live
    # here and not only in the authenticated control-plane bootstrap.
    configMapName: fred-frontend-config
    frontendBasename: /
    releaseBrand: fredlab
    featureFlags: {}
    properties: {}
  legal:
    # Public Markdown content served by nginx instead of the generic files
    # bundled in the frontend image. These files are not secrets and should be
    # reviewed/versioned with the deployment repository.
    enabled: true
    configMapName: fred-frontend-legal
    files:
      gcuFr: legal/gcu.fr.md
      gcuEn: legal/gcu.md
      gdprFr: legal/gdpr.fr.md
      gdprEn: legal/gdpr.md
  health:
    path: /config.json
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
  backendConfig:
    name: fredlab-frontend-backendconfig
    # L7 LB backend request timeout (seconds). Default is 30s, which cuts long SSE
    # chat streams mid-answer; 600s lets agent responses stream to completion.
    timeoutSec: 600
    healthCheck:
      requestPath: /config.json
      port: 8080
      type: HTTP
      checkIntervalSec: 15
      timeoutSec: 5
      healthyThreshold: 1
      unhealthyThreshold: 3

ingress:
  enabled: true
  name: fredlab-infra-ingress
  className: gce
  # Historical single-domain value kept for compatibility.
  domain: keycloak.playground.fredlab.dev
  keycloakHost: keycloak.playground.fredlab.dev
  extraManagedCertificates: []
  # The reserved public IP address is documented here for operators.
  # GKE Ingress requires the GCP address resource name in the annotation below, not the literal IP.
  staticIpAddress: 8.233.26.38
  staticIpName: fredlab-playground-ip
  managedCertificateName: fredlab-infra-cert
  allowHttp: false
  path: /*
  backendConfig:
    enabled: true
    name: fredlab-keycloak-backendconfig
    healthCheck:
      requestPath: /realms/master
      port: 8080
      type: HTTP
      checkIntervalSec: 15
      timeoutSec: 5
      healthyThreshold: 1
      unhealthyThreshold: 3
