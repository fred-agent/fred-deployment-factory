# Défauts podman des VMs Fred, en défense en profondeur : s'appliquent aussi aux
# conteneurs lancés hors des compose (podman run de diagnostic, par exemple).
# Les compose fixent en plus, par service : cap_drop ALL, no-new-privileges,
# tmpfs et limites mémoire (podman n'a pas de défaut global pour ces réglages).
[containers]
# Racine des conteneurs en lecture seule ; "podman run --read-only=false" pour un
# besoin ponctuel.
read_only = true
# Séparation SELinux (container_t, volumes :Z) sur les VMs RHEL en enforcing.
label = true
# Plafond de processus par conteneur (anti fork-bomb).
pids_limit = 2048
