# enable-template
# Configuration de temporal-server (fred-app-01). L'image ne contient que le binaire :
# pas de script d'entrée ni de dockerize, ce fichier remplace leur rendu.
# Rendu de config_template.yaml (temporalio/docker-builds), épuré :
# - Postgres en TLS vérifié (verify-full) vers fred-sto-01 ;
# - adresse annoncée fixe (@TEMPORAL_IP@, voir compose.yaml) : pas de découverte d'IP
#   par shell, et la VM qui redémarre retrouve son propre membre en base ;
# - archivage désactivé ; un seul nœud, donc pas de TLS inter-nœuds.
# Le mot de passe vient de l'environnement (secrets/temporal.env), jamais du fichier :
# la première ligne active le modèle Go intégré à temporal-server.
log:
  stdout: true
  level: info

persistence:
  numHistoryShards: 4
  defaultStore: default
  visibilityStore: visibility
  datastores:
    default:
      sql:
        pluginName: postgres12
        databaseName: temporal
        connectAddr: "@STO_FQDN@:5432"
        connectProtocol: tcp
        user: temporal
        password: '{{ env "POSTGRES_PWD" }}'
        maxConns: 20
        maxIdleConns: 20
        maxConnLifetime: 1h
        tls:
          enabled: true
          caFile: /etc/fred/tls/ca.crt
          enableHostVerification: true
          serverName: "@STO_FQDN@"
    visibility:
      sql:
        pluginName: postgres12
        databaseName: temporal_visibility
        connectAddr: "@STO_FQDN@:5432"
        connectProtocol: tcp
        user: temporal
        password: '{{ env "POSTGRES_PWD" }}'
        maxConns: 10
        maxIdleConns: 10
        maxConnLifetime: 1h
        tls:
          enabled: true
          caFile: /etc/fred/tls/ca.crt
          enableHostVerification: true
          serverName: "@STO_FQDN@"

global:
  membership:
    maxJoinDuration: 30s
    broadcastAddress: "@TEMPORAL_IP@"

services:
  frontend:
    rpc:
      grpcPort: 7233
      membershipPort: 6933
      bindOnIP: 0.0.0.0
      httpPort: 7243
  matching:
    rpc:
      grpcPort: 7235
      membershipPort: 6935
      bindOnIP: 0.0.0.0
  history:
    rpc:
      grpcPort: 7234
      membershipPort: 6934
      bindOnIP: 0.0.0.0
  worker:
    rpc:
      grpcPort: 7239
      membershipPort: 6939
      bindOnIP: 0.0.0.0

clusterMetadata:
  enableGlobalNamespace: false
  failoverVersionIncrement: 10
  masterClusterName: active
  currentClusterName: active
  clusterInformation:
    active:
      enabled: true
      initialFailoverVersion: 1
      rpcName: frontend
      rpcAddress: 127.0.0.1:7233
      httpAddress: 127.0.0.1:7243

dcRedirectionPolicy:
  policy: noop

archival:
  history:
    state: disabled
  visibility:
    state: disabled

namespaceDefaults:
  archival:
    history:
      state: disabled
    visibility:
      state: disabled
