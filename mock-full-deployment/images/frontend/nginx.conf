# nginx du frontend durci : racine en lecture seule, tout ce qui s'écrit est dans
# /tmp (tmpfs). Le bloc server est généré au démarrage par l'entrypoint de Fred
# dans FRONTEND_NGINX_CONFIG (/tmp/fred.conf).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    include /tmp/fred.conf;
}
